<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>星月栖 · Stelluna</title>
<meta name="theme-color" content="#0f0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link href="remixicon.css" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #DCECFC;
  --surface: #75ABE0;
  --surface2: #C8D9EF;
  --border: #F2F7FF;
  --text: #436999;
  --text2: #0F3266;
  --accent: #8CB9E6;
  --accent2: #69A0D6;
  --user-bg: rgba(200,217,239,0.45);
  --ai-bg: rgba(247, 252, 255, 0.65);
  --danger: #ED7E7E;
  --success: #76E3D2;
  --header-bg: rgba(255, 255, 255, 0.55);
  --header-border: rgba(255, 255, 255, 0.3);
  --header-text: #436999;
  --user-text: #074270;
  --ai-text: #3C77B0;
  --input-text: #074270;
  --input-area-bg: rgba(255, 255, 255, 0.55);
  --input-area-border: rgba(255, 255, 255, 0.3);
  --radius: 15px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
[data-theme="wx"] {
  --bg: #EDEDED;
  --surface: #EDEDED;
  --surface2: #F7F7F7;
  --border: #E0E0E0;
  --text: #111111;
  --text2: #888888;
  --accent: #07C160;
  --accent2: #06AD56;
  --user-bg: #95EC69;
  --ai-bg: #FFFFFF;
  --header-bg: #EDEDED;
  --header-border: #D9D9D9;
  --header-text: #111111;
  --user-text: #111111;
  --ai-text: #111111;
  --input-text: #111111;
  --input-area-bg: #F7F7F7;
  --input-area-border: #F7F7F7;
}
[data-theme="wx"] body {
  background-image: none;
  background-color: #EDEDED;
}
html, body {
  height:100%; 
  background-image: url('./bg.png');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  color: #436999;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow:hidden;
}
#app { display:flex; flex-direction:column; height:100%; }

/* ====== Lock Screen ====== */
#lock-screen {
  position:fixed; inset:0; background:var(--bg);
  z-index:999; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:12px; padding:20px;
}
#lock-screen.hidden { display:none; }
#lock-screen .lock-emoji { font-size:48px; margin-bottom:8px; }
#lock-screen h2 { font-size:18px; color:var(--text); }
#lock-screen .lock-subtitle { font-size:13px; color:var(--text2); margin-bottom:8px; }
#lock-screen input {
  width:220px; background:var(--surface2); border:1px solid var(--border);
  color:var(--text); padding:12px 16px; border-radius:12px;
  font-size:18px; text-align:center; outline:none;
  letter-spacing:6px; -webkit-text-security:disc;
}
#lock-screen input:focus { border-color:var(--accent); }
#lock-screen .lock-btn {
  background:var(--accent); border:none; color:white;
  padding:10px 32px; border-radius:10px; font-size:15px;
  cursor:pointer; margin-top:4px;
}
#lock-screen .lock-error {
  color:var(--danger); font-size:13px; min-height:20px;
}
#lock-screen .lock-reset {
  font-size:12px; color:var(--text2); cursor:pointer;
  margin-top:24px; text-decoration:underline;
}
  
/* ====== Header ====== */
#header {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 16px; 
  background: var(--header-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--header-border);
  padding-top: max(10px, env(safe-area-inset-top));
}
.header-left { display:flex; align-items:center; gap:8px; }
.header-right { display:flex; align-items:center; gap:2px; }
.header-avatar {
  width:42px; height:42px; border-radius:50%;
  overflow:hidden;
}
.header-avatar img {
  width:100%; height:100%; object-fit:cover;
}
#header .header-right button {
  background:none; border:none; color: rgba(21,86,161,1.00);
  font-size:25px; padding:6px; cursor:pointer; opacity:0.6;
}
#header .header-right button:hover { opacity:1; }


/* ====== Messages ====== */
#messages {
  flex:1; overflow-y:auto; padding:12px 10px;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling: touch;
}
.msg {
  display:flex; flex-direction:column; margin-bottom:12px;
  max-width:100%; animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
.msg.user { align-self:flex-end; align-items:flex-end; }
.msg.ai { align-self:flex-start; align-items:flex-start; }
.msg.proactive { opacity:0.9; }
.msg-bubble {
  display: inline-block;
  max-width: 83%;
  padding: 10px 14px;
  border-radius: 22px;
  font-size: 18px;
  font-weight: 500;
  line-height: 1.4;
  word-break: break-word;
  background: rgba(255, 255, 255, 0.55);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.4);
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
}
.msg.user .msg-bubble {
  color: var(--user-text); background:var(--user-bg);
  border-bottom-right-radius:4px;
}
.msg.ai .msg-bubble {
  color: var(--ai-text); background:var(--ai-bg);
  border-top-left-radius:4px;
}
.msg-time { font-size:13px; color:var(--text2); padding:0; }
.msg-bubble p { margin:0.4em 0; }
.msg-bubble p:first-child { margin-top:0; }
.msg-bubble p:last-child { margin-bottom:0; }
.msg-bubble code {
  background:rgba(240,248,299,1); padding:1px 5px;
  border-radius:4px; font-size:13px;
}
.msg-bubble pre {
  background:rgba(240,248,255,0.65); padding:10px;
  border-radius:8px; overflow-x:auto; margin:0.5em 0;
  position: relative;
}
.msg-bubble pre code { background:none; padding:0; }
.code-header {
  display:flex; justify-content:space-between; align-items:center;
  padding:4px 10px; background:rgba(240,248,255,0.65);
  border-radius:8px 8px 0 0; font-size:15px; color:var(--text2);
}
.code-header .copy-btn {
  background:none; border:1px solid var(--border);
  color:var(--text2); font-size:15px; padding:2px 8px;
  border-radius:4px; cursor:pointer;
}
.code-header .copy-btn:hover { color:var(--accent); border-color:var(--accent); }
.code-collapse pre {
  max-height:300px; overflow-y:auto;
}
.code-collapse.collapsed pre {
  max-height:120px; overflow:hidden;
}
.code-expand-btn {
  text-align:center; padding:4px; font-size:18px;
  color:var(--accent); cursor:pointer;
  background:rgba(240,248,299,1); border-radius:0 0 8px 8px;
}
.msg-bubble pre code { background:none; padding:0; }
.msg-bubble blockquote {
  border-left:3px solid var(--accent); padding-left:10px;
  color:var(--text2); margin:0.5em 0; font-style:italic;
}
.msg-bubble em { color:#BDA3CC; }
.msg-bubble strong { color:#0A3080; }
.msg-bubble[contenteditable=true] {
  outline:1px solid var(--accent);
  border-radius:var(--radius);
}
.edit-textarea {
  width:100%;
  min-width:260px;
  min-height:160px;
  background:transparent;
  border:none;
  color:inherit;
  font:inherit;
  line-height:1.5;
  resize:vertical;
  outline:none;
  white-space:pre-wrap;
}
.msg.segment-bubble { margin-bottom:6px; }
.msg.segment-bubble + .msg.segment-bubble { margin-top:0; }
.msg.pending .msg-bubble {
  opacity:0.65;
  border:1px dashed var(--accent);
  background: rgba(200,217,239,0.2);
}
.msg.pending .msg-actions {
  display:flex;
}
.msg-bubble ol {
  list-style-position: inside;
  padding-left: 4px;
}
.msg-bubble ul {
  list-style-position: inside;
  padding-left: 4px;
}
  
.msg-actions {
  display:none; gap:6px; align-items:center;
}
.msg-actions.show {
  display:flex;
}
.msg-meta {
  display:flex; align-items:center; gap:8px; margin-top:3px; padding:0 4px;
}
.msg-actions button {
  background:var(--surface2); border:1px solid var(--border);
  color:var(--text2); font-size:15px; padding:2px 8px;
  border-radius:6px; cursor:pointer;
}
.version-nav { font-size:13px; color:var(--text2); }
.edit-actions { display:flex; gap:6px; margin-top:4px; }
.edit-actions button {
  font-size:13px; padding:3px 10px; border-radius:6px;
  border:none; cursor:pointer;
}
.edit-save { background:var(--accent); color:white; }
.edit-cancel { background:var(--surface2); color:var(--text2); border:1px solid var(--border) !important; }
.msg-image {
  max-width:200px; max-height:200px; border-radius:8px;
  margin:4px 0; cursor:pointer;
}
.stop-btn {
  display: inline-block;
  margin: 4px 0 4px 48px;
  padding: 4px 12px;
  background: var(--danger, #e74c3c);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 12px;
  cursor: pointer;
  opacity: 0.8;
}
.stop-btn:hover {
  opacity: 1;
}

/* ====== Thinking ====== */
.thinking-block {
  margin-bottom:8px; border:1px solid var(--border);
  border-radius:8px; overflow:hidden;
}
.thinking-toggle {
  padding:6px 10px; font-size:15px; color:var(--text2);
  cursor:pointer; background:rgba(255,255,255,0.03);
  user-select:none;
}
.thinking-arrow {
  display:inline-block; transition:transform 0.2s;
  font-size:10px;
}
.thinking-arrow.open { transform:rotate(deg); }
.thinking-content {
  display:none; padding:8px 10px; font-size:13px;
  color:var(--text2); line-height:1.5;
  max-height:300px; overflow-y:auto;
  white-space:pre-wrap; word-break:break-word;
  border-top:1px solid var(--border);
}
.thinking-content.show { display:block; }

/* ====== Input Area ====== */
#input-area {
  display:flex; align-items:flex-end; gap:8px;
  padding:10px 12px;
  background: var(--input-area-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--input-area-border);
}
#input {
  flex:1; background: rgba(255,255,255,1.00); border:1px solid var(--border);
  color: var(--input-text); border-radius:20px; padding:10px 16px;
  font-size:18px; line-height:1.2; resize:none; font-weight: 500;
  max-height:500px; outline:none; font-family:inherit;
}
#input:focus { border-color:var(--accent); }
#input::placeholder { color:var(--text2); }
.input-actions { display:flex; gap:6px; align-items:flex-end; }
#img-btn, #file-btn {
  background:none; border:none; color: rgba(21,86,161,1.00);
  font-size:22px; cursor:pointer; padding:6px;
}
#img-btn:hover, #file-btn:hover { color:var(--accent); }
#send-btn {
  background: rgba(21,86,161,1.00); border:none; color:white;
  width:42px; height:42px; border-radius:50%; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:18px; flex-shrink:0;
}
#send-btn:disabled { opacity:0.4; }
#img-preview {
  display:none; padding:6px 12px; background:var(--surface);
  border-top:1px solid var(--border);
}
#img-preview img {
  max-height:60px; border-radius:6px; margin-right:8px;
}
#img-preview .remove-img {
  background:var(--danger); color:white; border:none;
  border-radius:4px; font-size:11px; padding:2px 8px;
  cursor:pointer; vertical-align:top;
}

/* ====== Panels (Memory / Wallet/ Settings) ====== */
.panel-overlay {
  display:none; position:fixed; inset:0; 
  background: rgba(255, 255, 255, 0.6);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  z-index:100; overflow-y:auto;
  padding: max(12px, env(safe-area-inset-top)) 16px 32px;
}
.panel-overlay.show { display:block; }
.panel-header {
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:20px;
}
.panel-header h2 { font-size:18px; }
.panel-header button {
  background:var(--accent); border:none; color:white;
  padding:6px 16px; border-radius:8px; font-size:10px; cursor:pointer;
}
.setting-group { margin-bottom:20px; }
.setting-group label {
  display:block; font-size:13px; color:var(--text2);
  margin-bottom:5px;
}
.setting-group input, .setting-group textarea, .setting-group select {
  width:100%; background:var(--surface2); border:1px solid var(--border);
  color:var(--text); padding:10px 12px; border-radius:10px;
  font-size:14px; font-family:inherit; outline:none;
}
.setting-group textarea { min-height:120px; resize:vertical; line-height:1.5; }
.setting-row {
  display:flex; gap:8px; align-items:center; margin-bottom:8px;
}
.setting-row input { flex:1; }
.small-btn {
  background:var(--surface2); border:1px solid var(--border);
  color:var(--text); padding:8px 12px; border-radius:8px;
  cursor:pointer; font-size:13px; white-space:nowrap;
}
.small-btn:hover { border-color:var(--accent); }
.small-btn.active { background:var(--accent); color:white; border-color:var(--accent); }
.small-btn.danger { color:var(--danger); }
.small-btn.danger:hover { background:var(--danger); color:white; }

/* ====== Model Picker ====== */
.model-picker { position:relative; }
.model-picker input { padding-right:36px; }
.model-picker .refresh-btn {
  position:absolute; right:10px; top:50%; transform:translateY(-50%);
  background:none; border:none; color:var(--text2); cursor:pointer;
  font-size:16px;
}
.model-dropdown {
  display:none; position:absolute; top:100%; left:0; right:0;
  background:var(--surface2); border:1px solid var(--border);
  border-radius:10px; max-height:300px; overflow-y:auto;
  z-index:10; margin-top:4px;
}
.model-dropdown.show { display:block; }
.model-dropdown .model-search {
  width:100%; padding:8px 12px; background:var(--surface);
  border:none; border-bottom:1px solid var(--border);
  color:var(--text); font-size:13px; outline:none;
  border-radius:10px 10px 0 0;
}
.model-item {
  padding:8px 12px; cursor:pointer; font-size:13px;
  display:flex; justify-content:space-between; align-items:center;
  border-bottom:1px solid rgba(255,255,255,0.03);
}
.model-item:hover { background:rgba(255,255,255,0.05); }
.model-item .star {
  cursor:pointer; font-size:14px; color:var(--text2);
}
.model-item .star.faved { color:#f0c040; }
.model-section-title {
  padding:6px 12px; font-size:11px; color:var(--text2);
  background:rgba(255,255,255,0.02); font-weight:600;
}

/* ====== Slider ====== */
.slider-group { display:flex; align-items:center; gap:10px; }
.slider-group input[type=range] {
  flex:1; accent-color:var(--accent);
}
.slider-value {
  font-size:13px; color:var(--accent); min-width:36px; text-align:center;
}

/* ====== Toggle ====== */
.toggle-row {
  display:flex; justify-content:space-between; align-items:center;
  padding:8px 0;
}
.toggle-row label { font-size:14px; }
.toggle {
  width:44px; height:24px; background:var(--surface2);
  border:1px solid var(--border); border-radius:12px;
  cursor:pointer; position:relative; transition:background 0.2s;
}
.toggle.on { background:var(--accent); border-color:var(--accent); }
.toggle::after {
  content:''; position:absolute; width:18px; height:18px;
  background:white; border-radius:50%; top:2px; left:2px;
  transition:transform 0.2s;
}
.toggle.on::after { transform:translateX(20px); }

/* ====== Memory Panel ====== */
.memory-tabs {
  display:flex; gap:8px; margin-bottom:16px;
}
.memory-tab {
  padding:8px 16px; border-radius:8px; cursor:pointer;
  background:var(--surface2); border:1px solid var(--border);
  color:var(--text2); font-size:13px;
}
.memory-tab.active { background:var(--accent); color:white; border-color:var(--accent); }
.memory-card {
  background:var(--surface2); border:1px solid var(--border);
  border-radius:10px; padding:12px; margin-bottom:10px;
}
.memory-card h4 {
  font-size:14px; margin-bottom:6px; color:var(--accent);
}
.memory-card p {
  font-size:13px; color:var(--text2); line-height:1.5;
  white-space:pre-wrap; word-break:break-word;
}
.memory-card .meta {
  font-size:11px; color:var(--text2); margin-top:6px;
  display:flex; gap:8px;
}
.memory-card .card-actions {
  display:flex; gap:6px; margin-top:8px;
}

/* ====== Wallet Panel ====== */
.wallet-balance {
  text-align:center; padding:24px; background:var(--surface2);
  border-radius:14px; margin-bottom:20px;
}
.wallet-balance .amount {
  font-size:36px; font-weight:700; color:var(--accent);
}
.wallet-balance .label {
  font-size:13px; color:var(--text2); margin-top:4px;
}
.tx-item {
  display:flex; justify-content:space-between; align-items:center;
  padding:10px 0; border-bottom:1px solid var(--border);
  font-size:13px;
}
.tx-item .tx-desc { color:var(--text2); }
.tx-item .tx-amount { font-weight:600; }
.tx-item .tx-amount.positive { color:var(--success); }
.tx-item .tx-amount.negative { color:var(--danger); }

/* ====== Red Packet ====== */
.red-packet-overlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.7); z-index:200;
  align-items:center; justify-content:center;
}
.red-packet-overlay.show { display:flex; }
.red-packet {
  width:280px; background:linear-gradient(135deg, #e74c3c, #c0392b);
  border-radius:16px; padding:32px 24px; text-align:center;
  color:white; position:relative; animation:packetIn 0.4s ease;
}
@keyframes packetIn { from{transform:scale(0.5);opacity:0} to{transform:scale(1);opacity:1} }
.red-packet h3 { font-size:16px; margin-bottom:8px; opacity:0.9; }
.red-packet .rp-amount { font-size:42px; font-weight:700; margin:16px 0; }
.red-packet .rp-msg { font-size:14px; opacity:0.85; margin-bottom:20px; }
.red-packet .rp-close {
  background:rgba(255,255,255,0.2); border:none; color:white;
  padding:8px 24px; border-radius:20px; cursor:pointer; font-size:14px;
}

/* ====== Provider Tags ====== */
.provider-tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
.provider-tag {
  padding:4px 10px; border-radius:6px; font-size:12px;
  background:var(--surface2); border:1px solid var(--border);
  color:var(--text2); cursor:pointer;
}
.provider-tag.active { background:var(--accent); color:white; border-color:var(--accent); }
.provider-tag .remove {
  margin-left:4px; cursor:pointer; opacity:0.6;
}
.provider-tag .remove:hover { opacity:1; }

/* ====== Pool ====== */
.pool-item {
  display:flex; align-items:center; gap:6px;
  padding:6px 10px; background:var(--surface2);
  border:1px solid var(--border); border-radius:8px;
  margin-bottom:6px; font-size:13px;
}
.pool-item .pool-label { flex:1; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pool-item button { background:none; border:none; color:var(--text2); cursor:pointer; font-size:14px; padding:2px 4px; }
.pool-item button:hover { color:var(--accent); }
.pool-add { display:flex; gap:6px; margin-top:6px; }
.pool-add select {
  flex:1; background:var(--surface2); border:1px solid var(--border);
  color:var(--text); padding:6px 10px; border-radius:8px; font-size:13px; outline:none;
}

/* ====== Status Bar ====== */
#status-bar {
  font-size:11px; color:var(--text2); text-align:center;
  padding:2px 8px; background:var(--surface);
  border-top:1px solid var(--border);
  display:none;
}
#status-bar.show { display:block; }

/* ====== Search Bar ====== */
#search-bar {
  display:flex; align-items:center; gap:6px;
  padding:8px 12px;
  background: var(--header-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--header-border);
}
#search-bar input {
  flex:1; padding:6px 10px;
  border:1px solid rgba(255,255,255,0.3);
  border-radius:8px;
  background: rgba(255,255,255,0.1);
  color: var(--text);
  font-size:14px; outline:none;
}
#search-bar span {
  font-size:12px; color:var(--text2);
  min-width:40px; text-align:center;
}
#search-bar button {
  background:none; border:none; color:var(--text2);
  font-size:18px; cursor:pointer; padding:4px;
}

/* ====== Record Sub Tabs ====== */
.record-tabs {
  display:flex; justify-content:center;
  padding:16px 0 8px;
}
.record-pill {
  display:flex; align-items:center; gap:0;
  background: rgba(0,0,0,0.3);
  border-radius:20px; padding:2px;
}
.record-tab-item {
  display:flex; align-items:center; justify-content:center;

}

#record-content {
  flex:1; display:flex; flex-direction:column; overflow:hidden;
}
.panel-overlay.embedded {
  display:block !important; position:relative;
  inset:auto; background:transparent;
  backdrop-filter:none; -webkit-backdrop-filter:none;
  z-index:1; flex:1; overflow-y:auto;
  padding:0 16px 32px;
}
.panel-overlay.embedded .panel-header { display:none; }



/* ====== Bottom Nav ====== */
#bottom-nav {
  display:flex; justify-content:center; align-items:center;
  padding:2px 0;
  padding-bottom: max(6px, var(--safe-bottom));
  background: var(--input-area-bg);
  backdrop-filter: blur(16px);
}
.nav-pill {
  display:flex; align-items:center; gap:0;
  background: rgba(161,191,220,1.0);
  border-radius:20px; padding:1px;
}
.nav-item {
  display:flex; align-items:center; justify-content:center;
  padding:2px 24px; cursor:pointer;
  color: rgba(255,255,255,0.4); transition: all 0.2s;
  border-radius:18px;
}
.nav-item i { font-size:16px; }
.nav-item.active {
  color: rgba(255,255,255,1);
  background: rgba(255,255,255,0.3);
}

/* ====== Tab Content ====== */
.tab-content { display:none; flex-direction:column; flex:1; overflow:hidden; }
.tab-content.active { display:flex; }

/* ====== Records Page ====== */
.records-grid {
  display:grid; grid-template-columns:1fr 1fr;
  gap:12px; padding:20px 16px; overflow-y:auto; flex:1;
}
.record-card {
  background: var(--ai-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.4);
  border-radius:14px; padding:24px 16px;
  display:flex; flex-direction:column; align-items:center;
  gap:8px; cursor:pointer; transition: transform 0.15s;
}
.record-card:active { transform:scale(0.96); }
.record-card i { font-size:28px; color:var(--accent); }
.record-card span { font-size:13px; color:var(--text); font-weight:500; }
  
/* ====== Misc ====== */
.typing { display:flex; gap:4px; padding:4px 0; }
.typing span {
  width:6px; height:6px; background:var(--text2); border-radius:50%;
  animation:bounce 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay:0.2s; }
.typing span:nth-child(3) { animation-delay:0.4s; }
@keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
#messages::-webkit-scrollbar { width:4px; }
#messages::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
.divider {
  border:none; border-top:1px solid var(--border); margin:20px 0;
}
.section-title {
  font-size:14px; font-weight:600; margin-bottom:12px;
  color:var(--accent);
}
.supabase-status {
  font-size:12px; padding:6px 10px; border-radius:8px;

}
.status-ok { color:#6ecf6e; }
.status-err { color:#cf6e6e; }

/* ====== Calendar Panel ====== */

const isApp = typeof Capacitor !== 'undefined' && Capacitor.isNativePlatform && Capacitor.isNativePlatform();

// ====== Tab切换 ======
let currentRecordPanel = null;

function switchTab(tab) {
  if (tab === 'control') {
    showPanel('settings');
    return;
  }

  // 离开records时恢复面板
  if (currentRecordPanel) {
    const prev = document.getElementById(currentRecordPanel + '-panel');
    if (prev && prev.classList.contains('embedded')) {
      prev.classList.remove('embedded');
      document.getElementById('app').appendChild(prev);
    }
  }

  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  const tabs = ['chat','records','control'];
  document.querySelectorAll('.nav-item')[tabs.indexOf(tab)].classList.add('active');
  if (tab === 'chat') scrollToBottom();
  if (tab === 'records') openRecordTab(currentRecordPanel || 'memory');
}

function openRecordTab(panel) {
  const panelNames = ['memory','calendar','wallet','log'];
  const idx = panelNames.indexOf(panel);
  document.querySelectorAll('.record-tab-item').forEach((t,i) => {
    t.classList.toggle('active', i === idx);
  });

  // 恢复之前的面板
  if (currentRecordPanel && currentRecordPanel !== panel) {
    const prev = document.getElementById(currentRecordPanel + '-panel');
    if (prev && prev.classList.contains('embedded')) {
      prev.classList.remove('embedded');
      document.getElementById('app').appendChild(prev);
    }
  }

  const container = document.getElementById('record-content');
  const panelEl = document.getElementById(panel + '-panel');
  panelEl.classList.remove('show');
  panelEl.classList.add('embedded');
  container.appendChild(panelEl);
  currentRecordPanel = panel;

  if (panel === 'calendar') loadCalendar();
  if (panel === 'wallet') loadWallet();
  if (panel === 'memory') loadMemoryTab();
  if (panel === 'log') renderLogs();
}
  
// ====== 搜索 ======
let searchMatches = [];
let searchIndex = 0;

function openSearch() {
  let bar = document.getElementById('search-bar');
  if (bar) {
    bar.querySelector('input').focus();
    return;
  }
  bar = document.createElement('div');
  bar.id = 'search-bar';
  bar.innerHTML = `
    <input type="text" id="search-input" placeholder="搜索..." oninput="doSearch(this.value)">
    <span id="search-count"></span>
    <button onclick="navigateSearch(-1)"><i class="ri-arrow-up-s-line"></i></button>
    <button onclick="navigateSearch(1)"><i class="ri-arrow-down-s-line"></i></button>
    <button onclick="closeSearch()"><i class="ri-close-line"></i></button>
  `;
  const header = document.getElementById('header');
  header.after(bar);
  bar.querySelector('input').focus();
}

function doSearch(keyword) {
  document.querySelectorAll('.msg-bubble').forEach(el => el.style.outline = '');
  searchMatches = [];
  searchIndex = 0;
  const countEl = document.getElementById('search-count');
  if (!keyword.trim()) { countEl.textContent = ''; return; }
  const lowerKw = keyword.toLowerCase();
  document.querySelectorAll('.msg-bubble').forEach(el => {
    if (el.textContent.toLowerCase().includes(lowerKw)) searchMatches.push(el);
  });
  if (searchMatches.length > 0) {
    searchMatches.forEach(el => el.style.outline = '2px solid var(--accent)');
    highlightSearchCurrent();
    countEl.textContent = `1/${searchMatches.length}`;
  } else {
    countEl.textContent = '无结果';
  }
}

function navigateSearch(dir) {
  if (searchMatches.length === 0) return;
  searchMatches[searchIndex].style.outline = '2px solid var(--accent)';
  searchIndex = (searchIndex + dir + searchMatches.length) % searchMatches.length;
  highlightSearchCurrent();
  document.getElementById('search-count').textContent = `${searchIndex + 1}/${searchMatches.length}`;
}

function highlightSearchCurrent() {
  searchMatches[searchIndex].style.outline = '3px solid var(--accent2)';
  setTimeout(() => {
    searchMatches[searchIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 150);
}

function closeSearch() {
  document.querySelectorAll('.msg-bubble').forEach(el => el.style.outline = '');
  searchMatches = [];
  searchIndex = 0;
  const bar = document.getElementById('search-bar');
  if (bar) bar.remove();
}

window.onload = () => {

// ====== 锁屏 ======
function checkLock() {
  const pwd = localStorage.getItem('lockPassword');
  if (pwd) {
    document.getElementById('lock-title').textContent = '欢迎回来';
    document.getElementById('lock-subtitle').textContent = '请输入密码';
    document.getElementById('lock-confirm').style.display = 'none';
    document.getElementById('lock-reset').style.display = 'block';
  } else {
    document.getElementById('lock-title').textContent = '设置密码';
    document.getElementById('lock-subtitle').textContent = '为星月栖设置一个专属密码';
    document.getElementById('lock-confirm').style.display = 'block';
    document.getElementById('lock-reset').style.display = 'none';
  }
}

function lockAction() {
  const pwd = localStorage.getItem('lockPassword');
  const input = document.getElementById('lock-input').value;
  const error = document.getElementById('lock-error');
  error.textContent = '';

  if (pwd) {
    if (input === pwd) {
      unlock();
    } else {
      error.textContent = '密码错误';
      document.getElementById('lock-input').value = '';
    }
  } else {
    const confirmVal = document.getElementById('lock-confirm').value;
    if (input.length < 4) {
      error.textContent = '密码至少4位';
      return;
    }
    if (input !== confirmVal) {
      error.textContent = '两次输入不一致';
      return;
    }
    localStorage.setItem('lockPassword', input);
    unlock();
  }
}

function unlock() {
  loadSettings();
  loadMessages();
  renderAll();
  updateProviderTags();
  renderAllPools();
  startProactiveTimer();
  if (getSetting('sendLocation') === 'true') requestLocation();
  if (messages.length === 0) syncFromCloud(false);
  try { activityLogs = JSON.parse(getSetting('activityLogs', '[]')); } catch { activityLogs = []; }
  if (isApp) {
    requestLocalNotifPermission();
    requestLocationPermission();
    initStatusBar();
    initKeyboard();
  }
  subscribePush();
}

function resetPassword() {
  if (!confirm('重置密码将清除所有本地数据（聊天记录、设置等），但Supabase的数据不受影响。确定吗？')) return;
  if (!confirm('真的确定吗？本地数据不可恢复！')) return;
  localStorage.clear();
  location.reload();
}

// ====== LocalStorage 工具 ======
function getSetting(key, def = '') {
  return localStorage.getItem(key) || def;
}
function setSetting(key, val) {
  localStorage.setItem(key, val);
}

// ====== 面板显示/隐藏 ======
function showPanel(name) {
  const target = document.getElementById(name + '-panel');
  if (target && target.classList.contains('embedded')) {
    target.classList.remove('embedded');
    document.getElementById('app').appendChild(target);
    if (currentRecordPanel === name) currentRecordPanel = null;
  }
  document.querySelectorAll('.panel-overlay').forEach(p => p.classList.remove('show'));
  target.classList.add('show');
  if (name === 'calendar') loadCalendar();
  if (name === 'wallet') loadWallet();
  if (name === 'memory') loadMemoryTab();
}

function hidePanel(name) {
  document.getElementById(name + '-panel').classList.remove('show');
}

// ====== 设置管理 ======
function loadSettings() {
  document.getElementById('s-gateway').value = getSetting('gateway', '');
  document.getElementById('s-model').value = getSetting('model', '');
  document.getElementById('s-context').value = getSetting('contextN', '20');
  document.getElementById('s-temp').value = getSetting('temperature', '0.7');
  document.getElementById('s-thinking').value = getSetting('thinkingBudget', '0');
  document.getElementById('s-prompt').value = getSetting('sysPrompt', '');
  document.getElementById('s-proactive-delay').value = getSetting('proactiveDelay', '40');
  document.getElementById('s-proactive-poll').value = getSetting('proactivePoll', '20');
  document.getElementById('s-rag-threshold').value = getSetting('ragThreshold', '0.7');
  document.getElementById('s-rag-count').value = getSetting('ragCount', '5');

  // Embedding
  document.getElementById('s-embed-url').value = getSetting('embedUrl', '');
  document.getElementById('s-embed-key').value = getSetting('embedKey', '');
  document.getElementById('s-embed-model').value = getSetting('embedModel', '');

  // 轮询池
  try { modelPools = JSON.parse(getSetting('modelPools', '{"main":[],"vice":[],"proactive":[],"vision":[]}')); } catch { modelPools = { main: [], vice: [], proactive: [], vision: [] }; }


  // Toggles
  if (getSetting('proactiveEnabled') === 'true') {
    document.getElementById('toggle-proactive').classList.add('on');
  }
  if (getSetting('sendLocation') === 'true') {
    document.getElementById('toggle-location').classList.add('on');
  }
  if (getSetting('streamEnabled', 'true') !== 'false') {
    document.getElementById('toggle-stream').classList.add('on');
  }

  // 供应商
  try { providers = JSON.parse(getSetting('providers', '[]')); } catch { providers = []; }
  activeProvider = parseInt(getSetting('activeProvider', '0'));

  // 收藏模型
  try {
    favoriteModels = JSON.parse(getSetting('favoriteModels', '[]'));
    if (favoriteModels.length > 0 && typeof favoriteModels[0] === 'string') {
      favoriteModels = favoriteModels.map(m => ({ pid: 0, pname: providers[0]?.name || '默认', model: m }));
      setSetting('favoriteModels', JSON.stringify(favoriteModels));
    }
  } catch { favoriteModels = []; }


  // 归档状态
  isFirstAfterArchive = getSetting('isFirstAfterArchive', 'true') === 'true';

  renderProvidersList();
}

function saveSettings() {
  setSetting('gateway', document.getElementById('s-gateway').value.trim());
  setSetting('model', document.getElementById('s-model').value.trim());
  setSetting('contextN', document.getElementById('s-context').value);
  setSetting('temperature', document.getElementById('s-temp').value);
  setSetting('thinkingBudget', document.getElementById('s-thinking').value);
  setSetting('sysPrompt', document.getElementById('s-prompt').value);
  setSetting('proactiveDelay', document.getElementById('s-proactive-delay').value);
  setSetting('proactivePoll', document.getElementById('s-proactive-poll').value);
  syncProactiveToNative();
  setSetting('ragThreshold', document.getElementById('s-rag-threshold').value);
  setSetting('ragCount', document.getElementById('s-rag-count').value);

  // Embedding
  setSetting('embedUrl', document.getElementById('s-embed-url').value.trim());
  setSetting('embedKey', document.getElementById('s-embed-key').value.trim());
  setSetting('embedModel', document.getElementById('s-embed-model').value.trim());


  hidePanel('settings');
  startProactiveTimer(); // 重启定时器
  showStatus('设置已保存 ✓');

}

const activeProgressTasks = new Map();
let progressHideTimer = null;

function renderProgressTasks() {
  const bar = document.getElementById('status-bar');
  if (activeProgressTasks.size === 0) {
    bar.classList.remove('show');
    return;
  }

  bar.textContent = [...activeProgressTasks.values()].join('  ·  ');
  bar.classList.add('show');
}

function startProgressTask(id, message) {
  if (progressHideTimer) {
    clearTimeout(progressHideTimer);
    progressHideTimer = null;
  }
  activeProgressTasks.set(id, message);
  renderProgressTasks();
}

function finishProgressTask(id, message) {
  activeProgressTasks.set(id, message);
  renderProgressTasks();

  setTimeout(() => {
    activeProgressTasks.delete(id);
    renderProgressTasks();
  }, 3000);
}

function clearProgressTasks() {
  activeProgressTasks.clear();
  renderProgressTasks();
}

// ====== 状态栏 ======
function showStatus(msg, duration = 3000) {
  const bar = document.getElementById('status-bar');
  bar.textContent = msg;
  bar.classList.add('show');
  setTimeout(() => bar.classList.remove('show'), duration);

  // 记录到日志
  const now = new Date();
  const timeStr = String(now.getHours()).padStart(2, '0') + ':' +
    String(now.getMinutes()).padStart(2, '0') + ':' +
    String(now.getSeconds()).padStart(2, '0');
  activityLogs.unshift({ time: timeStr, msg });
  if (activityLogs.length > 200) activityLogs.pop();
  localStorage.setItem('activityLogs', JSON.stringify(activityLogs));
}

// ====== 供应商管理 ======
function addProvider() {
  const name = document.getElementById('new-provider-name').value.trim();
  const url = document.getElementById('new-provider-url').value.trim();
  const key = document.getElementById('new-provider-key').value.trim();
  if (!name || !url || !key) { alert('请填写完整'); return; }
  providers.push({ name, url, key });
  setSetting('providers', JSON.stringify(providers));
  document.getElementById('new-provider-name').value = '';
  document.getElementById('new-provider-url').value = '';
  document.getElementById('new-provider-key').value = '';
  renderProvidersList();
  updateProviderTags();
}

function removeProvider(index) {
  providers.splice(index, 1);
  if (activeProvider >= providers.length) activeProvider = Math.max(0, providers.length - 1);
  setSetting('providers', JSON.stringify(providers));
  setSetting('activeProvider', String(activeProvider));
  renderProvidersList();
  updateProviderTags();
}

function editProvider(index) {
  const p = providers[index];
  const container = document.getElementById('provider-row-' + index);
  container.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:6px;padding:8px 0;">
      <div class="setting-row">
        <input id="edit-prov-name-${index}" value="${p.name}" placeholder="名称" style="flex:0.5;">
        <input id="edit-prov-url-${index}" value="${p.url}" placeholder="API 地址（到 /v1）" style="flex:1;">
      </div>
      <div class="setting-row">
        <input id="edit-prov-key-${index}" type="password" value="${p.key}" placeholder="API Key" style="flex:1;">
        <button class="small-btn" onclick="saveProviderEdit(${index})">保存</button>
        <button class="small-btn" onclick="renderProvidersList()">取消</button>
      </div>
    </div>
  `;
}

function saveProviderEdit(index) {
  const name = document.getElementById('edit-prov-name-' + index).value.trim();
  const url = document.getElementById('edit-prov-url-' + index).value.trim();
  const key = document.getElementById('edit-prov-key-' + index).value.trim();
  if (!name || !url || !key) { alert('请填写完整'); return; }
  providers[index] = { name, url, key };
  setSetting('providers', JSON.stringify(providers));
  renderProvidersList();
  updateProviderTags();
  showStatus('供应商已更新 ✓');
}
  
function setActiveProvider(index) {
  activeProvider = index;
  setSetting('activeProvider', String(index));
  updateProviderTags();
}

function renderProvidersList() {
  const el = document.getElementById('providers-list');
  if (providers.length === 0) {
    el.innerHTML = '<p style="font-size:13px;color:var(--text2);">还没有添加供应商</p>';
    return;
  }
  el.innerHTML = providers.map((p, i) => `
    <div id="provider-row-${i}">
      <div class="setting-row">
        <span style="font-size:13px;flex:0.3;">${p.name}</span>
        <span style="font-size:12px;color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;">${p.url}</span>
        <button class="small-btn" onclick="editProvider(${i})">编辑</button>
        <button class="small-btn danger" onclick="removeProvider(${i})">删除</button>
      </div>
    </div>
  `).join('');
}

function updateProviderTags() {
  const el = document.getElementById('provider-tags');
  if (providers.length === 0) {
    el.innerHTML = '<span style="font-size:12px;color:var(--text2);">请先添加供应商</span>';
    return;
  }
  el.innerHTML = providers.map((p, i) => `
    <span class="provider-tag ${i === activeProvider ? 'active' : ''}" onclick="setActiveProvider(${i})">
      ${p.name}
    </span>
  `).join('');
}

function getActiveProvider() {
  if (providers.length === 0) return null;
  return providers[activeProvider] || providers[0];
}

// ====== 模型选择器 ======
function showModelDropdown() {
  document.getElementById('model-dropdown').classList.add('show');
  if (allModels.length === 0) fetchModels();
}

document.addEventListener('click', (e) => {
  const picker = document.querySelector('.model-picker');
  if (picker && !picker.contains(e.target)) {
    document.getElementById('model-dropdown').classList.remove('show');
  }
  document.querySelectorAll('.msg-actions.show').forEach(a => a.classList.remove('show'));
});

async function fetchModels() {
  const provider = getActiveProvider();
  const gateway = getSetting('gateway');
  if (!provider && !gateway) { alert('请先设置供应商或网关地址'); return; }

  showStatus('正在获取模型列表...');
  try {
    let data;
    if (gateway) {
      const res = await fetch(gateway + '/api/models', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ api_url: provider?.url, api_key: provider?.key }),
      });
      data = await res.json();
    } else {
      const res = await fetch(provider.url + '/models', {
        headers: { 'Authorization': 'Bearer ' + provider.key },
      });
      data = await res.json();
    }
    allModels = (data.data || []).map(m => m.id).sort();
    renderModelList('');
    showStatus(`已加载 ${allModels.length} 个模型`);
  } catch (e) {
    showStatus('获取模型列表失败: ' + e.message);
  }
}

function filterModels(keyword) {
  renderModelList(keyword);
}

function renderModelList(filter) {
  const list = document.getElementById('model-list');
  const kw = filter.toLowerCase();
  const isFaved = m => favoriteModels.some(f => f.model === m && f.pid === activeProvider);
  const faved = allModels.filter(m => isFaved(m) && (!kw || m.toLowerCase().includes(kw)));
  const others = allModels.filter(m => !isFaved(m) && (!kw || m.toLowerCase().includes(kw)));

  let html = '';
  if (faved.length > 0) {
    html += '<div class="model-section-title">⭐ 收藏</div>';
    html += faved.map(m => modelItemHtml(m, true)).join('');
  }
  if (others.length > 0) {
    html += '<div class="model-section-title">全部模型</div>';
    html += others.map(m => modelItemHtml(m, false)).join('');
  }
  if (!html) html = '<div style="padding:12px;color:var(--text2);font-size:13px;">无匹配模型</div>';
  list.innerHTML = html;
}

function modelItemHtml(modelId, isFaved) {
  return `<div class="model-item">
    <span onclick="selectModel('${modelId}')">${modelId}</span>
    <span class="star ${isFaved ? 'faved' : ''}" onclick="toggleFavorite(event,'${modelId}')">
      ${isFaved ? '★' : '☆'}
    </span>
  </div>`;
}

function selectModel(modelId) {
  document.getElementById('s-model').value = modelId;
  document.getElementById('model-dropdown').classList.remove('show');
}

function toggleFavorite(e, modelId) {
  e.stopPropagation();
  const idx = favoriteModels.findIndex(f => f.model === modelId && f.pid === activeProvider);
  if (idx >= 0) {
    favoriteModels.splice(idx, 1);
  } else {
    const p = providers[activeProvider];
    favoriteModels.push({ pid: activeProvider, pname: p ? p.name : '未知', model: modelId });
  }
  setSetting('favoriteModels', JSON.stringify(favoriteModels));
  renderModelList(document.querySelector('.model-search')?.value || '');
  renderAllPools();
}

// ====== 轮询池 ======
function renderPool(poolName) {
  const container = document.getElementById('pool-' + poolName);
  if (!container) return;
  const pool = modelPools[poolName] || [];
  if (pool.length === 0) {
    container.innerHTML = '<div style="font-size:12px;color:var(--text2);padding:4px 0;">空</div>';
  } else {
    container.innerHTML = pool.map((item, i) => `
      <div class="pool-item">
        <span class="pool-label">${item.pname} - ${item.model}</span>
        <button onclick="moveInPool('${poolName}',${i},-1)" title="上移">↑</button>
        <button onclick="moveInPool('${poolName}',${i},1)" title="下移">↓</button>
        <button onclick="removeFromPool('${poolName}',${i})" title="移除">✕</button>
      </div>
    `).join('');
  }
  const select = document.getElementById('pool-' + poolName + '-select');
  if (select) {
    const poolKeys = pool.map(p => p.pname + ':' + p.model);
    const available = favoriteModels.filter(f => !poolKeys.includes(f.pname + ':' + f.model));
    select.innerHTML = available.length > 0
      ? available.map(f => `<option value="${f.pname}:${f.model}">${f.pname} - ${f.model}</option>`).join('')
      : '<option value="">无可用星标模型</option>';
  }
}

function renderAllPools() {
  ['main', 'vice', 'proactive', 'vision'].forEach(renderPool);
}

function addToPool(poolName) {
  const select = document.getElementById('pool-' + poolName + '-select');
  const val = select.value;
  if (!val) return;
  const pool = modelPools[poolName] || [];
  if (pool.length >= 30) { alert('最多30个'); return; }
  const sepIdx = val.indexOf(':');
  const pname = val.slice(0, sepIdx);
  const model = val.slice(sepIdx + 1);
  if (pool.some(p => p.pname === pname && p.model === model)) return;
  pool.push({ pname, model });
  modelPools[poolName] = pool;
  setSetting('modelPools', JSON.stringify(modelPools));
  renderPool(poolName);
}

function addToPoolManual(poolName) {
  const input = document.getElementById('pool-' + poolName + '-manual');
  const model = input.value.trim();
  if (!model) return;
  const provider = getActiveProvider();
  if (!provider) { alert('请先添加供应商'); return; }
  const pool = modelPools[poolName] || [];
  if (pool.length >= 30) { alert('最多30个'); return; }
  if (pool.some(p => p.pname === provider.name && p.model === model)) {
    alert('该模型已在池中');
    return;
  }
  pool.push({ pname: provider.name, model });
  modelPools[poolName] = pool;
  setSetting('modelPools', JSON.stringify(modelPools));
  input.value = '';
  renderPool(poolName);
}

function removeFromPool(poolName, index) {
  modelPools[poolName].splice(index, 1);
  setSetting('modelPools', JSON.stringify(modelPools));
  renderPool(poolName);
}

function moveInPool(poolName, index, dir) {
  const pool = modelPools[poolName];
  const newIndex = index + dir;
  if (newIndex < 0 || newIndex >= pool.length) return;
  [pool[index], pool[newIndex]] = [pool[newIndex], pool[index]];
  setSetting('modelPools', JSON.stringify(modelPools));
  renderPool(poolName);
}

// ====== 主题 ======
function setTheme(theme) {
  setSetting('theme', theme);
  applyTheme();
}
function applyTheme() {
  const theme = getSetting('theme', 'default');
  if (theme === 'default') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
  // 更新按钮状态
  ['default','wx'].forEach(t => {
    const btn = document.getElementById('theme-' + t);
    if (btn) btn.classList.toggle('active', t === theme);
  });
}

// ====== Toggle 开关 ======
function toggleProactive() {
  const el = document.getElementById('toggle-proactive');
  el.classList.toggle('on');
  setSetting('proactiveEnabled', el.classList.contains('on') ? 'true' : 'false');
  syncProactiveToNative();
  startProactiveTimer();
}

function syncProactiveToNative() {
  if (window.NativeBridge) {
    const enabled = getSetting('proactiveEnabled') === 'true';
    const pollInterval = parseInt(getSetting('proactivePoll', '20'));
    const silenceMinutes = parseInt(getSetting('proactiveDelay', '40'));
    window.NativeBridge.saveProactiveSettings(JSON.stringify({ enabled, pollInterval, silenceMinutes }));
  }
}

function toggleLocation() {
  const el = document.getElementById('toggle-location');
  el.classList.toggle('on');
  const enabled = el.classList.contains('on');
  setSetting('sendLocation', enabled ? 'true' : 'false');

        currentLocation = { lng: pos.coords.longitude, lat: pos.coords.latitude };
      }).catch(() => { currentLocation = null; });

      () => { currentLocation = null; }

// ====== 工具函数 ======
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
function renderMarkdown(text) {
  if (!text) return '';
  try {
    text = text.replace(/⟦[^⟧]*⟧\s*/g, '');
    // 防止消息中的 HTML 源码被渲染为真实 DOM
    const _h = [];
    text = text.replace(/```[\s\S]*?```|`[^`\n]+`/g, m => { _h.push(m); return '%%CH' + (_h.length-1) + '%%'; });
    text = text.replace(/</g, '&lt;');
    _h.forEach((h, i) => { text = text.replace('%%CH' + i + '%%', h); });
    let html = marked.parse(text, { breaks: true });
    // 后处理：给代码块加复制按钮和折叠
    html = html.replace(/<pre><code(?: class="language-(\w+)")?>([\s\S]*?)<\/code><\/pre>/g,
      (match, lang, code) => {
        const langLabel = lang || 'code';
        const lineCount = code.split('\n').length;
        const needCollapse = lineCount > 12;
        const id = 'code-' + Math.random().toString(36).slice(2, 8);
        return `<div class="code-collapse ${needCollapse ? 'collapsed' : ''}" id="${id}">
          <div class="code-header">
            <span>${langLabel}</span>
            <button class="copy-btn" onclick="copyCode(this)">复制</button>
          </div>
          <pre><code>${code}</code></pre>
          ${needCollapse ? `<div class="code-expand-btn" onclick="toggleCodeCollapse('${id}')">展开全部 (${lineCount}行)</div>` : ''}
        </div>`;
      }
    );
    // 标记折叠框
    const tagTypes = [
      { regex: /&lt;&lt;状态&gt;&gt;([\s\S]*?)&lt;&lt;\/状态&gt;&gt;/g, icon: '📝', label: '状态已记录' },
      { regex: /&lt;&lt;缓存&gt;&gt;([\s\S]*?)&lt;&lt;\/缓存&gt;&gt;/g, icon: '📝', label: '缓存已更新' },
      { regex: /&lt;&lt;日历&gt;&gt;([\s\S]*?)&lt;&lt;\/日历&gt;&gt;/g, icon: '📝', label: '日历已添加' },
      { regex: /&lt;&lt;记忆&gt;&gt;([\s\S]*?)&lt;&lt;\/记忆&gt;&gt;/g, icon: '📝', label: '记忆已创建' },
      { regex: /&lt;&lt;改记忆&gt;&gt;([\s\S]*?)&lt;&lt;\/改记忆&gt;&gt;/g, icon: '📝', label: '记忆已更新' },
      { regex: /&lt;&lt;日记&gt;&gt;([\s\S]*?)&lt;&lt;\/日记&gt;&gt;/g, icon: '📝', label: '日记已写入' },
    ];
    for (const tag of tagTypes) {
      html = html.replace(tag.regex, (match, content) => {
        return `<div class="thinking-block"><div class="thinking-toggle" onclick="toggleThinking(this)"><span class="thinking-arrow">▶</span> ${tag.icon} ${tag.label}</div><div class="thinking-content">${content}</div></div>`;
      });
    }
    return html;
  } catch { return text.replace(/\n/g, '<br>'); }
}

function copyCode(btn) {
  const pre = btn.closest('.code-collapse')?.querySelector('pre code')
    || btn.closest('.code-header')?.nextElementSibling?.querySelector('code');
  if (!pre) return;
  const text = pre.textContent;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '已复制 ✓';
    setTimeout(() => btn.textContent = '复制', 1500);
  }).catch(() => {
    btn.textContent = '失败';
    setTimeout(() => btn.textContent = '复制', 1500);
  });
}

function toggleCodeCollapse(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const isCollapsed = el.classList.contains('collapsed');
  el.classList.toggle('collapsed');
  const btn = el.querySelector('.code-expand-btn');
  if (btn) btn.textContent = isCollapsed ? '收起' : btn.textContent.replace('收起', '展开全部');
}
function extractThinking(text) {
  let open, close, start;
  const s1 = text.indexOf('<thinking>');
  const s2 = text.indexOf('<think>');
  if (s1 !== -1 && (s2 === -1 || s1 <= s2)) {
    open = '<thinking>'; close = '</thinking>'; start = s1;
  } else if (s2 !== -1) {
    open = '<think>'; close = '</think>'; start = s2;
  } else {
    return { display: text, thinking: '', inProgress: false };
  }
  const end = text.indexOf(close);
  if (end === -1) {
    return {
      display: text.substring(0, start),
      thinking: text.substring(start + open.length),
      inProgress: true,
    };
  }
  return {
    display: (text.substring(0, start) + text.substring(end + close.length)).trim(),
    thinking: text.substring(start + open.length, end).trim(),
    inProgress: false,
  };
}

function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d.getTime())) return '';
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function scrollToBottom() {
  const el = document.getElementById('messages');
  requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
}

// ====== 渲染 ======
function renderAll() {
  const container = document.getElementById('messages');
  container.innerHTML = '';
  if (messages.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:var(--text2);margin-top:40vh;font-size:14px;">说点什么吧 ✨</div>';
    return;
  }
  messages.forEach((msg, i) => {
    if (msg.role === 'user' && msg.segments && msg.segments.length > 1) {
      msg.segments.forEach((seg, si) => {
        const div = document.createElement('div');
        div.className = 'msg user segment-bubble';
        div.dataset.index = i;
        const bubble = document.createElement('div');
        bubble.className = 'msg-bubble';
        bubble.innerHTML = renderMarkdown(seg);
        div.appendChild(bubble);
        if (si === msg.segments.length - 1) {
          const v = msg.versions[msg.activeVersion || 0];
          const time = document.createElement('div');
          time.className = 'msg-time';
          time.textContent = formatTime(v.timestamp);
          const actions = document.createElement('div');
          actions.className = 'msg-actions';
          actions.innerHTML = `<button onclick="startEdit(${i})">编辑</button>`
            + `<button onclick="deleteMessage(${i})">删除</button>`;
          const meta = document.createElement('div');
          meta.className = 'msg-meta';
          meta.appendChild(time);
          meta.appendChild(actions);
          bubble.addEventListener('click', (e) => {
            if (bubble.contentEditable === 'true') return;
            document.querySelectorAll('.msg-actions.show').forEach(a => a.classList.remove('show'));
            actions.classList.toggle('show');
            e.stopPropagation();
          });
          div.appendChild(meta);
        }
        container.appendChild(div);
      });
    } else {
      container.appendChild(createMsgEl(msg, i));
    }
  });
  scrollToBottom();
}

function createMsgEl(msg, index) {
  const div = document.createElement('div');
  div.className = 'msg ' + (msg.role === 'user' ? 'user' : 'ai');
  if (msg.isProactive) div.classList.add('proactive');
  div.dataset.index = index;

  const activeV = msg.versions ? msg.versions[msg.activeVersion || 0] : msg;
  let content = activeV.content || '';
  let thinking = activeV.thinking || '';
   // 兼容旧消息：content里残留的thinking/think标签提取出来
  if (!thinking && (content.includes('<thinking>') || content.includes('<think>'))) {
    const ext = extractThinking(content);
    content = ext.display;
    thinking = ext.thinking;
  }
  const timestamp = activeV.timestamp || msg.timestamp;
  const images = activeV.images || [];

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';

  let html = '';
  if (thinking && msg.role === 'assistant') {
    html += '<div class="thinking-block">'
      + '<div class="thinking-toggle" onclick="toggleThinking(this)">'
      + '<span class="thinking-arrow">▶</span> 思考过程</div>'
      + '<div class="thinking-content">' + escapeHtml(thinking) + '</div></div>';
  }
  if (images.length > 0) {
    html += images.map(img => `<img class="msg-image" src="${img.url}" onclick="window.open(this.src)">`).join('');
  }
  html += renderMarkdown(content);
  bubble.innerHTML = html;

  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = formatTime(timestamp);

  const actions = document.createElement('div');
  actions.className = 'msg-actions';

  const editBtn = document.createElement('button');
  editBtn.textContent = '编辑';
  editBtn.onclick = () => startEdit(index);
  actions.appendChild(editBtn);

  if (msg.role === 'assistant') {
    const retryBtn = document.createElement('button');
    retryBtn.textContent = '重试';
    retryBtn.onclick = () => retryMessage(index);
    actions.appendChild(retryBtn);
  }

  if (msg.versions && msg.versions.length > 1) {
    const nav = document.createElement('span');
    nav.className = 'version-nav';
    const prevBtn = document.createElement('button');
    prevBtn.textContent = '◀';
    prevBtn.onclick = () => switchVersion(index, -1);
    const nextBtn = document.createElement('button');
    nextBtn.textContent = '▶';
    nextBtn.onclick = () => switchVersion(index, 1);
    const label = document.createElement('span');
    label.style.margin = '0 4px';
    label.textContent = (msg.activeVersion + 1) + '/' + msg.versions.length;
    nav.appendChild(prevBtn);
    nav.appendChild(label);
    nav.appendChild(nextBtn);
    actions.appendChild(nav);
  }

  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  meta.appendChild(time);
  meta.appendChild(actions);

  bubble.addEventListener('click', (e) => {
    if (bubble.contentEditable === 'true') return;
    document.querySelectorAll('.msg-actions.show').forEach(a => a.classList.remove('show'));
    actions.classList.toggle('show');
    e.stopPropagation();
  });

  div.appendChild(bubble);
  div.appendChild(meta);
  return div;
}

function toggleThinking(el) {
  el.querySelector('.thinking-arrow').classList.toggle('open');
  el.nextElementSibling.classList.toggle('show');
}

function switchVersion(index, dir) {
  const msg = messages[index];
  if (!msg.versions) return;
  const newV = msg.activeVersion + dir;
  if (newV < 0 || newV >= msg.versions.length) return;
  msg.activeVersion = newV;
  saveMessages();
  renderAll();
}
// ====== 编辑 ======
function startEdit(index) {
  const allEls = document.querySelectorAll('.msg[data-index="' + index + '"]');
  const msgEl = allEls[allEls.length - 1];
  const bubble = msgEl.querySelector('.msg-bubble');
  const actions = msgEl.querySelector('.msg-actions');

  const activeV = messages[index].versions
    ? messages[index].versions[messages[index].activeVersion || 0]
    : messages[index];

  const textarea = document.createElement('textarea');
  textarea.className = 'edit-textarea';
  textarea.value = activeV.content || '';

  bubble.innerHTML = '';
  bubble.appendChild(textarea);
  textarea.focus();
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 360) + 'px';
  textarea.oninput = () => {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 360) + 'px';
  };

  if (actions) actions.style.display = 'none';

  const editActs = document.createElement('div');
  editActs.className = 'edit-actions';

  const saveBtn = document.createElement('button');
  saveBtn.className = 'edit-save';
  saveBtn.textContent = '保存';
  saveBtn.onclick = () => {
    const newText = textarea.value;
    if (messages[index].versions) {
      messages[index].versions[messages[index].activeVersion].content = newText;
    } else {
      messages[index].content = newText;
    }
    if (messages[index].segments) {
      messages[index].segments = newText.split('\n').filter(s => s.trim());
    }
    saveMessages();
    renderAll();
  };

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'edit-cancel';
  cancelBtn.textContent = '取消';
  cancelBtn.onclick = () => renderAll();

  editActs.appendChild(saveBtn);
  editActs.appendChild(cancelBtn);
  msgEl.appendChild(editActs);
}



function deleteMessage(index) {
  if (!confirm('删除这条消息？')) return;
  messages.splice(index, 1);
  saveMessages();
  renderAll();
}

// ====== 小红书链接处理 ======

function extractXhsUrl(text) {
  const match = text.match(/https?:\/\/xhslink\.com\/[^\s]+/);
  if (match) return match[0];
  const match2 = text.match(/https?:\/\/(www\.)?xiaohongshu\.com\/(explore|discovery\/item)\/[^\s]+/);
  if (match2) return match2[0];
  return null;
}

async function processXhsLink(xhsUrl, originalText) {
  const gateway = getSetting('gateway');
  if (!gateway) return null;

  isLoadingXhs = true;
  showStatus('📕 正在读取小红书笔记…', 30000);

  try {
    const config = buildConfig();
    const res = await fetch(gateway + '/api/xhs-card', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: xhsUrl, cfg: config }),
    });
    const data = await res.json();

    if (!data.ok || !data.note) {
      showStatus('⚠ 小红书读取失败: ' + (data.error || '未知错误'), 5000);
      return null;
    }

    const note = data.note;

    // 拼结构化文本
    let structured = `📕 小红书笔记\n`;
    structured += `作者：${note.author}\n`;
    structured += `标题：${note.title}\n`;
    if (note.desc) structured += `正文：${note.desc}\n`;
    if (note.likedCount || note.commentCount || note.collectedCount) {
      structured += `互动：${note.likedCount}赞 ${note.commentCount}评论 ${note.collectedCount}收藏\n`;
    }

    // 图片描述
    if (note.imageDescriptions && note.imageDescriptions.length > 0) {
      structured += `\n配图：\n`;
      for (const img of note.imageDescriptions) {
        structured += `  第${img.index}张：${img.description}\n`;
      }
    }

    // 评论
    if (note.comments && note.comments.length > 0) {
      structured += `\n热门评论：\n`;
      for (const c of note.comments) {
        structured += `  ${c.user}${c.ipLocation ? '(' + c.ipLocation + ')' : ''}：${c.content}\n`;
      }
    }

    structured += `\n原链接：${note.url || xhsUrl}`;

    showStatus('📕 小红书笔记读取完成 ✓', 3000);
    return structured;

  } catch (e) {
    showStatus('⚠ 小红书读取失败: ' + e.message, 5000);
    return null;
  } finally {
    isLoadingXhs = false;
  }
}

  pendingMessages.forEach((text, i) => {

      input.value = pendingMessages[i];

      input.focus();

    };
