// ====== 获取配置对象 ======
function resolvePool(poolName) {
  const pool = modelPools[poolName] || [];
  return pool.map(entry => {
    const provider = providers.find(p => p.name === entry.pname);
    if (!provider) return null;
    return { url: provider.url, key: provider.key, model: entry.model, pname: entry.pname };
  }).filter(Boolean);
}
  
function buildConfig() {
  const provider = getActiveProvider();
  const config = {
    model: getSetting('model', ''),
    temperature: parseFloat(getSetting('temperature', '0.7')),
    context_n: parseInt(getSetting('contextN', '20')),
    thinking_budget: parseInt(getSetting('thinkingBudget', '0')),
    rag_threshold: parseFloat(getSetting('ragThreshold', '0.7')),
    rag_count: parseInt(getSetting('ragCount', '5')),
    stream: getSetting('streamEnabled', 'true') !== 'false',
  };

  if (provider) {
    config.main_api_url = provider.url;
    config.main_api_key = provider.key;
  }

  const embedUrl = getSetting('embedUrl');
  const embedKey = getSetting('embedKey');
  const embedModel = getSetting('embedModel');
  if (embedUrl) config.embed_api_url = embedUrl;
  if (embedKey) config.embed_api_key = embedKey;
  if (embedModel) config.embed_model = embedModel;

  config.main_pool = resolvePool('main');
  config.vice_pool = resolvePool('vice');
  config.proactive_pool = resolvePool('proactive');
  config.vision_pool = resolvePool('vision');
  
  return config;
}

// ====== 构建发送消息列表 ======
function buildApiMessages() {
  return messages.map(m => {
    const v = m.versions ? m.versions[m.activeVersion || 0] : m;
    return {
      role: m.role,
      content: v.content || '',
      timestamp: v.timestamp || m.timestamp || '',
      source: m.source || 'normal',  
    };
  });
}

function getBeijingDateFromTimestamp(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleDateString('en-CA', { timeZone: 'Asia/Shanghai' });
}

function buildFullMessagesJson() {
  const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Shanghai' });
  return messages
    .filter(m => {
      const v = m.versions ? m.versions[m.activeVersion || 0] : m;
      const ts = v.timestamp || m.timestamp || '';
      return getBeijingDateFromTimestamp(ts) === today;
    })
    .map(m => {
      const v = m.versions ? m.versions[m.activeVersion || 0] : m;
      return {
        role: m.role,
        content: v.content || '',
        timestamp: v.timestamp || m.timestamp || '',
        source: m.source || 'normal',
      };
    });
}

function startExpectedProgressTasks(text, hasImage) {
  const urls = text.match(/https?:\/\/[^\s<>"{}|\\^`\[\]]+/g) || [];
  const hasNormalUrl = urls.some(url =>
    !/xhslink\.com|xiaohongshu\.com/.test(url)
  );

  if (hasNormalUrl) {
    startProgressTask('url', '🔗 正在读取网页…');
  }

  if (hasImage) {
    startProgressTask('image', '🖼️ 正在识别图片…');
  }

  const codePattern =
    /index代码|worker代码|bridge代码|桥接脚本|manifest代码|sw\.js|service worker|schema|表结构|AndroidManifest|build\.gradle|MainActivity|mainactivity|app主入口|KeepAliveService|keepaliveservice|后台保活|沉默时间|主动消息|UsageStatsPlugin|usagestatsplugin|屏幕使用时间|临时代码文件/;

  if (codePattern.test(text)) {
    startProgressTask('code', '📄 正在读取相关代码…');
  }
}

// ====== 发送消息 ======
async function sendMessage() {
  if (isLoadingXhs) {
    showStatus('📕 小红书内容还在加载中，稍等一下就好～', 3000);
    return;
  }
  const input = document.getElementById('input');
  const currentText = input.value.trim();
  if (currentText) pendingMessages.push(currentText);
  if ((pendingMessages.length === 0 && !pendingImage) || isGenerating) return;
  const text = pendingMessages.join('\n');
  const hadPendingBubbles = pendingMessages.length > 0;
  pendingMessages = [];
  document.querySelectorAll('.msg.pending').forEach(el => {
    el.classList.remove('pending');
    const actions = el.querySelector('.msg-actions');
    if (actions) actions.remove();
  });

  const gateway = getSetting('gateway');
  const config = buildConfig();
  if (!gateway) { alert('请先在设置中填写网关地址'); return; }
  if (!config.model && (!config.main_pool || config.main_pool.length === 0)) { alert('请指定模型或配置主模型轮询池'); return; }

  // 构建用户消息内容
  // 小红书链接处理
  let userContent = text;
  const xhsUrl = extractXhsUrl(userContent);
  if (xhsUrl) {
    const xhsContent = await processXhsLink(xhsUrl, userContent);
    if (xhsContent) {
      // 把链接及其后面的小红书分享文案替换成结构化内容
      const sharePattern = /https?:\/\/xhslink\.com\/[^\s]+[\s\S]*?(?:打开【小红书】[^\n]*)?/;
      const sharePattern2 = /https?:\/\/(www\.)?xiaohongshu\.com\/(explore|discovery\/item)\/[^\s]+[\s\S]*?(?:打开【小红书】[^\n]*)?/;
      userContent = userContent.replace(sharePattern, '').replace(sharePattern2, '').trim();
      userContent = userContent ? userContent + '\n\n' + xhsContent : xhsContent;
    }
  }

  let userImages = [];
  let imagePayload = null;
  const hasPendingImage = !!pendingImage;

  startExpectedProgressTasks(userContent, hasPendingImage);

  if (pendingImage) {

    userContent += (userContent ? '\n' : '') + pendingImage.placeholder;
    userImages = [{ url: pendingImage.url }];
    imagePayload = [{ url: pendingImage.url, placeholder: pendingImage.placeholder }];
    removeImage();
  }

  // 用户消息
  messages.push({
    role: 'user',
    versions: [{
      content: userContent,
      timestamp: new Date().toISOString(),
      images: userImages.map(img => ({ url: '[已发送]', alt: '图片' })),
    }],
    activeVersion: 0,
    segments: hadPendingBubbles ? text.split('\n') : null,
  });

  input.value = '';
  input.style.height = 'auto';

  // 检测星语发的红包
  const rpMatch = userContent.match(/\[红包:(\d+)(?::(.+?))?\]/);
  if (rpMatch) {
    const rpAmount = parseInt(rpMatch[1]);
    const rpMsg = rpMatch[2] || '来自星星的红包～';
    showRedPacket(rpAmount, rpMsg, '🧧 星星的红包');
    if (gateway) {
      fetch(gateway + '/api/wallet/transact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount: rpAmount, type: 'red_packet_from_star', description: rpMsg }),
      }).catch(() => {});
    }
  }
  
    // AI占位
    messages.push({
      role: 'assistant',
      versions: [{ content: '', timestamp: new Date().toISOString(), thinking: '' }],
      activeVersion: 0,
    });

  saveMessages();
  renderAll();

  // 重置主动消息定时器
  resetProactiveTimer();

  await generateResponse(messages.length - 1, imagePayload);
}

// ====== Retry ======
function retryMessage(index) {
  if (isGenerating) return;
  const msg = messages[index];
  if (msg.role !== 'assistant') return;

  if (!msg.versions) {
    msg.versions = [{ content: msg.content || '', timestamp: msg.timestamp || '', thinking: msg.thinking || '' }];
    msg.activeVersion = 0;
    delete msg.content;
    delete msg.timestamp;
    delete msg.thinking;
  }

  msg.versions.push({ content: '', timestamp: '', thinking: '' });
  msg.activeVersion = msg.versions.length - 1;
  saveMessages();

  generateResponse(index);
}

// ====== 流式生成 ======
async function generateResponse(aiIndex, images = null) {
  isGenerating = true;
  wasHiddenDuringGeneration = false;
  document.getElementById('send-btn').disabled = true;

  // 保存当前回复对象的引用。归档会裁剪 messages 并改变数组下标，
  // 但被保留的消息对象本身不会改变。
  const targetMessage = messages[aiIndex];
  const targetVersionIndex = targetMessage?.activeVersion || 0;

  const container = document.getElementById('messages');
  const aiMsgEl = container.querySelector('.msg[data-index="' + aiIndex + '"]');
  const aiBubble = aiMsgEl.querySelector('.msg-bubble');
  aiBubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  // 停止生成按钮
  const stopBtn = document.createElement('button');
  stopBtn.className = 'stop-btn';
  stopBtn.textContent = '⏹ 停止';
  stopBtn.onclick = () => {
    if (currentAbortController) {
      currentAbortController.abort();
      currentAbortController = null;
      stopBtn.remove();
    }
  };
  aiMsgEl.appendChild(stopBtn);


  const gateway = getSetting('gateway');
  const config = buildConfig();
  const contextN = parseInt(getSetting('contextN', '20'));

  // 构建API消息（去掉当前AI占位）
  const apiMessages = buildApiMessages().slice(0, aiIndex).slice(-contextN);

  const isProactive = messages[aiIndex]?.isProactive || false;

  const requestBody = {
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    messages: apiMessages,
    full_messages_json: buildFullMessagesJson(),
    system_prompt: getSetting('sysPrompt', ''),
    config,
    is_first_after_archive: isFirstAfterArchive,
    is_proactive: isProactive,
  };

  
  if (images) requestBody.images = images;
  if (getSetting('sendLocation') === 'true' && currentLocation) {
    requestBody.location = currentLocation;
  }

  let fullContent = '';
  let thinkingContent = '';
  let inThinking = false;


  try {
     currentAbortController = new AbortController();
     const response = await fetch(gateway + '/api/chat', {
       method: 'POST',
       headers: { 'Content-Type': 'application/json' },
       body: JSON.stringify(requestBody),
       signal: currentAbortController.signal,
     });


    if (!response.ok) {
      const errText = await response.text();
      throw new Error('API 错误: ' + response.status + ' ' + errText);
    }

    // 首条消息后不再触发天气
    isFirstAfterArchive = false;
    setSetting('isFirstAfterArchive', 'false');


    const isStream = getSetting('streamEnabled', 'true') !== 'false';

    if (!isStream) {
      // 非流式
      const data = await response.json();
      const choice = data.choices?.[0];
      if (choice) {
        fullContent = choice.message?.content || '';
        thinkingContent = choice.message?.reasoning_content || '';
      }
      if (data._stelluna_meta) {
        if (Array.isArray(data._stelluna_meta.enhancement_progress)) {
          for (const progress of data._stelluna_meta.enhancement_progress) {
            finishProgressTask(progress.id, progress.message);
          }
        }
        if (data._stelluna_meta.model_info) {
          const mi = data._stelluna_meta.model_info;
          showStatus(`🪞 ${mi.provider} / ${mi.model}`, 5000);
        }
        if (data._stelluna_meta.image_descriptions) {
          const userMsgIndex = aiIndex - 1;
          if (userMsgIndex >= 0 && messages[userMsgIndex].role === 'user') {
            const userV = messages[userMsgIndex].versions[messages[userMsgIndex].activeVersion || 0];
            for (const [placeholder, desc] of Object.entries(data._stelluna_meta.image_descriptions)) {
              userV.content = userV.content.replace(placeholder, `\n[图片：${desc}]\n`);
            }
            saveMessages();
          }
        }
        if (data._stelluna_meta.server_timestamp) {
          messages[aiIndex].versions[messages[aiIndex].activeVersion].timestamp = data._stelluna_meta.server_timestamp;
        }
        if (data._stelluna_meta.daily_event) {
          showStatus(`🏠 【家里有情况啦】${data._stelluna_meta.daily_event.text}`, 8000);
        }
      }
      aiBubble.innerHTML = renderMarkdown(fullContent);
      scrollToBottom();
    } else {
      // 流式
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';

        for (const line of lines) {
          if (!line.startsWith('data:')) continue;
          const dataStr = line.slice(5).trim();
          if (dataStr === '[DONE]') continue;

          try {
            const json = JSON.parse(dataStr);
            if (json.type === 'progress_result') {
              finishProgressTask(json.id, json.message);
              continue;
            }
            // 处理图片描述回写
            if (json.type === 'model_info') {
              showStatus(`🪞 ${json.provider} / ${json.model}`, 5000);
              continue;
            }
            if (json.type === 'server_time') {
              messages[aiIndex].versions[messages[aiIndex].activeVersion].timestamp = json.timestamp;
              continue;
            }
            if (json.type === 'daily_event') {
              showStatus(`🏠 【家里有情况啦】${json.event.text}`, 8000);
              continue;
            }
            if (json.type === 'image_desc' && json.descriptions) {
              const userMsgIndex = aiIndex - 1;
              if (userMsgIndex >= 0 && messages[userMsgIndex].role === 'user') {
                const userV = messages[userMsgIndex].versions[messages[userMsgIndex].activeVersion || 0];
                for (const [placeholder, desc] of Object.entries(json.descriptions)) {
                  userV.content = userV.content.replace(placeholder, `\n[图片：${desc}]\n`);
                }
                saveMessages();
                const userEl = document.querySelector('.msg[data-index="' + userMsgIndex + '"]');
                if (userEl) {
                  userEl.querySelector('.msg-bubble').innerHTML = renderMarkdown(userV.content);
                }
              }
              continue;
            }
            const delta = json.choices?.[0]?.delta;
            if (!delta) continue;

            if (delta.reasoning_content) {
              inThinking = true;
              thinkingContent += delta.reasoning_content;
              aiBubble.innerHTML = '<div class="thinking-block">'
                + '<div class="thinking-toggle"><span class="thinking-arrow open">▶</span> 思考中...</div>'
                + '<div class="thinking-content show">' + escapeHtml(thinkingContent) + '</div></div>';
              scrollToBottom();
              continue;
            }


            if (delta.content) {
              if (inThinking) inThinking = false;
              fullContent += delta.content;
              const ext = extractThinking(fullContent);
              thinkingContent = ext.thinking || thinkingContent;

              let displayHtml = '';
              if (ext.thinking) {
                displayHtml += '<div class="thinking-block">'
                  + '<div class="thinking-toggle"' + (ext.inProgress ? '' : ' onclick="toggleThinking(this)"') + '>'
                  + '<span class="thinking-arrow' + (ext.inProgress ? ' open' : '') + '">▶</span> '
                  + (ext.inProgress ? '思考中...' : '思考过程') + '</div>'
                  + '<div class="thinking-content' + (ext.inProgress ? ' show' : '') + '">'
                  + escapeHtml(ext.thinking) + '</div></div>';
              }
              displayHtml += renderMarkdown(ext.display);
              aiBubble.innerHTML = displayHtml;
              scrollToBottom();
            }

          } catch (parseErr) {}
        }
      }
    }

    
    if (document.hidden || wasHiddenDuringGeneration) {
      if (isApp) {
        try {
          const { LocalNotifications } = Capacitor.Plugins;
          await LocalNotifications.schedule({
            notifications: [{
              title: '听月发来消息 💓',
              body: fullContent.slice(0, 80) + (fullContent.length > 80 ? '...' : ''),
              id: Math.floor(Math.random() * 2147483647),
              smallIcon: 'ic_launcher',
            }]
          });
        } catch (e) {
          showStatus('⚠ 通知失败: ' + e.message, 5000);
        }
      } else {
        fetch(gateway + '/api/push/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            title: '星月栖 · 听月', 
            body: fullContent.slice(0, 80) + (fullContent.length > 80 ? '...' : ''),
            url: 'https://victoryaoife.github.io/'
          }),
        }).catch(() => {});
      }
     wasHiddenDuringGeneration = false;
    }

    
    // 移除停止按钮
    const existingStop = aiMsgEl.querySelector('.stop-btn');
    if (existingStop) existingStop.remove();
    // 检测并清理状态/缓存标记
    fullContent = await detectStatusTags(fullContent);

    // 日记标记只处理当前刚生成完的这一条回复，避免历史上下文里的日记重复触发
    fullContent = await confirmDiaryTags(fullContent, aiIndex);

    // 检测红包
    checkForRedPacket(fullContent);


    // 把清理后的内容存入当前版本。
    // 使用生成开始时保存的对象引用，避免归档裁剪 messages 后 aiIndex 失效。
    const finalVersion = targetMessage?.versions?.[targetVersionIndex];
    if (finalVersion) {
      const extracted = extractThinking(fullContent);
      finalVersion.content = extracted.display;
      finalVersion.thinking = thinkingContent || extracted.thinking;
      if (!finalVersion.timestamp) {
        finalVersion.timestamp = new Date().toISOString();
      }
    }
    saveMessages();
    renderAll();

   } catch (err) {
       clearProgressTasks();
       showStatus('⚠ 生成失败: ' + err.message, 5000);
       // 不删除消息，显示重试按钮
       const retryBtn = document.createElement('button');
       retryBtn.className = 'stop-btn';
       retryBtn.textContent = '🔄 重试';
       retryBtn.onclick = () => {
         retryBtn.remove();
         generateResponse(aiIndex, images);
       };
       aiBubble.appendChild(retryBtn);
   }



  isGenerating = false;
  document.getElementById('send-btn').disabled = false;
  scrollToBottom();

  currentAbortController = null;
}

// ====== 主动消息 ======
function startProactiveTimer() {
  stopProactiveTimer();
  if (getSetting('proactiveEnabled') !== 'true') return;
  if (isApp) return;

  const delay = parseInt(getSetting('proactiveDelay', '40')) * 60 * 1000;
  proactiveTimer = setInterval(() => checkProactive(), delay);
}


let isCheckingProactive = false;  

async function checkBgProactive() {
  if (isCheckingProactive) return;
  isCheckingProactive = true;
  const gateway = getSetting('gateway');
  if (!gateway) { isCheckingProactive = false; return; }
  try {
    const res = await fetch(gateway + '/api/status', {
      headers: { 'Content-Type': 'application/json' }
    });
    const allStatus = await res.json();
    if (!Array.isArray(allStatus)) return;

    const proactiveMsgs = allStatus
      .filter(s => s.type === 'proactive_msg')
      .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    if (proactiveMsgs.length === 0) return;

    for (const msg of proactiveMsgs) {
      messages.push({
        role: 'assistant',
        versions: [{ content: msg.content, timestamp: msg.created_at ? new Date(msg.created_at).toISOString() : new Date().toISOString(), thinking: '' }],
        activeVersion: 0,
        isProactive: true,
        source: 'proactive',
      });
      await fetch(gateway + '/api/status/' + msg.id, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' }
      });
    }
    saveMessages();
    setTimeout(() => { renderAll(); }, 150);
  } catch (e) {
    console.error('checkBgProactive error:', e);
  } finally {
    isCheckingProactive = false;
  }
}

  
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    checkBgProactive();
  }
  if (!document.hidden && !isApp && getSetting('proactiveEnabled') === 'true') {
    let lastUserTs = null;
    for (let i = messages.length - 1; i >= 0; i--) {
      if (messages[i].role === 'user') {
        const v = messages[i].versions 
          ? messages[i].versions[messages[i].activeVersion || 0] 
          : messages[i];
        lastUserTs = v.timestamp;
        break;
      }
    }
    if (lastUserTs) {
      const elapsed = Math.floor((Date.now() - new Date(lastUserTs)) / 60000);
      const delay = parseInt(getSetting('proactiveDelay', '40'));
      if (elapsed >= delay) {
        setTimeout(() => checkProactive(), 2000);
      }
    }
  }
});


function stopProactiveTimer() {
  if (proactiveTimer) {
    clearInterval(proactiveTimer);
    proactiveTimer = null;
  }
}

function resetProactiveTimer() {
  startProactiveTimer();
}

async function checkProactive() {
  if (isGenerating) return;
  if (window._proactivePending) return;
  if (window._proactiveCooldown) return;
  
  const gateway = getSetting('gateway');
  if (!gateway) return;

  // 计算沉默时长
  let lastUserTs = null;
  for (let i = messages.length - 1; i >= 0; i--) {
    if (messages[i].role === 'user') {
      const v = messages[i].versions ? messages[i].versions[messages[i].activeVersion || 0] : messages[i];
      lastUserTs = v.timestamp;
      break;
    }
  }
  if (!lastUserTs) return;

  const elapsed = Math.floor((Date.now() - new Date(lastUserTs)) / 60000);
  if (elapsed < 5) return;

  const config = buildConfig();
  const recentMsgs = buildApiMessages().slice(-6);
  let usageInfo = '';
  if (isApp) {
    try {
      const apps = await getScreenUsage(elapsed);
      if (apps && apps.length > 0) {
        usageInfo = '她沉默期间的屏幕使用情况：';
        for (let i = 0; i < apps.length; i++) {
          const a = typeof apps[i] === 'string' ? JSON.parse(apps[i]) : apps[i];
          usageInfo += '\n- ' + a.name + ' ' + a.minutes + '分钟';
        }
        showStatus('📱 ' + usageInfo, 8000);
      } else if (apps && apps.length === 0) {
        showStatus('📱 没有检测到app使用', 8000);
        usageInfo = '她沉默期间没有使用手机。';
      } else {
        showStatus('📱 apps返回null', 8000);
      }
    } catch (e) {
      showStatus('⚠ 使用时间获取失败: ' + e.message, 5000);
      usageInfo = '';
    }
  }



  try {
    const res = await fetch(gateway + '/api/proactive-check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: recentMsgs,
        config,
        elapsed_minutes: elapsed,
        screen_usage: usageInfo,
      }),
    });
    const result = await res.json();
    showStatus('主动消息判断: ' + JSON.stringify(result), 10000);

    if (result.should_speak) {
      window._proactivePending = true; 
      // 触发主模型生成主动消息
      messages.push({
        role: 'assistant',
        versions: [{ content: '', timestamp: '', thinking: '' }],
        activeVersion: 0,
        isProactive: true,
        source: 'proactive',
      });
      saveMessages();
      renderAll();
      await generateResponse(messages.length - 1);
      window._proactiveCooldown = true;
      setTimeout(() => { window._proactiveCooldown = false; }, 5 * 60 * 1000);
      window._proactivePending = false;
    }
  } catch (e) {
    console.error('主动消息检查失败:', e);
    showStatus('⚠ 主动消息检查失败: ' + e.message, 5000);
    window._proactivePending = false;
  }
}
// ====== 归档 ======
async function archiveToday(options = {}) {
  if (messages.length === 0) { alert('没有可归档的消息'); return; }

  const gateway = getSetting('gateway');
  if (!gateway) { alert('请先设置网关地址'); return; }

  // 1. 输入日期
  const now = new Date(Date.now() + 8 * 3600000);
  const defaultDate = now.toISOString().slice(0, 10);
  const date = options.date || prompt('请输入归档日期（YYYY-MM-DD）：', defaultDate);
  if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) {
    showStatus('⚠ 日期格式不正确，归档取消');
    return;
  }


  // 2. 输入保留条数
  const keepInput = options.keepN
    ? String(options.keepN)
    : prompt(`当前共 ${messages.length} 条消息，保留最近多少条？（默认10）`, '10');
  const keepN = parseInt(keepInput) || 10;



  // 3. 询问是否写日记
  let diary = options.diary || null;
  const wantDiary = options.skipDiaryPrompt ? false : confirm('是否同时写入日记？（取消=仅归档聊天记录）');
  if (wantDiary) {
    const content = prompt('请输入今日日记内容：');
    if (content) {
      const periodStatus = prompt('经期状态（没有则留空）：');
      diary = { content, period_status: periodStatus || null };
    }
  }

  // 4. 最终确认
  const finalConfirm = options.skipFinalConfirm
    ? true
    : confirm(`确定归档 ${date}？\n保留 ${keepN} 条消息\n${wantDiary ? '✓ 写入日记' : '✗ 不写日记'}`);
  if (!finalConfirm) {
    showStatus('归档已取消');
    return;
  }

  // 5. 执行归档
  const config = buildConfig();
  const archiveMessages = messages
    .filter(m => {
      const v = m.versions ? m.versions[m.activeVersion || 0] : m;
      const ts = v.timestamp || m.timestamp;
      if (!ts) return true;
      const bjDate = new Date(ts).toLocaleDateString('en-CA', { timeZone: 'Asia/Shanghai' });
      return bjDate === date;
    })
    .map(m => {
      const v = m.versions ? m.versions[m.activeVersion || 0] : m;
      return {
        role: m.role,
        content: v.content || '',
        timestamp: v.timestamp || m.timestamp || '',
        source: m.source || 'normal',
      };
    });

  showStatus('正在归档...');

  try {
    const res = await fetch(gateway + '/api/archive', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date, messages: archiveMessages, diary, config, skip_messages_write: true }),
    });
    const result = await res.json();

    if (result.success) {
      showStatus('归档成功：' + date + ' ✓', 5000);
      isFirstAfterArchive = true;
      setSetting('isFirstAfterArchive', 'true');
      if (messages.length > keepN) {
        messages = messages.slice(-keepN);
      }
      saveMessages();
      renderAll();
    } else {
      alert('归档失败：' + (result.error || '未知错误'));
    }
  } catch (e) {
    alert('归档出错：' + e.message);
  }
}

// ====== 导出 TXT ======
async function exportTxt(dateOverride = null) {
  if (messages.length === 0) { alert('没有可导出的消息'); return; }
  if (isExporting) { showStatus('正在导出中，请稍候...'); return; }

  const now = new Date(Date.now() + 8 * 3600000);
  const defaultDate = now.toISOString().slice(0, 10);
  const date = dateOverride !== null
    ? dateOverride
    : prompt('导出哪天的消息？（YYYY-MM-DD，留空导出全部）：', defaultDate);

  // 用户点了取消
  if (date === null) return;


  isExporting = true;

  try {
    let exportMessages = messages;
    if (date && /^\d{4}-\d{2}-\d{2}$/.test(date)) {
      exportMessages = messages.filter(m => {
        const v = m.versions ? m.versions[m.activeVersion || 0] : m;
        if (!v.timestamp) return false;
        const bjDate = new Date(v.timestamp).toLocaleDateString('en-CA', { timeZone: 'Asia/Shanghai' });
        return bjDate === date;
      });
      if (exportMessages.length === 0) {
        alert('该日期没有找到消息');
        return;
      }
    }

    const exportDate = date || defaultDate;
    let txt = `星月栖 · 聊天记录\n日期：${exportDate}\n${'='.repeat(40)}\n\n`;

    exportMessages.forEach(m => {
      const v = m.versions ? m.versions[m.activeVersion || 0] : m;
      const name = m.role === 'user' ? '星语' : '听月';
      const time = v.timestamp
        ? '[' + new Date(v.timestamp).toLocaleString('zh-CN', {
            timeZone: 'Asia/Shanghai',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
          }) + '] '
        : '';
      const cleanContent = (v.content || '').replace(/⟦[^⟧]*⟧\s*/g, '');
      txt += `${time}${name}：\n${cleanContent}\n\n`;
    });

    const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
    if (isApp) {
      try {
        const { Filesystem } = Capacitor.Plugins;
        const fileName = `星月栖_${exportDate}.txt`;
        const base64 = await blobToBase64(blob);
        await Filesystem.writeFile({
          path: 'Download/' + fileName,
          data: base64,
          directory: 'EXTERNAL_STORAGE',
          recursive: true,
        });
        showStatus('已保存到 Download/' + fileName + ' ✓');
      } catch (e) {
        showStatus('⚠ 导出失败: ' + e.message, 5000);
      }
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
        a.href = url;
      a.download = `星月栖_${exportDate}.txt`;
      a.click();
      URL.revokeObjectURL(url);
      showStatus('已导出 TXT ✓');
    }
  } finally {
    isExporting = false;
  }
}

function blobToBase64(blob) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result.split(',')[1]);
    reader.readAsDataURL(blob);
  });
}


// ====== 拉取聊天记录 ======  
async function pullChatlog() {
  const gateway = getSetting('gateway');
  if (!gateway) { alert('请先设置网关地址'); return; }

  const date = prompt('拉取哪天的聊天记录？（YYYY-MM-DD）：');
  if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) {
    showStatus('⚠ 日期格式不正确');
    return;
  }

  const action = confirm(`拉取 ${date} 的聊天记录到本地？\n\n【确定】= 追加到当前消息末尾\n【取消】= 替换当前所有消息`);
  const isAppend = action;

  showStatus('正在拉取...');

  try {
    const res = await fetch(`${gateway}/api/memory/chatlogs/${date}`);
    const data = await res.json();

    if (!data || (!data.content && !data.messages_json)) {
      alert('该日期没有聊天记录');
      return;
    }

    const parsed = data.messages_json
      ? data.messages_json.map(m => ({
          role: m.role,
          versions: [{ content: m.content || '', timestamp: m.timestamp || '' }],
          activeVersion: 0,
        }))
      : parseChatlog(data.content);
    if (parsed.length === 0) {
      alert('解析失败或记录为空');
      return;
    }

    if (isAppend) {
      messages = messages.concat(parsed);
    } else {
      messages = parsed;
    }

    renderAll();
    saveMessages();
    showStatus(`拉取成功：${date}，共 ${parsed.length} 条消息 ✓`);

  } catch (e) {
    alert('拉取失败：' + e.message);
  }
}

function parseChatlog(content) {
  const lines = content.split('\n');
  const result = [];
  let currentRole = null;
  let currentContent = '';
  let currentTimestamp = '';

  for (const line of lines) {
    // 匹配格式：[HH:MM] 星语： 或 [HH:MM] 听月：
    const match = line.match(/^\[(\d{2}:\d{2})\]\s*(星语|听月)：?\s*(.*)$/);
    if (match) {
      // 保存上一条
      if (currentRole) {
        result.push({
          role: currentRole === '星语' ? 'user' : 'assistant',
          versions: [{ content: currentContent.trim(), timestamp: currentTimestamp || '' }],
          activeVersion: 0,
        });
      }
      currentTimestamp = match[1];
      currentRole = match[2];
      currentContent = match[3] || '';
    } else if (currentRole) {
      // 续接上一条的多行内容
      currentContent += '\n' + line;
    }
  }

  // 保存最后一条
  if (currentRole) {
    result.push({
      role: currentRole === '星语' ? 'user' : 'assistant',
      versions: [{ content: currentContent.trim(), timestamp: currentTimestamp || '' }],
      activeVersion: 0,
    });
  }

  return result;
}

async function loadCalendarEvents() {
  const gateway = getSetting('gateway');
  if (!gateway) {
    document.getElementById('cal-events-list').innerHTML = '<p style="color:var(--text2);">请先设置网关地址</p>';
    return;
  }

  try {
    const res = await fetch(gateway + '/api/calendar');
    const events = await res.json();
    const list = document.getElementById('cal-events-list');

    if (!Array.isArray(events) || events.length === 0) {
      list.innerHTML = '<p style="color:var(--text2);font-size:13px;">暂无待办事项</p>';
      return;
    }

    const today = new Date().toISOString().slice(0, 10);

    list.innerHTML = events.map(ev => {
      const evDate = new Date(ev.date + 'T00:00:00+08:00');
      const todayDate = new Date(today + 'T00:00:00+08:00');
      const diff = Math.ceil((evDate - todayDate) / (1000 * 60 * 60 * 24));
      let countdown, countdownClass;
      if (diff < 0) {
        countdown = Math.abs(diff) + '天前';
        countdownClass = 'past';
      } else if (diff === 0) {
        countdown = '今天';
        countdownClass = '';
      } else if (diff === 1) {
        countdown = '明天';
        countdownClass = '';
      } else {
        countdown = diff + '天后';
        countdownClass = '';
      }

      return '<div class="cal-item">'
        + '<div class="cal-info">'
        + '<div class="cal-date">' + escapeHtml(ev.date) + '</div>'
        + '<div class="cal-event">' + escapeHtml(ev.event) + '</div>'
        + '</div>'
        + '<span class="cal-countdown ' + countdownClass + '">' + countdown + '</span>'
        + '<button class="cal-delete" onclick="deleteCalendarEvent(' + ev.id + ')" title="删除">✕</button>'
        + '</div>';
    }).join('');

  } catch (e) {
    document.getElementById('cal-events-list').innerHTML = '<p style="color:var(--danger);">加载失败：' + escapeHtml(e.message) + '</p>';
  }
}

  // ====== 日记确认流程 ======
function getDiaryMarkerParts() {
  return {
    open: '<' + '<日记>' + '>',
    close: '<' + '<' + '/日记>' + '>',
  };
}

function escapeRegExp(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\__CODEBLOCK_6__');
}

function getDiaryTagRegex() {
  const parts = getDiaryMarkerParts();
  return new RegExp(escapeRegExp(parts.open) + '([\\s\\S]*?)' + escapeRegExp(parts.close), 'g');
}

function getBeijingTodayStr() {
  return new Date(Date.now() + 8 * 3600000).toISOString().slice(0, 10);
}

function parseDiaryTagValue(val) {
  const parts = val.split('|');
  let diaryDate, periodStatus, diaryContent;

  if (parts.length >= 3) {
    diaryDate = parts[0].trim();
    periodStatus = parts[1].trim() || null;
    diaryContent = parts.slice(2).join('|').trim();
  } else if (parts.length === 2) {
    diaryDate = parts[0].trim();
    periodStatus = null;
    diaryContent = parts[1].trim();
  } else {
    const dateMatch = val.match(/(\d{4})[.\-](\d{1,2})[.\-](\d{1,2})/);
    diaryDate = dateMatch
      ? dateMatch[1] + '-' + dateMatch[2].padStart(2, '0') + '-' + dateMatch[3].padStart(2, '0')
      : getBeijingTodayStr();
    periodStatus = null;
    diaryContent = val.trim();
  }

  return {
    date: diaryDate || getBeijingTodayStr(),
    period_status: periodStatus,
    content: diaryContent || '',
  };
}

function buildDiaryTag(diary) {
  const parts = getDiaryMarkerParts();
  const period = diary.period_status ? diary.period_status + '|' : '';
  return parts.open + diary.date + '|' + period + diary.content + parts.close;
}

async function confirmDiaryTags(content, aiIndex) {
  const gateway = getSetting('gateway');
  if (!gateway) return content;

  const matches = Array.from(content.matchAll(getDiaryTagRegex()));
  if (matches.length === 0) return content;

  let updatedContent = content;

  for (const match of matches) {
    const originalTag = match[0];
    const parsedDiary = parseDiaryTagValue(match[1].trim());
    const result = await showDiaryConfirmDialog(parsedDiary);

    if (!result || result.action === 'cancel') {
      showStatus('日记写入已取消');
      continue;
    }

    const saved = await saveReviewedDiary(result.action, result.diary);
    if (!saved) continue;

    updatedContent = updatedContent.replace(originalTag, buildDiaryTag(result.diary));

    const msg = messages[aiIndex];
    if (msg && msg.versions) {
      msg.versions[msg.activeVersion || 0].content = updatedContent;
      saveMessages();
      renderAll();
    }

    await runAfterDiarySavedFlow(result.diary.date);
  }

  return updatedContent;
}

async function saveReviewedDiary(action, diary) {
  const gateway = getSetting('gateway');
  if (!gateway) return false;

  const payload = {
    date: diary.date,
    content: diary.content,
    period_status: diary.period_status,
  };

  try {
    if (action === 'overwrite') {
      const patchRes = await fetch(gateway + '/api/memory/diaries/' + diary.date, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          content: diary.content,
          period_status: diary.period_status,
        }),
      });
      const patchResult = await patchRes.json().catch(() => ({}));
      if (patchRes.ok && patchResult.success) {
        showStatus('日记已覆盖 ✓');
        return true;
      }
    }

    const res = await fetch(gateway + '/api/diary', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const result = await res.json().catch(() => ({}));
    if (res.ok && result.success !== false) {
      showStatus(action === 'overwrite' ? '日记已写入 ✓' : '日记已确认写入 ✓');
      return true;
    }

    showStatus('⚠ 日记写入失败: ' + (result.error || '未知错误'), 5000);
    return false;
  } catch (e) {
    showStatus('⚠ 日记写入失败: ' + e.message, 5000);
    return false;
  }
}

  // ====== 状态/缓存/日历标记检测 ======
async function detectStatusTags(content) {
  const gateway = getSetting('gateway');
  if (!gateway) return content;

  // 保护代码框内容不被标记检测
  const codeBlocks = [];
  let cleaned = content.replace(/```[\s\S]*?```/g, (match) => {
    codeBlocks.push(match);
    return `__CODEBLOCK_${codeBlocks.length - 1}__`;
  });

  let m;

  const statusRegex = /<<状态>>([\s\S]*?)<<\/状态>>/g;
  while ((m = statusRegex.exec(cleaned)) !== null) {
    const val = m[1].trim();
    if (val) {
      try {
        await fetch(gateway + '/api/status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'status', content: val }),
        });
        showStatus('状态已记录 ✓');
      } catch (e) {
        console.error('存储状态失败:', e);
        showStatus('⚠ 状态存储失败: ' + e.message, 3000);
      }
    }
  }

  const cacheRegex = /<<缓存>>([\s\S]*?)<<\/缓存>>/g;
  while ((m = cacheRegex.exec(cleaned)) !== null) {
    const val = m[1].trim();
    if (val) {
      try {
        await fetch(gateway + '/api/status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'cache', content: val }),
        });
        showStatus('缓存已记录 ✓');
      } catch (e) {
        console.error('存储缓存失败:', e);
        showStatus('⚠ 缓存存储失败: ' + e.message, 3000);
      }
    }
  }

  const calendarRegex = /<<日历>>([\s\S]*?)<<\/日历>>/g;
  while ((m = calendarRegex.exec(cleaned)) !== null) {
    const val = m[1].trim();
    if (val) {
      const [cDate, cEvent] = val.split('|');
      if (cDate && cEvent) {
        try {
          await fetch(gateway + '/api/calendar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ date: cDate.trim(), event: cEvent.trim() }),
          });
          showStatus('日历已记录 ✓');
        } catch (e) {
          console.error('存储日历失败:', e);
          showStatus('⚠ 日历存储失败: ' + e.message, 3000);
        }
      }
    }
  }

  const memoryRegex = /<<记忆>>([\s\S]*?)<<\/记忆>>/g;
  while ((m = memoryRegex.exec(cleaned)) !== null) {
    const val = m[1].trim();
    if (val) {
      const sepIdx = val.indexOf('|');
      if (sepIdx > 0) {
        const category = val.slice(0, sepIdx).trim();
        const memContent = val.slice(sepIdx + 1).trim();
        if (category && memContent) {
          try {
            await fetch(gateway + '/api/memory/core', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ category, title: category, content: memContent }),
            });
            showStatus('记忆已创建 ✓');
          } catch (e) {
            console.error('创建记忆失败:', e);
            showStatus('⚠ 记忆创建失败: ' + e.message, 3000);
          }
        }
      }
    }
  }

  const updateMemRegex = /<<改记忆>>([\s\S]*?)<<\/改记忆>>/g;
  while ((m = updateMemRegex.exec(cleaned)) !== null) {
    const val = m[1].trim();
    if (val) {
      const sepIdx = val.indexOf('|');
      if (sepIdx > 0) {
        const memId = val.slice(0, sepIdx).trim();
        const instruction = val.slice(sepIdx + 1).trim();
        if (memId && instruction) {
          try {
            const res = await fetch(gateway + '/api/memory/smart-update', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: parseInt(memId), instruction, config: buildConfig() }),
            });
            const result = await res.json();
            if (result.success) {
              showStatus('记忆已更新 ✓');
              cleaned = cleaned.replace(m[0], '<<改记忆>>' + memId + '|' + result.content + '<</改记忆>>'); 
            } else { 
              showStatus('⚠ 记忆修改失败: ' + (result.error || '未知错误'), 5000); 
            }
          } catch (e) {
            console.error('智能改记忆失败:', e); showStatus('⚠ 记忆修改失败: ' + e.message, 5000); 
          }
        }
      }
    }
  }

  // 日记标记不在这里自动写库，改由 confirmDiaryTags 在当前回复生成完成后弹窗确认。

  // 还原代码框
  codeBlocks.forEach((block, i) => {
    cleaned = cleaned.replace(`__CODEBLOCK_${i}__`, block);
  });

  return cleaned.trim();
}

// ====== Web Push 订阅 ======
async function subscribePush() {
  const gateway = getSetting('gateway');
  const vapidPublicKey = 'BGgOWrHs5ebFeoU_MpS4yHjADrxtJrveWF0qLPYeJcuQdETNo-MKn4QlfUiJqCWBRy-qWAuGTG9BA7fxGm_KLsM';
  
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    showStatus('⚠ 浏览器不支持推送通知', 3000);
    return;
  }

  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      showStatus('⚠ 通知权限被拒绝', 3000);
      return;
    }

    const reg = await navigator.serviceWorker.ready;
    
    // 检查是否已订阅
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      // urlBase64转Uint8Array
      const padding = '='.repeat((4 - vapidPublicKey.length % 4) % 4);
      const base64 = (vapidPublicKey + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      const applicationServerKey = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; i++) {
        applicationServerKey[i] = rawData.charCodeAt(i);
      }

      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey,
      });

    }

    // 发送订阅信息到网关存储
    const subJson = sub.toJSON();
    const res = await fetch(gateway + '/api/push/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        endpoint: subJson.endpoint,
        p256dh: subJson.keys.p256dh,
        auth: subJson.keys.auth,
      }),
    });

    if (res.ok) {
      showStatus('推送通知已开启 ✓');
    } else {
      showStatus('⚠ 订阅保存失败', 3000);
    }
  } catch (e) {
    console.error('推送订阅失败:', e);
    showStatus('⚠ 推送订阅失败: ' + e.message, 3000);
  }
}

  
// ====== PWA ======
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
