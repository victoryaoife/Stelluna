<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>星月栖 · Stelluna</title>
<meta name="theme-color" content="#0f0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #0f0f1a;
  --surface: #1a1a2e;
  --surface2: #232340;
  --border: #e8e8f0;
  --text: #3a4f7a;
  --text2: #2a2a50;
  --accent: #6c8dca;
  --user-bg: #e8e8f0;
  --ai-bg: #e8e8f0;
  --radius: 14px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html, body {
  height:100%; background:var(--bg); color:var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow:hidden;
}
#app { display:flex; flex-direction:column; height:100%; }
#header {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px; background:var(--surface);
  border-bottom:1px solid var(--border);
  padding-top: max(12px, env(safe-area-inset-top));
}
#header h1 { font-size:17px; font-weight:600; }
#header button {
  background:none; border:none; color:var(--text2);
  font-size:20px; padding:4px 8px; cursor:pointer;
}
#messages {
  flex:1; overflow-y:auto; padding:12px 4px;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling: touch;
}
.msg {
  display:flex; flex-direction:column; margin-bottom:12px;
  max-width:88%; animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
.msg.user { align-self:flex-end; align-items:flex-end; }
.msg.ai { align-self:flex-start; align-items:flex-start; }
.msg-bubble {
  padding:10px 14px; border-radius:var(--radius);
  font-size:15px; line-height:1.6; word-break:break-word;
}
.msg.user .msg-bubble {
  background:var(--user-bg);
  border-bottom-right-radius:4px;
}
.msg.ai .msg-bubble {
  background:var(--ai-bg);
  border-bottom-left-radius:4px;
}
.msg-time { font-size:11px; color:var(--text2); margin-top:3px; padding:0 4px; }
.msg-bubble p { margin:0.4em 0; }
.msg-bubble p:first-child { margin-top:0; }
.msg-bubble p:last-child { margin-bottom:0; }
.msg-bubble code {
  background:rgba(255,255,255,0.08); padding:1px 5px;
  border-radius:4px; font-size:13px;
}
.msg-bubble pre {
  background:rgba(0,0,0,0.3); padding:10px;
  border-radius:8px; overflow-x:auto; margin:0.5em 0;
}
.msg-bubble pre code { background:none; padding:0; }
.msg-bubble blockquote {
  border-left:3px solid var(--accent); padding-left:10px;
  color:var(--text2); margin:0.5em 0; font-style:italic;
}
.msg-bubble em { color:#c8a8d8; }
.msg-bubble strong { color:#d8d0f0; }
.msg-bubble[contenteditable=true] {
  outline:1px solid var(--accent);
  border-radius:var(--radius);
}
.msg-actions {
  display:flex; gap:6px; margin-top:3px; align-items:center;
  opacity:0; transition:opacity 0.2s;
}
.msg:hover .msg-actions, .msg:active .msg-actions { opacity:1; }
.msg-actions button {
  background:var(--surface2); border:1px solid var(--border);
  color:var(--text2); font-size:11px; padding:2px 8px;
  border-radius:6px; cursor:pointer;
}
.version-nav { font-size:11px; color:var(--text2); }
.edit-actions { display:flex; gap:6px; margin-top:4px; }
.edit-actions button {
  font-size:12px; padding:3px 10px; border-radius:6px;
  border:none; cursor:pointer;
}
.edit-save { background:var(--accent); color:white; }
.edit-cancel { background:var(--surface2); color:var(--text2); border:1px solid var(--border) !important; }
.thinking-block {
  margin-bottom:8px; border:1px solid var(--border);
  border-radius:8px; overflow:hidden;
}
.thinking-toggle {
  padding:6px 10px; font-size:12px; color:var(--text2);
  cursor:pointer; background:rgba(255,255,255,0.03);
  user-select:none;
}
.thinking-arrow {
  display:inline-block; transition:transform 0.2s;
  font-size:10px;
}
.thinking-arrow.open { transform:rotate(90deg); }
.thinking-content {
  display:none; padding:8px 10px; font-size:13px;
  color:var(--text2); line-height:1.5;
  max-height:300px; overflow-y:auto;
  white-space:pre-wrap; word-break:break-word;
  border-top:1px solid var(--border);
}
.thinking-content.show { display:block; }
#input-area {
  display:flex; align-items:flex-end; gap:8px;
  padding:10px 12px; background:var(--surface);
  border-top:1px solid var(--border);
  padding-bottom: max(10px, var(--safe-bottom));
}
#input {
  flex:1; background:var(--surface2); border:1px solid var(--border);
  color:var(--text); border-radius:20px; padding:10px 16px;
  font-size:15px; line-height:1.4; resize:none;
  max-height:120px; outline:none; font-family:inherit;
}
#input:focus { border-color:var(--accent); }
#input::placeholder { color:var(--text2); }
#send-btn {
  background:var(--accent); border:none; color:white;
  width:38px; height:38px; border-radius:50%; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:18px; flex-shrink:0;
}
#send-btn:disabled { opacity:0.4; }
#settings-overlay {
  display:none; position:fixed; inset:0; background:var(--bg);
  z-index:100; overflow-y:auto;
  padding: max(12px, env(safe-area-inset-top)) 16px 32px;
}
#settings-overlay.show { display:block; }
#settings-overlay h2 { font-size:18px; margin-bottom:16px; }
.setting-group { margin-bottom:20px; }
.setting-group label {
  display:block; font-size:13px; color:var(--text2);
  margin-bottom:5px;
}
.setting-group input, .setting-group textarea, .setting-group select {
  width:100%; background:var(--surface2); border:1px solid var(--border);
  color:var(--text); padding:10px 12px; border-radius:10px;
  font-size:14px; font-family:inherit; outline:none;
}
.setting-group textarea { min-height:120px; resize:vertical; line-height:1.5; }
.settings-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.settings-header button {
  background:var(--accent); border:none; color:white;
  padding:6px 16px; border-radius:8px; font-size:14px; cursor:pointer;
}
.supabase-status {
  font-size:12px; padding:6px 10px; border-radius:8px;
  background:var(--surface2); margin-top:6px;
}
.status-ok { color:#6ecf6e; }
.status-err { color:#cf6e6e; }
.typing { display:flex; gap:4px; padding:4px 0; }
.typing span {
  width:6px; height:6px; background:var(--text2); border-radius:50%;
  animation:bounce 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay:0.2s; }
.typing span:nth-child(3) { animation-delay:0.4s; }
@keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
#messages::-webkit-scrollbar { width:4px; }
#messages::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <button onclick="newChat()" title="新对话">＋</button>
    <h1>星月栖</h1>
    <button onclick="toggleSettings()" title="设置">⚙</button>
  </div>
  <div id="messages"></div>
  <div id="input-area">
    <textarea id="input" rows="1" placeholder="说点什么..."
      oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
    <button id="send-btn" onclick="sendMessage()">↑</button>
  </div>
</div>

<div id="settings-overlay">
  <div class="settings-header">
    <h2>⚙ 设置</h2>
    <button onclick="saveSettings()">保存</button>
  </div>
  <div class="setting-group">
    <label>API 地址（Base URL）</label>
    <input id="s-url" placeholder="https://az.zlapi.vip/v1">
  </div>
  <div class="setting-group">
    <label>API Key</label>
    <input id="s-key" type="password" placeholder="sk-...">
  </div>
  <div class="setting-group">
    <label>模型名称</label>
    <input id="s-model" placeholder="模型名称">
  </div>
  <div class="setting-group">
    <label>上下文轮数（发送最近 n 轮对话）</label>
    <input id="s-context" type="number" value="20" min="1" max="100">
  </div>
  <hr style="border-color:var(--border); margin:20px 0;">
  <div class="setting-group">
    <label>Supabase URL</label>
    <input id="s-supa-url" placeholder="https://xxx.supabase.co">
  </div>
  <div class="setting-group">
    <label>Supabase Key</label>
    <input id="s-supa-key" type="password" placeholder="eyJ...">
  </div>
  <div class="setting-group">
    <button onclick="testSupabase()" style="background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;">
      测试连接 & 拉取核心记忆
    </button>
    <div id="supa-status" class="supabase-status" style="display:none;"></div>
  </div>
  <hr style="border-color:var(--border); margin:20px 0;">
  <div class="setting-group">
    <label>System Prompt</label>
    <textarea id="s-prompt" placeholder="在这里粘贴你的 system prompt..."></textarea>
  </div>
  <div style="margin-top:20px;">
    <button onclick="toggleSettings()" style="background:none;border:1px solid var(--border);color:var(--text2);padding:8px 20px;border-radius:8px;cursor:pointer;width:100%;">
      返回聊天
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
let messages = [];
let isGenerating = false;
let coreMemories = '';

window.onload = () => {
  loadSettings();
  loadMessages();
  renderAll();
  const supaUrl = localStorage.getItem('supaUrl');
  const supaKey = localStorage.getItem('supaKey');
  if (supaUrl && supaKey) fetchCoreMemories(supaUrl, supaKey);
};

function toggleSettings() {
  document.getElementById('settings-overlay').classList.toggle('show');
}

function loadSettings() {
  document.getElementById('s-url').value = localStorage.getItem('apiUrl') || '';
  document.getElementById('s-key').value = localStorage.getItem('apiKey') || '';
  document.getElementById('s-model').value = localStorage.getItem('model') || '';
  document.getElementById('s-context').value = localStorage.getItem('contextN') || '20';
  document.getElementById('s-prompt').value = localStorage.getItem('sysPrompt') || '';
  document.getElementById('s-supa-url').value = localStorage.getItem('supaUrl') || '';
  document.getElementById('s-supa-key').value = localStorage.getItem('supaKey') || '';
}

function saveSettings() {
  localStorage.setItem('apiUrl', document.getElementById('s-url').value.trim());
  localStorage.setItem('apiKey', document.getElementById('s-key').value.trim());
  localStorage.setItem('model', document.getElementById('s-model').value.trim());
  localStorage.setItem('contextN', document.getElementById('s-context').value);
  localStorage.setItem('sysPrompt', document.getElementById('s-prompt').value);
  localStorage.setItem('supaUrl', document.getElementById('s-supa-url').value.trim());
  localStorage.setItem('supaKey', document.getElementById('s-supa-key').value.trim());
  toggleSettings();
}

async function fetchCoreMemories(url, key) {
  try {
    const r = await fetch(url + '/rest/v1/core_memories?select=category,title,content&order=id', {
      headers: { 'apikey': key, 'Authorization': 'Bearer ' + key }
    });
    const data = await r.json();
    if (Array.isArray(data) && data.length > 0) {
      coreMemories = '\n\n## 核心记忆库\n\n' +
        data.map(m => '### [' + m.category + '] ' + m.title + '\n' + m.content).join('\n\n---\n\n');
      return data.length;
    }
  } catch(e) { console.error(e); }
  return 0;
}

async function testSupabase() {
  const url = document.getElementById('s-supa-url').value.trim();
  const key = document.getElementById('s-supa-key').value.trim();
  const status = document.getElementById('supa-status');
  status.style.display = 'block';
  status.textContent = '连接中...';
  status.className = 'supabase-status';
  if (!url || !key) {
    status.textContent = '请填写 URL 和 Key';
    status.classList.add('status-err');
    return;
  }
  const count = await fetchCoreMemories(url, key);
  if (count > 0) {
    status.textContent = '连接成功，已加载 ' + count + ' 条核心记忆';
    status.classList.add('status-ok');
  } else {
    status.textContent = '连接失败或无数据';
    status.classList.add('status-err');
  }
}

function saveMessages() {
  localStorage.setItem('chatMessages', JSON.stringify(messages));
}

function loadMessages() {
  try { messages = JSON.parse(localStorage.getItem('chatMessages') || '[]'); }
  catch { messages = []; }
}

function newChat() {
  if (messages.length > 0 && !confirm('开启新对话？当前对话会被存档。')) return;
  if (messages.length > 0) {
    localStorage.setItem('chat_archive_' + Date.now(), JSON.stringify(messages));
  }
  messages = [];
  saveMessages();
  renderAll();
}

function escapeHtml(text) {
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function renderMarkdown(text) {
  if (!text) return '';
  try { return marked.parse(text, { breaks: true }); }
  catch { return text.replace(/\n/g, '<br>'); }
}

function formatTime(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function scrollToBottom() {
  var el = document.getElementById('messages');
  requestAnimationFrame(function() { el.scrollTop = el.scrollHeight; });
}
// ====== 渲染 ======
function renderAll() {
  var container = document.getElementById('messages');
  container.innerHTML = '';
  if (messages.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:var(--text2);margin-top:40vh;font-size:14px;">说点什么吧 ✨</div>';
    return;
  }
  messages.forEach(function(msg, i) {
    container.appendChild(createMsgEl(msg, i));
  });
  scrollToBottom();
}

function createMsgEl(msg, index) {
  var div = document.createElement('div');
  div.className = 'msg ' + (msg.role === 'user' ? 'user' : 'ai');
  div.dataset.index = index;

  var activeV = msg.versions ? msg.versions[msg.activeVersion || 0] : msg;
  var content = activeV.content || '';
  var thinking = activeV.thinking || '';
  var timestamp = activeV.timestamp || msg.timestamp;

  var bubble = document.createElement('div');
  bubble.className = 'msg-bubble';

  var html = '';
  if (thinking && msg.role === 'assistant') {
    html += '<div class="thinking-block">'
      + '<div class="thinking-toggle" onclick="toggleThinking(this)">'
      + '<span class="thinking-arrow">▶</span> 思考过程'
      + '</div>'
      + '<div class="thinking-content">' + escapeHtml(thinking) + '</div>'
      + '</div>';
  }
  html += renderMarkdown(content);
  bubble.innerHTML = html;

  var time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = formatTime(timestamp);

  var actions = document.createElement('div');
  actions.className = 'msg-actions';

  var editBtn = document.createElement('button');
  editBtn.textContent = '编辑';
  editBtn.onclick = function() { startEdit(index); };
  actions.appendChild(editBtn);

  if (msg.role === 'assistant') {
    var retryBtn = document.createElement('button');
    retryBtn.textContent = '重试';
    retryBtn.onclick = function() { retryMessage(index); };
    actions.appendChild(retryBtn);
  }

  if (msg.versions && msg.versions.length > 1) {
    var nav = document.createElement('span');
    nav.className = 'version-nav';
    var prevBtn = document.createElement('button');
    prevBtn.textContent = '◀';
    prevBtn.onclick = function() { switchVersion(index, -1); };
    var nextBtn = document.createElement('button');
    nextBtn.textContent = '▶';
    nextBtn.onclick = function() { switchVersion(index, 1); };
    var label = document.createElement('span');
    label.style.margin = '0 4px';
    label.textContent = (msg.activeVersion + 1) + '/' + msg.versions.length;
    nav.appendChild(prevBtn);
    nav.appendChild(label);
    nav.appendChild(nextBtn);
    actions.appendChild(nav);
  }

  div.appendChild(bubble);
  div.appendChild(time);
  div.appendChild(actions);
  return div;
}

function toggleThinking(el) {
  el.querySelector('.thinking-arrow').classList.toggle('open');
  el.nextElementSibling.classList.toggle('show');
}

// ====== 版本切换 ======
function switchVersion(index, dir) {
  var msg = messages[index];
  if (!msg.versions) return;
  var newV = msg.activeVersion + dir;
  if (newV < 0 || newV >= msg.versions.length) return;
  msg.activeVersion = newV;
  saveMessages();
  renderAll();
}

// ====== 编辑 ======
function startEdit(index) {
  var msgEl = document.querySelector('.msg[data-index="' + index + '"]');
  var bubble = msgEl.querySelector('.msg-bubble');
  var actions = msgEl.querySelector('.msg-actions');

  var activeV = messages[index].versions
    ? messages[index].versions[messages[index].activeVersion || 0]
    : messages[index];
  var rawText = activeV.content;

  bubble.textContent = rawText;
  bubble.contentEditable = true;
  bubble.focus();
  actions.style.display = 'none';

  var editActs = document.createElement('div');
  editActs.className = 'edit-actions';

  var saveBtn = document.createElement('button');
  saveBtn.className = 'edit-save';
  saveBtn.textContent = '保存';
  saveBtn.onclick = function() { saveEdit(index); };

  var cancelBtn = document.createElement('button');
  cancelBtn.className = 'edit-cancel';
  cancelBtn.textContent = '取消';
  cancelBtn.onclick = function() { cancelEdit(index); };

  editActs.appendChild(saveBtn);
  editActs.appendChild(cancelBtn);
  msgEl.appendChild(editActs);
}

function saveEdit(index) {
  var msgEl = document.querySelector('.msg[data-index="' + index + '"]');
  var bubble = msgEl.querySelector('.msg-bubble');
  var newText = bubble.textContent;

  if (messages[index].versions) {
    messages[index].versions[messages[index].activeVersion].content = newText;
  } else {
    messages[index].content = newText;
  }
  saveMessages();
  renderAll();
}

function cancelEdit(index) {
  renderAll();
}

// ====== 输入 ======
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 768) {
    e.preventDefault();
    sendMessage();
  }
}

// ====== 时间感知 ======
function getTimeContext() {
  var now = new Date();
  var y = now.getFullYear();
  var mo = String(now.getMonth() + 1).padStart(2, '0');
  var d = String(now.getDate()).padStart(2, '0');
  var h = now.getHours();
  var mi = String(now.getMinutes()).padStart(2, '0');
  var s = String(now.getSeconds()).padStart(2, '0');

  var period = '';
  if (h >= 0 && h < 5) period = '深夜';
  else if (h < 9) period = '早上';
  else if (h < 12) period = '上午';
  else if (h < 14) period = '中午';
  else if (h < 17) period = '下午';
  else if (h < 19) period = '傍晚';
  else if (h < 23) period = '晚上';
  else period = '深夜';

  var timeStr = y + '年' + mo + '月' + d + '日 '
    + String(h).padStart(2,'0') + ':' + mi + ':' + s;

  var elapsed = '';
  if (messages.length > 0) {
    var lastUserMsg = null;
    for (var i = messages.length - 1; i >= 0; i--) {
      if (messages[i].role === 'user') {
        var ts = messages[i].versions
          ? messages[i].versions[messages[i].activeVersion || 0].timestamp
          : messages[i].timestamp;
        lastUserMsg = ts;
        break;
      }
    }
    if (lastUserMsg) {
      var diff = Math.floor((now - new Date(lastUserMsg)) / 60000);
      if (diff >= 5) {
        if (diff < 60) elapsed = '\n星语上一条消息是' + diff + '分钟前发的。';
        else if (diff < 1440) elapsed = '\n星语上一条消息是' + Math.floor(diff/60) + '小时前发的。';
        else elapsed = '\n星语上一条消息是' + Math.floor(diff/1440) + '天前发的。';
      }
    }
  }

  return '\n\n**当前时间：' + timeStr + '（' + period + '）**' + elapsed;
}

// ====== Retry ======
function retryMessage(index) {
  if (isGenerating) return;
  var msg = messages[index];
  if (msg.role !== 'assistant') return;

  if (!msg.versions) {
    var oldContent = msg.content || '';
    var oldTs = msg.timestamp || '';
    var oldThinking = msg.thinking || '';
    msg.versions = [{ content: oldContent, timestamp: oldTs, thinking: oldThinking }];
    msg.activeVersion = 0;
    delete msg.content;
    delete msg.timestamp;
    delete msg.thinking;
  }

  msg.versions.push({ content: '', timestamp: '', thinking: '' });
  msg.activeVersion = msg.versions.length - 1;
  saveMessages();

  generateResponse(index);
}

// ====== 发送 ======
async function sendMessage() {
  var input = document.getElementById('input');
  var text = input.value.trim();
  if (!text || isGenerating) return;

  var apiUrl = localStorage.getItem('apiUrl');
  var apiKey = localStorage.getItem('apiKey');
  var model = localStorage.getItem('model');
  if (!apiUrl || !apiKey || !model) {
    alert('请先在设置中填写 API 地址、Key 和模型名称');
    return;
  }

  messages.push({
    role: 'user',
    versions: [{ content: text, timestamp: new Date().toISOString() }],
    activeVersion: 0
  });
  input.value = '';
  input.style.height = 'auto';

  messages.push({
    role: 'assistant',
    versions: [{ content: '', timestamp: '', thinking: '' }],
    activeVersion: 0
  });
  saveMessages();
  renderAll();

  generateResponse(messages.length - 1);
}

// ====== 流式生成 ======
async function generateResponse(aiIndex) {
  isGenerating = true;
  document.getElementById('send-btn').disabled = true;

  var container = document.getElementById('messages');
  var aiMsgEl = container.querySelector('.msg[data-index="' + aiIndex + '"]');
  var aiBubble = aiMsgEl.querySelector('.msg-bubble');
  aiBubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

  var apiUrl = localStorage.getItem('apiUrl');
  var apiKey = localStorage.getItem('apiKey');
  var model = localStorage.getItem('model');
  var sysPrompt = localStorage.getItem('sysPrompt') || '';
  var contextN = parseInt(localStorage.getItem('contextN') || '20');

  var recentMessages = messages.slice(0, aiIndex + 1).slice(-contextN);
  var apiMessages = [];
  for (var i = 0; i < recentMessages.length; i++) {
    var m = recentMessages[i];
    var v = m.versions ? m.versions[m.activeVersion || 0] : m;
    if (m.role === 'assistant' && i === recentMessages.length - 1) continue;
    apiMessages.push({
      role: m.role === 'user' ? 'user' : 'assistant',
      content: v.content
    });
  }

  var systemContent = sysPrompt + coreMemories + getTimeContext();

  var body = {
    model: model,
    messages: [{ role: 'system', content: systemContent }].concat(apiMessages),
    stream: true
  };

  var fullContent = '';
  var thinkingContent = '';
  var inThinking = false;
  var thinkingDone = false;

  try {
    var response = await fetch(apiUrl + '/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKey
      },
      body: JSON.stringify(body)
    });

    if (!response.ok) {
      throw new Error('API 错误: ' + response.status + ' ' + response.statusText);
    }

    var reader = response.body.getReader();
    var decoder = new TextDecoder();
    var buffer = '';

    while (true) {
      var result = await reader.read();
      if (result.done) break;

      buffer += decoder.decode(result.value, { stream: true });
      var lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (var li = 0; li < lines.length; li++) {
        var line = lines[li];
        if (!line.startsWith('data:')) continue;
        var dataStr = line.slice(5).trim();
        if (dataStr === '[DONE]') continue;

        try {
          var json = JSON.parse(dataStr);
          var delta = json.choices && json.choices[0] && json.choices[0].delta;
          if (!delta) continue;

          // 思考链：检查 reasoning_content 字段
          if (delta.reasoning_content) {
            inThinking = true;
            thinkingContent += delta.reasoning_content;
            aiBubble.innerHTML = '<div class="thinking-block">'
              + '<div class="thinking-toggle">'
              + '<span class="thinking-arrow open">▶</span> 思考中...'
              + '</div>'
              + '<div class="thinking-content show">' + escapeHtml(thinkingContent) + '</div>'
              + '</div>';
            scrollToBottom();
            continue;
          }

          // 有正文内容到达，说明思考结束
          if (delta.content) {
            if (inThinking) {
              inThinking = false;
              thinkingDone = true;
            }
            fullContent += delta.content;
            var displayHtml = '';
            if (thinkingContent) {
              displayHtml += '<div class="thinking-block">'
                + '<div class="thinking-toggle" onclick="toggleThinking(this)">'
                + '<span class="thinking-arrow">▶</span> 思考过程'
                + '</div>'
                + '<div class="thinking-content">' + escapeHtml(thinkingContent) + '</div>'
                + '</div>';
            }
            displayHtml += renderMarkdown(fullContent);
            aiBubble.innerHTML = displayHtml;
            scrollToBottom();
          }
        } catch(parseErr) {}
      }
    }

    var vObj = messages[aiIndex].versions[messages[aiIndex].activeVersion];
    vObj.content = fullContent;
    vObj.timestamp = new Date().toISOString();
    vObj.thinking = thinkingContent;
    saveMessages();
    renderAll();

  } catch (err) {
    aiBubble.innerHTML = '<span style="color:#cf6e6e;">⚠ ' + escapeHtml(err.message) + '</span>';
    var vErr = messages[aiIndex].versions[messages[aiIndex].activeVersion];
    vErr.content = '[错误] ' + err.message;
    saveMessages();
  }

  isGenerating = false;
  document.getElementById('send-btn').disabled = false;
  scrollToBottom();
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</body>
</html>
