<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>星月栖 · Stelluna</title>
<meta name="theme-color" content="#0f0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #C4DBF2;
  --surface: #1a1a2e;
  --surface2: #333369;
  --border: #2a2a4a;
  --text: #5A87DB;
  --text2: #77A2F7;
  --accent: #6c8dca;
  --accent2: #8ba7d8;
  --user-bg: #487FBD;
  --ai-bg: #F7FCFF;
  --danger: #cf6e6e;
  --success: #6ecf6e;
  --radius: 15px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
[data-theme="warm"] {
  --bg: #1a1410;
  --surface: #2e2620;
  --surface2: #3d3328;
  --border: #4a3f32;
  --text: #f0e8e0;
  --text2: #b0a898;
  --accent: #ca9a6c;
  --accent2: #d8b48a;
  --user-bg: #f0e8e0;
  --ai-bg: #FFF7F0;
}
[data-theme="forest"] {
  --bg: #0f1a14;
  --surface: #1a2e22;
  --surface2: #234032;
  --border: #2a4a3a;
  --text: #e0f0e8;
  --text2: #98b0a0;
  --accent: #6cca8d;
  --accent2: #8ad8a7;
  --user-bg: #e0f0e8;
  --ai-bg: #F0FFF7;
}
html, body {
  height:100%; background:var(--bg); color: #F2F7FF;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow:hidden;
}
#app { display:none; flex-direction:column; height:100%; }

/* ====== Lock Screen ====== */
#lock-screen {
  position:fixed; inset:0; background:var(--bg);
  z-index:999; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:12px; padding:20px;
}
#lock-screen.hidden { display:none; }
#lock-screen .lock-emoji { font-size:48px; margin-bottom:8px; }
#lock-screen h2 { font-size:18px; color:var(--text); }
#lock-screen .lock-subtitle { font-size:13px; color:var(--text2); margin-bottom:8px; }
#lock-screen input {
  width:220px; background:var(--surface2); border:1px solid var(--border);
  color:var(--text); padding:12px 16px; border-radius:12px;
  font-size:18px; text-align:center; outline:none;
  letter-spacing:6px; -webkit-text-security:disc;
}
#lock-screen input:focus { border-color:var(--accent); }
#lock-screen .lock-btn {
  background:var(--accent); border:none; color:white;
  padding:10px 32px; border-radius:10px; font-size:15px;
  cursor:pointer; margin-top:4px;
}
#lock-screen .lock-error {
  color:var(--danger); font-size:13px; min-height:20px;
}
#lock-screen .lock-reset {
  font-size:12px; color:var(--text2); cursor:pointer;
  margin-top:24px; text-decoration:underline;
}
  
/* ====== Header ====== */
#header {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px; background:var(--surface);
  border-bottom:1px solid var(--border);
  padding-top: max(12px, env(safe-area-inset-top));
  position: relative;
}
#header h1 {
  font-size:17px; font-weight:600;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}
.header-left, .header-right { display:flex; gap:4px; }
#header button {
  background:none; border:none; color:var(--text2);
  font-size:20px; padding:4px 8px; cursor:pointer;
}
.wallet-badge {
  font-size:10px; background:var(--accent); color:white;
  border-radius:8px; padding:1px 5px; margin-left:-4px;
  vertical-align:top;
}

/* ====== Messages ====== */
#messages {
  flex:1; overflow-y:auto; padding:12px 4px;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling: touch;
}
.msg {
  display:flex; flex-direction:column; margin-bottom:12px;
  max-width:100%; animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
.msg.user { align-self:flex-end; align-items:flex-end; }
.msg.ai { align-self:flex-start; align-items:flex-start; }
.msg.proactive { opacity:0.9; }
.msg-bubble {
  padding:10px 14px; border-radius:var(--radius);
  font-size:20px; line-height:1.2; word-break:break-word; font-weight:500;
  max-width: 90%;
}
.msg.user .msg-bubble {
  color: #F5F9FC; background:var(--user-bg);
  border-bottom-right-radius:6px;
}
.msg.ai .msg-bubble {
  color: #4369BA; background:var(--ai-bg);
  border-bottom-left-radius:6px;
}
.msg-time { font-size:13px; color:var(--text2); margin-top:3px; padding:0 4px; }
.msg-bubble p { margin:0.4em 0; }
.msg-bubble p:first-child { margin-top:0; }
.msg-bubble p:last-child { margin-bottom:0; }
.msg-bubble code {
  background:rgba(240,248,299,1); padding:1px 5px;
  border-radius:4px; font-size:13px;
}
.msg-bubble pre {
  background:rgba(0,0,0,0.3); padding:10px;
  border-radius:8px; overflow-x:auto; margin:0.5em 0;
  position: relative;
}
.msg-bubble pre code { background:none; padding:0; }
.code-header {
  display:flex; justify-content:space-between; align-items:center;
  padding:4px 10px; background:rgba(240,248,255,1);
  border-radius:8px 8px 0 0; font-size:15px; color:var(--text2);
}
.code-header .copy-btn {
  background:none; border:1px solid var(--border);
  color:var(--text2); font-size:15px; padding:2px 8px;
  border-radius:4px; cursor:pointer;
}
.code-header .copy-btn:hover { color:var(--accent); border-color:var(--accent); }
.code-collapse pre {
  max-height:300px; overflow-y:auto;
}
.code-collapse.collapsed pre {
  max-height:120px; overflow:hidden;
}
.code-expand-btn {
  text-align:center; padding:4px; font-size:18px;
  color:var(--accent); cursor:pointer;
  background:rgba(0,0,0,0.2); border-radius:0 0 8px 8px;
}
.msg-bubble pre code { background:none; padding:0; }
.msg-bubble blockquote {
  border-left:3px solid var(--accent); padding-left:10px;
  color:var(--text2); margin:0.5em 0; font-style:italic;
}
.msg-bubble em { color:#c8a8d8; }
.msg-bubble strong { color:#0A3080; }
.msg-bubble[contenteditable=true] {
  outline:1px solid var(--accent);
  border-radius:var(--radius);
}
.msg-actions {
  display:flex; gap:6px; margin-top:3px; align-items:center;
  opacity:0; transition:opacity 0.2s;
}
.msg:hover .msg-actions, .msg:active .msg-actions { opacity:1; }
.msg-actions button {
  background:var(--surface2); border:1px solid var(--border);
  color:var(--text2); font-size:15px; padding:2px 8px;
  border-radius:6px; cursor:pointer;
}
.version-nav { font-size:13px; color:var(--text2); }
.edit-actions { display:flex; gap:6px; margin-top:4px; }
.edit-actions button {
  font-size:13px; padding:3px 10px; border-radius:6px;
  border:none; cursor:pointer;
}
.edit-save { background:var(--accent); color:white; }
.edit-cancel { background:var(--surface2); color:var(--text2); border:1px solid var(--border) !important; }
.msg-image {
  max-width:200px; max-height:200px; border-radius:8px;
  margin:4px 0; cursor:pointer;
}
.stop-btn {
  display: inline-block;
  margin: 4px 0 4px 48px;
  padding: 4px 12px;
  background: var(--danger, #e74c3c);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 12px;
  cursor: pointer;
  opacity: 0.8;
}
.stop-btn:hover {
  opacity: 1;
}

/* ====== Thinking ====== */
.thinking-block {
  margin-bottom:8px; border:1px solid var(--border);
  border-radius:8px; overflow:hidden;
}
.thinking-toggle {
  padding:6px 10px; font-size:15px; color:var(--text2);
  cursor:pointer; background:rgba(255,255,255,0.03);
  user-select:none;
}
.thinking-arrow {
  display:inline-block; transition:transform 0.2s;
  font-size:10px;
}
.thinking-arrow.open { transform:rotate(90deg); }
.thinking-content {
  display:none; padding:8px 10px; font-size:13px;
  color:var(--text2); line-height:1.5;
  max-height:300px; overflow-y:auto;
  white-space:pre-wrap; word-break:break-word;
  border-top:1px solid var(--border);
}
.thinking-content.show { display:block; }

/* ====== Input Area ====== */
#input-area {
  display:flex; align-items:flex-end; gap:8px;
  padding:10px 12px; background:var(--surface);
  border-top:1px solid var(--border);
  padding-bottom: max(10px, var(--safe-bottom));
}
#input {
  flex:1; background:var(--surface2); border:1px solid var(--border);
  color: #F2F7FF; border-radius:20px; padding:10px 16px;
  font-size:18px; line-height:1.4; resize:none;
  max-height:120px; outline:none; font-family:inherit;
}
#input:focus { border-color:var(--accent); }
#input::placeholder { color:var(--text2); }
.input-actions { display:flex; gap:6px; align-items:flex-end; }
#img-btn {
  background:none; border:none; color:var(--text2);
  font-size:22px; cursor:pointer; padding:6px;
}
#img-btn:hover { color:var(--accent); }
#send-btn {
  background:var(--accent); border:none; color:white;
  width:38px; height:38px; border-radius:50%; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:18px; flex-shrink:0;
}
#send-btn:disabled { opacity:0.4; }
#img-preview {
  display:none; padding:6px 12px; background:var(--surface);
  border-top:1px solid var(--border);
}
#img-preview img {
  max-height:60px; border-radius:6px; margin-right:8px;
}
#img-preview .remove-img {
  background:var(--danger); color:white; border:none;
  border-radius:4px; font-size:11px; padding:2px 8px;
  cursor:pointer; vertical-align:top;
}

/* ====== Panels (Settings / Memory / Wallet) ====== */
.panel-overlay {
  display:none; position:fixed; inset:0; background:var(--bg);
  z-index:100; overflow-y:auto;
  padding: max(12px, env(safe-area-inset-top)) 16px 32px;
}
.panel-overlay.show { display:block; }
.panel-header {
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:20px;
}
.panel-header h2 { font-size:18px; }
.panel-header button {
  background:var(--accent); border:none; color:white;
  padding:6px 16px; border-radius:8px; font-size:14px; cursor:pointer;
}
.setting-group { margin-bottom:20px; }
.setting-group label {
  display:block; font-size:13px; color:var(--text2);
  margin-bottom:5px;
}
.setting-group input, .setting-group textarea, .setting-group select {
  width:100%; background:var(--surface2); border:1px solid var(--border);
  color:var(--text); padding:10px 12px; border-radius:10px;
  font-size:14px; font-family:inherit; outline:none;
}
.setting-group textarea { min-height:120px; resize:vertical; line-height:1.5; }
.setting-row {
  display:flex; gap:8px; align-items:center; margin-bottom:8px;
}
.setting-row input { flex:1; }
.small-btn {
  background:var(--surface2); border:1px solid var(--border);
  color:var(--text); padding:8px 12px; border-radius:8px;
  cursor:pointer; font-size:13px; white-space:nowrap;
}
.small-btn:hover { border-color:var(--accent); }
.small-btn.active { background:var(--accent); color:white; border-color:var(--accent); }
.small-btn.danger { color:var(--danger); }
.small-btn.danger:hover { background:var(--danger); color:white; }

/* ====== Model Picker ====== */
.model-picker { position:relative; }
.model-picker input { padding-right:36px; }
.model-picker .refresh-btn {
  position:absolute; right:10px; top:50%; transform:translateY(-50%);
  background:none; border:none; color:var(--text2); cursor:pointer;
  font-size:16px;
}
.model-dropdown {
  display:none; position:absolute; top:100%; left:0; right:0;
  background:var(--surface2); border:1px solid var(--border);
  border-radius:10px; max-height:300px; overflow-y:auto;
  z-index:10; margin-top:4px;
}
.model-dropdown.show { display:block; }
.model-dropdown .model-search {
  width:100%; padding:8px 12px; background:var(--surface);
  border:none; border-bottom:1px solid var(--border);
  color:var(--text); font-size:13px; outline:none;
  border-radius:10px 10px 0 0;
}
.model-item {
  padding:8px 12px; cursor:pointer; font-size:13px;
  display:flex; justify-content:space-between; align-items:center;
  border-bottom:1px solid rgba(255,255,255,0.03);
}
.model-item:hover { background:rgba(255,255,255,0.05); }
.model-item .star {
  cursor:pointer; font-size:14px; color:var(--text2);
}
.model-item .star.faved { color:#f0c040; }
.model-section-title {
  padding:6px 12px; font-size:11px; color:var(--text2);
  background:rgba(255,255,255,0.02); font-weight:600;
}

/* ====== Slider ====== */
.slider-group { display:flex; align-items:center; gap:10px; }
.slider-group input[type=range] {
  flex:1; accent-color:var(--accent);
}
.slider-value {
  font-size:13px; color:var(--accent); min-width:36px; text-align:center;
}

/* ====== Toggle ====== */
.toggle-row {
  display:flex; justify-content:space-between; align-items:center;
  padding:8px 0;
}
.toggle-row label { font-size:14px; }
.toggle {
  width:44px; height:24px; background:var(--surface2);
  border:1px solid var(--border); border-radius:12px;
  cursor:pointer; position:relative; transition:background 0.2s;
}
.toggle.on { background:var(--accent); border-color:var(--accent); }
.toggle::after {
  content:''; position:absolute; width:18px; height:18px;
  background:white; border-radius:50%; top:2px; left:2px;
  transition:transform 0.2s;
}
.toggle.on::after { transform:translateX(20px); }

/* ====== Memory Panel ====== */
.memory-tabs {
  display:flex; gap:8px; margin-bottom:16px;
}
.memory-tab {
  padding:8px 16px; border-radius:8px; cursor:pointer;
  background:var(--surface2); border:1px solid var(--border);
  color:var(--text2); font-size:13px;
}
.memory-tab.active { background:var(--accent); color:white; border-color:var(--accent); }
.memory-card {
  background:var(--surface2); border:1px solid var(--border);
  border-radius:10px; padding:12px; margin-bottom:10px;
}
.memory-card h4 {
  font-size:14px; margin-bottom:6px; color:var(--accent);
}
.memory-card p {
  font-size:13px; color:var(--text2); line-height:1.5;
  white-space:pre-wrap; word-break:break-word;
}
.memory-card .meta {
  font-size:11px; color:var(--text2); margin-top:6px;
  display:flex; gap:8px;
}
.memory-card .card-actions {
  display:flex; gap:6px; margin-top:8px;
}

/* ====== Wallet Panel ====== */
.wallet-balance {
  text-align:center; padding:24px; background:var(--surface2);
  border-radius:14px; margin-bottom:20px;
}
.wallet-balance .amount {
  font-size:36px; font-weight:700; color:var(--accent);
}
.wallet-balance .label {
  font-size:13px; color:var(--text2); margin-top:4px;
}
.tx-item {
  display:flex; justify-content:space-between; align-items:center;
  padding:10px 0; border-bottom:1px solid var(--border);
  font-size:13px;
}
.tx-item .tx-desc { color:var(--text2); }
.tx-item .tx-amount { font-weight:600; }
.tx-item .tx-amount.positive { color:var(--success); }
.tx-item .tx-amount.negative { color:var(--danger); }

/* ====== Red Packet ====== */
.red-packet-overlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.7); z-index:200;
  align-items:center; justify-content:center;
}
.red-packet-overlay.show { display:flex; }
.red-packet {
  width:280px; background:linear-gradient(135deg, #e74c3c, #c0392b);
  border-radius:16px; padding:32px 24px; text-align:center;
  color:white; position:relative; animation:packetIn 0.4s ease;
}
@keyframes packetIn { from{transform:scale(0.5);opacity:0} to{transform:scale(1);opacity:1} }
.red-packet h3 { font-size:16px; margin-bottom:8px; opacity:0.9; }
.red-packet .rp-amount { font-size:42px; font-weight:700; margin:16px 0; }
.red-packet .rp-msg { font-size:14px; opacity:0.85; margin-bottom:20px; }
.red-packet .rp-close {
  background:rgba(255,255,255,0.2); border:none; color:white;
  padding:8px 24px; border-radius:20px; cursor:pointer; font-size:14px;
}

/* ====== Provider Tags ====== */
.provider-tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
.provider-tag {
  padding:4px 10px; border-radius:6px; font-size:12px;
  background:var(--surface2); border:1px solid var(--border);
  color:var(--text2); cursor:pointer;
}
.provider-tag.active { background:var(--accent); color:white; border-color:var(--accent); }
.provider-tag .remove {
  margin-left:4px; cursor:pointer; opacity:0.6;
}
.provider-tag .remove:hover { opacity:1; }

/* ====== Status Bar ====== */
#status-bar {
  font-size:11px; color:var(--text2); text-align:center;
  padding:2px 8px; background:var(--surface);
  border-top:1px solid var(--border);
  display:none;
}
#status-bar.show { display:block; }

/* ====== Misc ====== */
.typing { display:flex; gap:4px; padding:4px 0; }
.typing span {
  width:6px; height:6px; background:var(--text2); border-radius:50%;
  animation:bounce 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay:0.2s; }
.typing span:nth-child(3) { animation-delay:0.4s; }
@keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
#messages::-webkit-scrollbar { width:4px; }
#messages::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
.divider {
  border:none; border-top:1px solid var(--border); margin:20px 0;
}
.section-title {
  font-size:14px; font-weight:600; margin-bottom:12px;
  color:var(--accent);
}
.supabase-status {
  font-size:12px; padding:6px 10px; border-radius:8px;
  background:var(--surface2); margin-top:6px;
}
.status-ok { color:#6ecf6e; }
.status-err { color:#cf6e6e; }

/* ====== Calendar Panel ====== */
.calendar-hero {
  text-align:center; padding:24px; background:var(--surface2);
  border-radius:14px; margin-bottom:20px;
}
.calendar-hero .days-count {
  font-size:42px; font-weight:700; color:var(--accent);
}
.calendar-hero .days-label {
  font-size:14px; color:var(--text2); margin-top:4px;
}
.calendar-hero .days-since {
  font-size:12px; color:var(--text2); margin-top:2px;
}
.cal-item {
  display:flex; justify-content:space-between; align-items:center;
  padding:12px; background:var(--surface2); border:1px solid var(--border);
  border-radius:10px; margin-bottom:8px;
}
.cal-item .cal-info { flex:1; }
.cal-item .cal-date { font-size:14px; color:var(--text); font-weight:500; }
.cal-item .cal-event { font-size:13px; color:var(--text2); margin-top:2px; }
.cal-item .cal-countdown {
  font-size:12px; padding:4px 10px; border-radius:6px;
  background:var(--accent); color:white; white-space:nowrap;
}
.cal-item .cal-countdown.past {
  background:var(--surface); color:var(--text2);
}
.cal-item .cal-delete {
  background:none; border:none; color:var(--text2);
  font-size:16px; cursor:pointer; margin-left:8px; padding:4px;
}
.cal-item .cal-delete:hover { color:var(--danger); }

</style>
</head>
<body>

<!-- ====== Lock Screen ====== -->
<div id="lock-screen">
  <div class="lock-emoji">🌙</div>
  <h2 id="lock-title">设置密码</h2>
  <div class="lock-subtitle" id="lock-subtitle">为星月栖设置一个专属密码</div>
  <input id="lock-input" type="tel" maxlength="6" placeholder="······" onkeydown="if(event.key==='Enter')lockAction()">
  <input id="lock-confirm" type="tel" maxlength="6" placeholder="再输入一次" style="display:none;" onkeydown="if(event.key==='Enter')lockAction()">
  <button class="lock-btn" onclick="lockAction()">确认</button>
  <div class="lock-error" id="lock-error"></div>
  <div class="lock-reset" id="lock-reset" style="display:none;" onclick="resetPassword()">忘记密码？重置所有数据</div>
</div>
  
<div id="app">
  <!-- ====== Header ====== -->
  <div id="header">
    <div class="header-left">
      <button onclick="newChat()" title="新对话">＋</button>
      <button onclick="showPanel('memory')" title="记忆库">📋</button>
      <button onclick="showPanel('calendar')" title="日历">📅</button>
    </div>

    <h1>星月栖</h1>
    <div class="header-right">
      <button onclick="showPanel('log')" title="工作日志">📜</button>
      <button onclick="showPanel('wallet')" title="钱包">💰<span id="wallet-badge" class="wallet-badge" style="display:none;"></span></button>
      <button onclick="showPanel('settings')" title="设置">⚙</button>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
// ====== 全局状态 ======
let messages = [];
let activityLogs = [];
let isGenerating = false;
let pendingImage = null; // {url: base64, placeholder: string}
let currentAbortController = null;
let providers = []; // [{name, url, key}]
let activeProvider = 0;
let favoriteModels = [];
let allModels = [];
let currentMemoryTab = 'core';
let proactiveTimer = null;
let isFirstAfterArchive = true;
let currentLocation = null;

// ====== 初始化 ======
window.onload = () => {
  applyTheme();
  checkLock();
};

// ====== 锁屏 ======
function checkLock() {
  const pwd = localStorage.getItem('lockPassword');
  if (pwd) {
    document.getElementById('lock-title').textContent = '欢迎回来';
    document.getElementById('lock-subtitle').textContent = '请输入密码';
    document.getElementById('lock-confirm').style.display = 'none';
    document.getElementById('lock-reset').style.display = 'block';
  } else {
    document.getElementById('lock-title').textContent = '设置密码';
    document.getElementById('lock-subtitle').textContent = '为星月栖设置一个专属密码';
    document.getElementById('lock-confirm').style.display = 'block';
    document.getElementById('lock-reset').style.display = 'none';
  }
}

function lockAction() {
  const pwd = localStorage.getItem('lockPassword');
  const input = document.getElementById('lock-input').value;
  const error = document.getElementById('lock-error');
  error.textContent = '';

  if (pwd) {
    if (input === pwd) {
      unlock();
    } else {
      error.textContent = '密码错误';
      document.getElementById('lock-input').value = '';
    }
  } else {
    const confirmVal = document.getElementById('lock-confirm').value;
    if (input.length < 4) {
      error.textContent = '密码至少4位';
      return;
    }
    if (input !== confirmVal) {
      error.textContent = '两次输入不一致';
      return;
    }
    localStorage.setItem('lockPassword', input);
    unlock();
  }
}

function unlock() {
  document.getElementById('lock-screen').classList.add('hidden');
  document.getElementById('app').style.display = 'flex';
  loadSettings();
  loadMessages();
  renderAll();
  updateProviderTags();
  startProactiveTimer();
  if (getSetting('sendLocation') === 'true') requestLocation();
  try { activityLogs = JSON.parse(getSetting('activityLogs', '[]')); } catch { activityLogs = []; }
  subscribePush();
}

function resetPassword() {
  if (!confirm('重置密码将清除所有本地数据（聊天记录、设置等），但Supabase的数据不受影响。确定吗？')) return;
  if (!confirm('真的确定吗？本地数据不可恢复！')) return;
  localStorage.clear();
  location.reload();
}

// ====== LocalStorage 工具 ======
function getSetting(key, def = '') {
  return localStorage.getItem(key) || def;
}
function setSetting(key, val) {
  localStorage.setItem(key, val);
}

// ====== 面板显示/隐藏 ======
function showPanel(name) {
  document.getElementById(name + '-panel').classList.add('show');
  if (name === 'memory') loadMemoryTab();
  if (name === 'wallet') loadWallet();
  if (name === 'log') renderLogs();
  if (name === 'calendar') loadCalendar();
}
function hidePanel(name) {
  document.getElementById(name + '-panel').classList.remove('show');
}

// ====== 设置管理 ======
function loadSettings() {
  document.getElementById('s-gateway').value = getSetting('gateway', '');
  document.getElementById('s-model').value = getSetting('model', '');
  document.getElementById('s-context').value = getSetting('contextN', '20');
  document.getElementById('ctx-val').textContent = getSetting('contextN', '20');
  document.getElementById('s-temp').value = getSetting('temperature', '0.7');
  document.getElementById('temp-val').textContent = getSetting('temperature', '0.7');
  document.getElementById('s-thinking').value = getSetting('thinkingBudget', '0');
  document.getElementById('think-val').textContent = getSetting('thinkingBudget', '0');
  document.getElementById('s-prompt').value = getSetting('sysPrompt', '');
  document.getElementById('s-proactive-delay').value = getSetting('proactiveDelay', '40');
  document.getElementById('proactive-val').textContent = getSetting('proactiveDelay', '40');
  document.getElementById('s-rag-threshold').value = getSetting('ragThreshold', '0.7');
  document.getElementById('rag-val').textContent = getSetting('ragThreshold', '0.7');
  document.getElementById('s-rag-count').value = getSetting('ragCount', '5');
  document.getElementById('ragc-val').textContent = getSetting('ragCount', '5');

  // 辅助模型
  document.getElementById('s-vice-url').value = getSetting('viceUrl', '');
  document.getElementById('s-vice-key').value = getSetting('viceKey', '');
  document.getElementById('s-vice-model').value = getSetting('viceModel', '');
  document.getElementById('s-embed-url').value = getSetting('embedUrl', '');
  document.getElementById('s-embed-key').value = getSetting('embedKey', '');
  document.getElementById('s-embed-model').value = getSetting('embedModel', '');
  document.getElementById('s-vision-url').value = getSetting('visionUrl', '');
  document.getElementById('s-vision-key').value = getSetting('visionKey', '');
  document.getElementById('s-vision-model').value = getSetting('visionModel', '');

  // Toggles
  if (getSetting('proactiveEnabled') === 'true') {
    document.getElementById('toggle-proactive').classList.add('on');
  }
  if (getSetting('sendLocation') === 'true') {
    document.getElementById('toggle-location').classList.add('on');
  }
  if (getSetting('streamEnabled', 'true') !== 'false') {
    document.getElementById('toggle-stream').classList.add('on');
  }

  // 供应商
  try { providers = JSON.parse(getSetting('providers', '[]')); } catch { providers = []; }
  activeProvider = parseInt(getSetting('activeProvider', '0'));

  // 收藏模型
  try { favoriteModels = JSON.parse(getSetting('favoriteModels', '[]')); } catch { favoriteModels = []; }

  // 归档状态
  isFirstAfterArchive = getSetting('isFirstAfterArchive', 'true') === 'true';

  renderProvidersList();
}

function saveSettings() {
  setSetting('gateway', document.getElementById('s-gateway').value.trim());
  setSetting('model', document.getElementById('s-model').value.trim());
  setSetting('contextN', document.getElementById('s-context').value);
  setSetting('temperature', document.getElementById('s-temp').value);
  setSetting('thinkingBudget', document.getElementById('s-thinking').value);
  setSetting('sysPrompt', document.getElementById('s-prompt').value);
  setSetting('proactiveDelay', document.getElementById('s-proactive-delay').value);
  setSetting('ragThreshold', document.getElementById('s-rag-threshold').value);
  setSetting('ragCount', document.getElementById('s-rag-count').value);

  // 辅助模型
  setSetting('viceUrl', document.getElementById('s-vice-url').value.trim());
  setSetting('viceKey', document.getElementById('s-vice-key').value.trim());
  setSetting('viceModel', document.getElementById('s-vice-model').value.trim());
  setSetting('embedUrl', document.getElementById('s-embed-url').value.trim());
  setSetting('embedKey', document.getElementById('s-embed-key').value.trim());
  setSetting('embedModel', document.getElementById('s-embed-model').value.trim());
  setSetting('visionUrl', document.getElementById('s-vision-url').value.trim());
  setSetting('visionKey', document.getElementById('s-vision-key').value.trim());
  setSetting('visionModel', document.getElementById('s-vision-model').value.trim());

  hidePanel('settings');
  startProactiveTimer(); // 重启定时器
  showStatus('设置已保存 ✓');
}

// ====== 状态栏 ======
function showStatus(msg, duration = 3000) {
  const bar = document.getElementById('status-bar');
  bar.textContent = msg;
  bar.classList.add('show');
  setTimeout(() => bar.classList.remove('show'), duration);

  // 记录到日志
  const now = new Date();
  const timeStr = String(now.getHours()).padStart(2, '0') + ':' +
    String(now.getMinutes()).padStart(2, '0') + ':' +
    String(now.getSeconds()).padStart(2, '0');
  activityLogs.unshift({ time: timeStr, msg });
  if (activityLogs.length > 200) activityLogs.pop();
  localStorage.setItem('activityLogs', JSON.stringify(activityLogs));
}

// ====== 供应商管理 ======
function addProvider() {
  const name = document.getElementById('new-provider-name').value.trim();
  const url = document.getElementById('new-provider-url').value.trim();
  const key = document.getElementById('new-provider-key').value.trim();
  if (!name || !url || !key) { alert('请填写完整'); return; }
  providers.push({ name, url, key });
  setSetting('providers', JSON.stringify(providers));
  document.getElementById('new-provider-name').value = '';
  document.getElementById('new-provider-url').value = '';
  document.getElementById('new-provider-key').value = '';
  renderProvidersList();
  updateProviderTags();
}

function removeProvider(index) {
  providers.splice(index, 1);
  if (activeProvider >= providers.length) activeProvider = Math.max(0, providers.length - 1);
  setSetting('providers', JSON.stringify(providers));
  setSetting('activeProvider', String(activeProvider));
  renderProvidersList();
  updateProviderTags();
}

function setActiveProvider(index) {
  activeProvider = index;
  setSetting('activeProvider', String(index));
  updateProviderTags();
}

function renderProvidersList() {
  const el = document.getElementById('providers-list');
  if (providers.length === 0) {
    el.innerHTML = '<p style="font-size:13px;color:var(--text2);">还没有添加供应商</p>';
    return;
  }
  el.innerHTML = providers.map((p, i) => `
    <div class="setting-row">
      <span style="font-size:13px;flex:0.3;">${p.name}</span>
      <span style="font-size:12px;color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;">${p.url}</span>
      <button class="small-btn danger" onclick="removeProvider(${i})">删除</button>
    </div>
  `).join('');
}

function updateProviderTags() {
  const el = document.getElementById('provider-tags');
  if (providers.length === 0) {
    el.innerHTML = '<span style="font-size:12px;color:var(--text2);">请先添加供应商</span>';
    return;
  }
  el.innerHTML = providers.map((p, i) => `
    <span class="provider-tag ${i === activeProvider ? 'active' : ''}" onclick="setActiveProvider(${i})">
      ${p.name}
    </span>
  `).join('');
}

function getActiveProvider() {
  if (providers.length === 0) return null;
  return providers[activeProvider] || providers[0];
}

// ====== 模型选择器 ======
function showModelDropdown() {

  if (allModels.length === 0) fetchModels();
}

document.addEventListener('click', (e) => {

    document.getElementById('model-dropdown').classList.remove('show');
  }
});

async function fetchModels() {
  const provider = getActiveProvider();
  const gateway = getSetting('gateway');
  if (!provider && !gateway) { alert('请先设置供应商或网关地址'); return; }

  showStatus('正在获取模型列表...');
  try {
    let data;
    if (gateway) {
      const res = await fetch(gateway + '/api/models', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ api_url: provider?.url, api_key: provider?.key }),
      });
      data = await res.json();
    } else {
      const res = await fetch(provider.url + '/models', {
        headers: { 'Authorization': 'Bearer ' + provider.key },
      });
      data = await res.json();
    }
    allModels = (data.data || []).map(m => m.id).sort();
    renderModelList('');
    showStatus(`已加载 ${allModels.length} 个模型`);
  } catch (e) {
    showStatus('获取模型列表失败: ' + e.message);
  }
}

function filterModels(keyword) {
  renderModelList(keyword);
}

function renderModelList(filter) {
  const list = document.getElementById('model-list');
  const kw = filter.toLowerCase();
  const faved = allModels.filter(m => favoriteModels.includes(m) && (!kw || m.toLowerCase().includes(kw)));
  const others = allModels.filter(m => !favoriteModels.includes(m) && (!kw || m.toLowerCase().includes(kw)));

  let html = '';
  if (faved.length > 0) {
    html += '<div class="model-section-title">⭐ 收藏</div>';
    html += faved.map(m => modelItemHtml(m, true)).join('');
  }
  if (others.length > 0) {
    html += '<div class="model-section-title">全部模型</div>';
    html += others.map(m => modelItemHtml(m, false)).join('');
  }
  if (!html) html = '<div style="padding:12px;color:var(--text2);font-size:13px;">无匹配模型</div>';
  list.innerHTML = html;
}

function modelItemHtml(modelId, isFaved) {
  return `<div class="model-item">
    <span onclick="selectModel('${modelId}')">${modelId}</span>
    <span class="star ${isFaved ? 'faved' : ''}" onclick="toggleFavorite(event,'${modelId}')">
      ${isFaved ? '★' : '☆'}
    </span>
  </div>`;
}

function selectModel(modelId) {
  document.getElementById('s-model').value = modelId;
  document.getElementById('model-dropdown').classList.remove('show');
}

function toggleFavorite(e, modelId) {
  e.stopPropagation();
  const idx = favoriteModels.indexOf(modelId);
  if (idx >= 0) favoriteModels.splice(idx, 1);
  else favoriteModels.push(modelId);
  setSetting('favoriteModels', JSON.stringify(favoriteModels));
  renderModelList(document.querySelector('.model-search')?.value || '');
}

// ====== 工具函数 ======
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
function renderMarkdown(text) {
  if (!text) return '';
  try {
    let html = marked.parse(text, { breaks: true });
    // 后处理：给代码块加复制按钮和折叠
    html = html.replace(/<pre><code(?: class="language-(\w+)")?>([\s\S]*?)<\/code><\/pre>/g,
      (match, lang, code) => {
        const langLabel = lang || 'code';
        const lineCount = code.split('\n').length;
        const needCollapse = lineCount > 12;
        const id = 'code-' + Math.random().toString(36).slice(2, 8);
        return `<div class="code-collapse ${needCollapse ? 'collapsed' : ''}" id="${id}">
          <div class="code-header">
            <span>${langLabel}</span>
            <button class="copy-btn" onclick="copyCode(this)">复制</button>
          </div>
          <pre><code>${code}</code></pre>
          ${needCollapse ? `<div class="code-expand-btn" onclick="toggleCodeCollapse('${id}')">展开全部 (${lineCount}行)</div>` : ''}
        </div>`;
      }
    );
    return html;
  } catch { return text.replace(/\n/g, '<br>'); }
}

function copyCode(btn) {
  const pre = btn.closest('.code-collapse')?.querySelector('pre code')
    || btn.closest('.code-header')?.nextElementSibling?.querySelector('code');
  if (!pre) return;
  const text = pre.textContent;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '已复制 ✓';
    setTimeout(() => btn.textContent = '复制', 1500);
  }).catch(() => {
    btn.textContent = '失败';
    setTimeout(() => btn.textContent = '复制', 1500);
  });
}

function toggleCodeCollapse(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const isCollapsed = el.classList.contains('collapsed');
  el.classList.toggle('collapsed');
  const btn = el.querySelector('.code-expand-btn');
  if (btn) btn.textContent = isCollapsed ? '收起' : btn.textContent.replace('收起', '展开全部');
}
function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function scrollToBottom() {
  const el = document.getElementById('messages');
  requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
}

// ====== 渲染 ======
function renderAll() {
  const container = document.getElementById('messages');
  container.innerHTML = '';
  if (messages.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:var(--text2);margin-top:40vh;font-size:14px;">说点什么吧 ✨</div>';
    return;
  }
  messages.forEach((msg, i) => container.appendChild(createMsgEl(msg, i)));
  scrollToBottom();
}

function createMsgEl(msg, index) {
  const div = document.createElement('div');
  div.className = 'msg ' + (msg.role === 'user' ? 'user' : 'ai');
  if (msg.isProactive) div.classList.add('proactive');
  div.dataset.index = index;

  const activeV = msg.versions ? msg.versions[msg.activeVersion || 0] : msg;
  const content = activeV.content || '';
  const thinking = activeV.thinking || '';
  const timestamp = activeV.timestamp || msg.timestamp;
  const images = activeV.images || [];

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';

  let html = '';
  if (thinking && msg.role === 'assistant') {
    html += '<div class="thinking-block">'
      + '<div class="thinking-toggle" onclick="toggleThinking(this)">'
      + '<span class="thinking-arrow">▶</span> 思考过程</div>'
      + '<div class="thinking-content">' + escapeHtml(thinking) + '</div></div>';
  }
  if (images.length > 0) {
    html += images.map(img => `<img class="msg-image" src="${img.url}" onclick="window.open(this.src)">`).join('');
  }
  html += renderMarkdown(content);
  bubble.innerHTML = html;

  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = formatTime(timestamp);

  const actions = document.createElement('div');
  actions.className = 'msg-actions';

  const editBtn = document.createElement('button');
  editBtn.textContent = '编辑';
  editBtn.onclick = () => startEdit(index);
  actions.appendChild(editBtn);

  if (msg.role === 'assistant') {
    const retryBtn = document.createElement('button');
    retryBtn.textContent = '重试';
    retryBtn.onclick = () => retryMessage(index);
    actions.appendChild(retryBtn);
  }

  if (msg.versions && msg.versions.length > 1) {
    const nav = document.createElement('span');
    nav.className = 'version-nav';
    const prevBtn = document.createElement('button');
    prevBtn.textContent = '◀';
    prevBtn.onclick = () => switchVersion(index, -1);
    const nextBtn = document.createElement('button');
    nextBtn.textContent = '▶';
    nextBtn.onclick = () => switchVersion(index, 1);
    const label = document.createElement('span');
    label.style.margin = '0 4px';
    label.textContent = (msg.activeVersion + 1) + '/' + msg.versions.length;
    nav.appendChild(prevBtn);
    nav.appendChild(label);
    nav.appendChild(nextBtn);
    actions.appendChild(nav);
  }

  div.appendChild(bubble);
  div.appendChild(time);
  div.appendChild(actions);
  return div;
}

function toggleThinking(el) {
  el.querySelector('.thinking-arrow').classList.toggle('open');
  el.nextElementSibling.classList.toggle('show');
}

function switchVersion(index, dir) {
  const msg = messages[index];
  if (!msg.versions) return;
  const newV = msg.activeVersion + dir;
  if (newV < 0 || newV >= msg.versions.length) return;
  msg.activeVersion = newV;
  saveMessages();
  renderAll();
}
// ====== 编辑 ======
function startEdit(index) {
  const msgEl = document.querySelector('.msg[data-index="' + index + '"]');
  const bubble = msgEl.querySelector('.msg-bubble');
  const actions = msgEl.querySelector('.msg-actions');

  const activeV = messages[index].versions
    ? messages[index].versions[messages[index].activeVersion || 0]
    : messages[index];

  bubble.textContent = activeV.content;
  bubble.contentEditable = true;
  bubble.focus();
  actions.style.display = 'none';

  const editActs = document.createElement('div');
  editActs.className = 'edit-actions';

  const saveBtn = document.createElement('button');
  saveBtn.className = 'edit-save';
  saveBtn.textContent = '保存';
  saveBtn.onclick = () => {
    const newText = bubble.textContent;
    if (messages[index].versions) {
      messages[index].versions[messages[index].activeVersion].content = newText;
    } else {
      messages[index].content = newText;
    }
    saveMessages();
    renderAll();
  };

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'edit-cancel';
  cancelBtn.textContent = '取消';
  cancelBtn.onclick = () => renderAll();

  editActs.appendChild(saveBtn);
  editActs.appendChild(cancelBtn);
  msgEl.appendChild(editActs);
}

// ====== 图片处理 ======
function handleImageSelect(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    const base64 = e.target.result;
    const placeholder = `[image:${Date.now()}]`;
    pendingImage = { url: base64, placeholder };

    document.getElementById('img-preview').style.display = 'flex';
    document.getElementById('img-preview-src').src = base64;
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

function removeImage() {
  pendingImage = null;
  document.getElementById('img-preview').style.display = 'none';
  document.getElementById('img-preview-src').src = '';
}
  
// ====== 文件处理 ======
function handleFileSelect(event) {
  const file = event.target.files[0];
  if (!file) return;

  if (file.size > 500 * 1024) {
    alert('文件太大了（超过500KB），建议截取关键部分粘贴');
    event.target.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    const content = e.target.result;
    const input = document.getElementById('input');
    const fileBlock = `📎 ${file.name}\n\`\`\`\n${content}\n\`\`\``;
    input.value = input.value ? input.value + '\n\n' + fileBlock : fileBlock;
    autoResize(input);
    input.focus();
    showStatus('文件已读取：' + file.name + ' ✓');
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ====== 输入 ======
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 768) {

}

  if (messages.length > 0) {

// ====== 获取配置对象 ======
function buildConfig() {
  const provider = getActiveProvider();
  const config = {
    model: getSetting('model', ''),
    temperature: parseFloat(getSetting('temperature', '0.7')),
    context_n: parseInt(getSetting('contextN', '20')),
    thinking_budget: parseInt(getSetting('thinkingBudget', '0')),
    rag_threshold: parseFloat(getSetting('ragThreshold', '0.7')),
    rag_count: parseInt(getSetting('ragCount', '5')),
    stream: getSetting('streamEnabled', 'true') !== 'false',
  };

  // 主模型从供应商取
  if (provider) {
    config.main_api_url = provider.url;
    config.main_api_key = provider.key;
  }

  // 辅助模型覆盖
  const viceUrl = getSetting('viceUrl');
  const viceKey = getSetting('viceKey');
  const viceModel = getSetting('viceModel');
  if (viceUrl) config.vice_api_url = viceUrl;
  if (viceKey) config.vice_api_key = viceKey;
  if (viceModel) config.vice_model = viceModel;

  const embedUrl = getSetting('embedUrl');
  const embedKey = getSetting('embedKey');
  const embedModel = getSetting('embedModel');
  if (embedUrl) config.embed_api_url = embedUrl;
  if (embedKey) config.embed_api_key = embedKey;
  if (embedModel) config.embed_model = embedModel;

  const visionUrl = getSetting('visionUrl');
  const visionKey = getSetting('visionKey');
  const visionModel = getSetting('visionModel');
  if (visionUrl) config.vision_api_url = visionUrl;
  if (visionKey) config.vision_api_key = visionKey;
  if (visionModel) config.vision_model = visionModel;

  return config;
}

// ====== 构建发送消息列表 ======
function buildApiMessages() {
  return messages.map(m => {
    const v = m.versions ? m.versions[m.activeVersion || 0] : m;
    return {
      role: m.role,
      content: v.content || '',
      timestamp: v.timestamp || m.timestamp || '',
    };
  });
}

// ====== 发送消息 ======
async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if ((!text && !pendingImage) || isGenerating) return;

  const gateway = getSetting('gateway');
  const config = buildConfig();
  if (!gateway) { alert('请先在设置中填写网关地址'); return; }
  if (!config.model) { alert('请先选择模型'); return; }

  // 构建用户消息内容
  let userContent = text;
  let userImages = [];
  let imagePayload = null;

  if (pendingImage) {
    userContent += (userContent ? '\n' : '') + pendingImage.placeholder;
    userImages = [{ url: pendingImage.url }];
    imagePayload = [{ url: pendingImage.url, placeholder: pendingImage.placeholder }];
    removeImage();
  }

  // 用户消息
  messages.push({
    role: 'user',
    versions: [{
      content: userContent,
      timestamp: new Date().toISOString(),
      images: userImages.map(img => ({ url: '[已发送]', alt: '图片' })),
    }],
    activeVersion: 0,
  });
  input.value = '';
  input.style.height = 'auto';

  // AI占位
  messages.push({
    role: 'assistant',
    versions: [{ content: '', timestamp: '', thinking: '' }],
    activeVersion: 0,
  });
  saveMessages();
  renderAll();

  // 重置主动消息定时器
  resetProactiveTimer();

  await generateResponse(messages.length - 1, imagePayload);
}

// ====== Retry ======
function retryMessage(index) {
  if (isGenerating) return;
  const msg = messages[index];
  if (msg.role !== 'assistant') return;

  if (!msg.versions) {
    msg.versions = [{ content: msg.content || '', timestamp: msg.timestamp || '', thinking: msg.thinking || '' }];
    msg.activeVersion = 0;
    delete msg.content;
    delete msg.timestamp;
    delete msg.thinking;
  }

  msg.versions.push({ content: '', timestamp: '', thinking: '' });
  msg.activeVersion = msg.versions.length - 1;
  saveMessages();

  generateResponse(index);
}

// ====== 流式生成 ======
async function generateResponse(aiIndex, images = null) {
  isGenerating = true;
  document.getElementById('send-btn').disabled = true;

  const container = document.getElementById('messages');
  const aiMsgEl = container.querySelector('.msg[data-index="' + aiIndex + '"]');
  const aiBubble = aiMsgEl.querySelector('.msg-bubble');
  aiBubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  // 停止生成按钮
  const stopBtn = document.createElement('button');
  stopBtn.className = 'stop-btn';
  stopBtn.textContent = '⏹ 停止';
  stopBtn.onclick = () => {
    if (currentAbortController) {
      currentAbortController.abort();
      currentAbortController = null;
      stopBtn.remove();
    }
  };
  aiMsgEl.appendChild(stopBtn);


  const gateway = getSetting('gateway');
  const config = buildConfig();
  const contextN = parseInt(getSetting('contextN', '20'));

  // 构建API消息（去掉当前AI占位）
  const apiMessages = buildApiMessages().slice(0, aiIndex).slice(-contextN);

  const requestBody = {
    messages: apiMessages,
    system_prompt: getSetting('sysPrompt', ''),
    config,
    is_first_after_archive: isFirstAfterArchive,
  };

  if (images) requestBody.images = images;
  if (getSetting('sendLocation') === 'true' && currentLocation) {
    requestBody.location = currentLocation;
  }

  let fullContent = '';
  let thinkingContent = '';
  let inThinking = false;


  try {
     currentAbortController = new AbortController();
     const response = await fetch(gateway + '/api/chat', {
       method: 'POST',
       headers: { 'Content-Type': 'application/json' },
       body: JSON.stringify(requestBody),
       signal: currentAbortController.signal,
     });


    if (!response.ok) {
      const errText = await response.text();
      throw new Error('API 错误: ' + response.status + ' ' + errText);
    }

    // 首条消息后不再触发天气
    isFirstAfterArchive = false;
    setSetting('isFirstAfterArchive', 'false');


    const isStream = getSetting('streamEnabled', 'true') !== 'false';

    if (!isStream) {
      // 非流式
      const data = await response.json();
      const choice = data.choices?.[0];
      if (choice) {
        fullContent = choice.message?.content || '';
        thinkingContent = choice.message?.reasoning_content || '';
      }
      aiBubble.innerHTML = renderMarkdown(fullContent);
      scrollToBottom();
    } else {
      // 流式
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';

        for (const line of lines) {
          if (!line.startsWith('data:')) continue;
          const dataStr = line.slice(5).trim();
          if (dataStr === '[DONE]') continue;

          try {
            const json = JSON.parse(dataStr);
            const delta = json.choices?.[0]?.delta;
            if (!delta) continue;

            if (delta.reasoning_content) {
              inThinking = true;
              thinkingContent += delta.reasoning_content;
              aiBubble.innerHTML = '<div class="thinking-block">'
                + '<div class="thinking-toggle"><span class="thinking-arrow open">▶</span> 思考中...</div>'
                + '<div class="thinking-content show">' + escapeHtml(thinkingContent) + '</div></div>';
              scrollToBottom();
              continue;
            }

            if (delta.content) {
              if (inThinking) inThinking = false;
              fullContent += delta.content;
              let displayHtml = '';
              if (thinkingContent) {
                displayHtml += '<div class="thinking-block">'
                  + '<div class="thinking-toggle" onclick="toggleThinking(this)">'
                  + '<span class="thinking-arrow">▶</span> 思考过程</div>'
                  + '<div class="thinking-content">' + escapeHtml(thinkingContent) + '</div></div>';
              }
              displayHtml += renderMarkdown(fullContent);
              aiBubble.innerHTML = displayHtml;
              scrollToBottom();
            }
          } catch (parseErr) {}
        }
      }
    }
    // 如果页面在后台，请求Worker发送推送通知
    if (document.hidden) {
      fetch(gateway + '/api/push/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          title: '听月回复你了 💓', 
          body: fullContent.slice(0, 50) + (fullContent.length > 50 ? '...' : '')
        }),
      }).catch(() => {});
    }

    
    // 移除停止按钮
    const existingStop = aiMsgEl.querySelector('.stop-btn');
    if (existingStop) existingStop.remove();
    // 检测并清理状态/缓存标记
    fullContent = await detectStatusTags(fullContent);
    // 检测红包
    checkForRedPacket(fullContent);
    // 后台通知
    if (document.hidden && Notification.permission === 'granted') {
      const preview = fullContent.slice(0, 50) + (fullContent.length > 50 ? '...' : '');
      new Notification('听月回复你了 💓', {
        body: preview,
        icon: '🌙',
      });
    }
    // 把清理后的内容存入当前版本
    const finalVersion = messages[aiIndex].versions[messages[aiIndex].activeVersion];
    finalVersion.content = fullContent;
    finalVersion.thinking = thinkingContent;
    finalVersion.timestamp = new Date().toISOString();
    saveMessages();
    renderAll();

   } catch (err) {
       showStatus('⚠ 生成失败: ' + err.message, 5000);
       // 不删除消息，显示重试按钮
       const retryBtn = document.createElement('button');
       retryBtn.className = 'stop-btn';
       retryBtn.textContent = '🔄 重试';
       retryBtn.onclick = () => {
         retryBtn.remove();
         generateResponse(aiIndex, images);
       };
       aiBubble.appendChild(retryBtn);
   }



  isGenerating = false;

// ====== 主动消息 ======
function startProactiveTimer() {
  stopProactiveTimer();
  if (getSetting('proactiveEnabled') !== 'true') return;

  const delay = parseInt(getSetting('proactiveDelay', '40')) * 60 * 1000;
  proactiveTimer = setInterval(() => checkProactive(), delay);
}

function stopProactiveTimer() {
  if (proactiveTimer) {
    clearInterval(proactiveTimer);
    proactiveTimer = null;
  }
}

function resetProactiveTimer() {
  startProactiveTimer();
}

async function checkProactive() {
  if (isGenerating) return;

  const gateway = getSetting('gateway');
  if (!gateway) return;

  // 计算沉默时长
  let lastUserTs = null;
  for (let i = messages.length - 1; i >= 0; i--) {
    if (messages[i].role === 'user') {
      const v = messages[i].versions ? messages[i].versions[messages[i].activeVersion || 0] : messages[i];
      lastUserTs = v.timestamp;
      break;
    }
  }
  if (!lastUserTs) return;

  const elapsed = Math.floor((Date.now() - new Date(lastUserTs)) / 60000);
  if (elapsed < 5) return;

  const config = buildConfig();
  const recentMsgs = buildApiMessages().slice(-6);

  try {
    const res = await fetch(gateway + '/api/proactive-check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: recentMsgs,
        config,
        elapsed_minutes: elapsed,
      }),
    });
    const result = await res.json();

    if (result.should_speak) {
      // 触发主模型生成主动消息
      messages.push({
        role: 'assistant',
        versions: [{ content: '', timestamp: '', thinking: '' }],
        activeVersion: 0,
        isProactive: true,
      });
      saveMessages();
      renderAll();
      await generateResponse(messages.length - 1);
    }
  } catch (e) {
    console.error('主动消息检查失败:', e);
  }
}
// ====== 归档 ======
async function archiveToday() {
  if (messages.length === 0) { alert('没有可归档的消息'); return; }

  const gateway = getSetting('gateway');
  if (!gateway) { alert('请先设置网关地址'); return; }

  // 确定日期（取第一条消息的日期）
  const firstTs = messages[0].versions
    ? messages[0].versions[0].timestamp
    : messages[0].timestamp;
  const date = firstTs ? firstTs.slice(0, 10) : new Date().toISOString().slice(0, 10);

  // 询问是否附带日记
  let diary = null;
  const writeDiary = confirm('是否同时写入日记？（点取消则只归档聊天记录）');
  if (writeDiary) {
    const content = prompt('请输入今日日记内容（或粘贴听月写的日记）：');
    if (content) {
      const periodStatus = prompt('经期状态（没有则留空）：');
      diary = { content, period_status: periodStatus || null };
    }
  }

  const config = buildConfig();
  const archiveMessages = messages.map(m => {
    const v = m.versions ? m.versions[m.activeVersion || 0] : m;
    return {
      role: m.role,
      content: v.content || '',
      timestamp: v.timestamp || m.timestamp || '',
    };
  });

  showStatus('正在归档...');

  try {
    const res = await fetch(gateway + '/api/archive', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date, messages: archiveMessages, diary, config }),
    });
    const result = await res.json();

    if (result.success) {
      showStatus('归档成功：' + date + ' ✓', 5000);
      // 标记下一条消息触发天气
      isFirstAfterArchive = true;
      setSetting('isFirstAfterArchive', 'true');
      // 保留最近40条消息作为上下文缓冲
      const keepN = 40;
      if (messages.length > keepN) {
        messages = messages.slice(-keepN);
      }
saveMessages();
renderAll();
    } else {
      showStatus('归档失败：' + (result.error || '未知错误'));
    }
  } catch (e) {
    showStatus('归档失败：' + e.message);
  }
}

// ====== 导出 TXT ======
function exportTxt() {
  if (messages.length === 0) { alert('没有可导出的消息'); return; }

  const firstTs = messages[0].versions
    ? messages[0].versions[0].timestamp
    : messages[0].timestamp;
  const date = firstTs ? firstTs.slice(0, 10) : new Date().toISOString().slice(0, 10);

  let txt = `星月栖 · 聊天记录\n日期：${date}\n${'='.repeat(40)}\n\n`;

  messages.forEach(m => {
    const v = m.versions ? m.versions[m.activeVersion || 0] : m;
    const name = m.role === 'user' ? '星语' : '听月';
    const time = v.timestamp ? `[${v.timestamp.slice(11, 16)}] ` : '';
    txt += `${time}${name}：\n${v.content || ''}\n\n`;
  });

  const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `星月栖_${date}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  showStatus('已导出 TXT ✓');
}

        content.innerHTML = '<p style="color:var(--text2);">暂无日记</p>';

    } else if (currentMemoryTab === 'chatlogs') {

    }
  } catch (e) {

async function searchMemory() {
  const keyword = document.getElementById('memory-search').value.trim();
  if (!keyword) { loadMemoryTab(); return; }

  const gateway = getSetting('gateway');
  if (!gateway) return;

  const content = document.getElementById('memory-content');
  content.innerHTML = '<p style="color:var(--text2);">搜索中...</p>';

  try {
    if (currentMemoryTab === 'core') {
      const res = await fetch(gateway + '/api/memory/core?category=' + encodeURIComponent(keyword));
      const data = await res.json();
      content.innerHTML = Array.isArray(data) && data.length > 0
        ? data.map(m => `<div class="memory-card"><h4>[${escapeHtml(m.category)}] ${escapeHtml(m.title)}</h4><p>${escapeHtml(m.content).replace(/\n/g, '<br>')}</p></div>`).join('')
        : '<p style="color:var(--text2);">未找到匹配的记忆</p>';

    } else if (currentMemoryTab === 'diaries') {
      const res = await fetch(gateway + '/api/memory/diaries?keyword=' + encodeURIComponent(keyword));
      const data = await res.json();
      content.innerHTML = Array.isArray(data) && data.length > 0
        ? data.map(d => `<div class="memory-card"><h4>📅 ${escapeHtml(d.date)}</h4><p>${escapeHtml(d.content).replace(/\n/g, '<br>')}</p></div>`).join('')
        : '<p style="color:var(--text2);">未找到匹配的日记</p>';

    } else if (currentMemoryTab === 'chatlogs') {
      // 判断是日期还是关键词
      const isDate = /^\d{4}-\d{2}-\d{2}$/.test(keyword);
      let url;
      if (isDate) {
        url = gateway + '/api/memory/chatlogs/' + keyword;
      } else {
        url = gateway + '/api/memory/chatlogs?keyword=' + encodeURIComponent(keyword);
      }
      const res = await fetch(url);
      const data = await res.json();

      if (isDate && data.content) {
        content.innerHTML = `<div class="memory-card"><h4>📅 ${keyword}</h4><p style="white-space:pre-wrap;">${escapeHtml(data.content)}</p></div>`;
      } else if (Array.isArray(data) && data.length > 0) {
        content.innerHTML = data.map(r => `
          <div class="memory-card">
            <h4>📅 ${escapeHtml(r.date)}</h4>
            ${r.snippets.map(s => `<p style="white-space:pre-wrap;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:8px;">${escapeHtml(s)}</p>`).join('')}
          </div>
        `).join('');
      } else {
        content.innerHTML = '<p style="color:var(--text2);">未找到匹配的聊天记录</p>';
      }
    }
  } catch (e) {
    content.innerHTML = `<p style="color:var(--danger);">搜索失败：${escapeHtml(e.message)}</p>`;
  }
}

      try {

    const list = document.getElementById('cal-events-list');

    if (!Array.isArray(events) || events.length === 0) {
      list.innerHTML = '<p style="color:var(--text2);font-size:13px;">暂无待办事项</p>';
      return;
    }

    const today = new Date().toISOString().slice(0, 10);

    list.innerHTML = events.map(ev => {
      const evDate = new Date(ev.date + 'T00:00:00+08:00');
      const todayDate = new Date(today + 'T00:00:00+08:00');
      const diff = Math.ceil((evDate - todayDate) / (1000 * 60 * 60 * 24));
      let countdown, countdownClass;
      if (diff < 0) {
        countdown = Math.abs(diff) + '天前';
        countdownClass = 'past';
      } else if (diff === 0) {
        countdown = '今天';
        countdownClass = '';
      } else if (diff === 1) {
        countdown = '明天';
        countdownClass = '';
      } else {
        countdown = diff + '天后';
        countdownClass = '';
      }

      return '<div class="cal-item">'
        + '<div class="cal-info">'
        + '<div class="cal-date">' + escapeHtml(ev.date) + '</div>'
        + '<div class="cal-event">' + escapeHtml(ev.event) + '</div>'
        + '</div>'
        + '<span class="cal-countdown ' + countdownClass + '">' + countdown + '</span>'
        + '<button class="cal-delete" onclick="deleteCalendarEvent(' + ev.id + ')" title="删除">✕</button>'
        + '</div>';
    }).join('');

  } catch (e) {
    document.getElementById('cal-events-list').innerHTML = '<p style="color:var(--danger);">加载失败：' + escapeHtml(e.message) + '</p>';
  }
}

async function addCalendarEvent() {
  const date = document.getElementById('cal-new-date').value;
  const event = document.getElementById('cal-new-event').value.trim();
  if (!date || !event) { alert('请填写日期和事件'); return; }

  const gateway = getSetting('gateway');
  if (!gateway) return;

  try {
    const res = await fetch(gateway + '/api/calendar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date, event }),
    });
    const result = await res.json();
    if (result.success) {
      document.getElementById('cal-new-date').value = '';
      document.getElementById('cal-new-event').value = '';
      showStatus('待办已添加 ✓');
      loadCalendarEvents();
    }
  } catch (e) {
    showStatus('添加失败：' + e.message);
  }
}

async function deleteCalendarEvent(id) {
  if (!confirm('删除这条待办？')) return;

  const gateway = getSetting('gateway');
  if (!gateway) return;

  try {
    const res = await fetch(gateway + '/api/calendar/' + id, { method: 'DELETE' });
    const result = await res.json();
    if (result.success) {
      showStatus('已删除 ✓');
      loadCalendarEvents();
    }
  } catch (e) {
    showStatus('删除失败：' + e.message);
  }
}

// ====== 状态/缓存标记检测 ======
async function detectStatusTags(content) {
  const gateway = getSetting('gateway');
  if (!gateway) return content;

  let cleaned = content;

  const statusRegex = /<<状态>>([\s\S]*?)<<\/状态>>/g;
  let m;
  while ((m = statusRegex.exec(content)) !== null) {
    const val = m[1].trim();
    if (val) {
      try {
        await fetch(gateway + '/api/status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'status', content: val }),
        });
        showStatus('状态已记录 ✓');
      } catch (e) { 
        console.error('存储状态失败:', e);
        showStatus('⚠ 状态存储失败: ' + e.message, 3000);
      }
    }
    cleaned = cleaned.replace(m[0], '');
  }

  const cacheRegex = /<<缓存>>([\s\S]*?)<<\/缓存>>/g;
  while ((m = cacheRegex.exec(content)) !== null) {
    const val = m[1].trim();
    if (val) {
      try {
        await fetch(gateway + '/api/status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'cache', content: val }),
        });
        showStatus('缓存已记录 ✓');
      } catch (e) { 
        console.error('存储缓存失败:', e);
        showStatus('⚠ 缓存存储失败: ' + e.message, 3000);
      }
    }
    cleaned = cleaned.replace(m[0], '');
  }

  return cleaned.trim();
}

// ====== Web Push 订阅 ======
async function subscribePush() {
  const gateway = getSetting('gateway');
  const vapidPublicKey = 'BGgOWrHs5ebFeoU_MpS4yHjADrxtJrveWF0qLPYeJcuQdETNo-MKn4QlfUiJqCWBRy-qWAuGTG9BA7fxGm_KLsM';
  
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    showStatus('⚠ 浏览器不支持推送通知', 3000);
    return;
  }

  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      showStatus('⚠ 通知权限被拒绝', 3000);
      return;
    }

    const reg = await navigator.serviceWorker.ready;
    
    // 检查是否已订阅
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      // urlBase64转Uint8Array
      const padding = '='.repeat((4 - vapidPublicKey.length % 4) % 4);
      const base64 = (vapidPublicKey + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      const applicationServerKey = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; i++) {
        applicationServerKey[i] = rawData.charCodeAt(i);
      }

      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey,
      });

    }

    // 发送订阅信息到网关存储
    const subJson = sub.toJSON();
    const res = await fetch(gateway + '/api/push/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        endpoint: subJson.endpoint,
        p256dh: subJson.keys.p256dh,
        auth: subJson.keys.auth,
      }),
    });

    if (res.ok) {
      showStatus('推送通知已开启 ✓');
    } else {
      showStatus('⚠ 订阅保存失败', 3000);
    }
  } catch (e) {
    console.error('推送订阅失败:', e);
    showStatus('⚠ 推送订阅失败: ' + e.message, 3000);
  }
}

  
// ====== PWA ======
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
