<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>星月栖</title>
<meta name="theme-color" content="#0f0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #0f0f1a;
  --surface: #1a1a2e;
  --surface2: #232340;
  --border: #2a2a4a;
  --text: #e8e8f0;
  --text2: #9898b0;
  --accent: #6c8dca;
  --accent2: #4a6fa5;
  --user-bg: #2a3a5c;
  --ai-bg: #1e1e35;
  --radius: 14px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html, body { 
  height:100%; background:var(--bg); color:var(--text); 
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow:hidden; 
}
/* ===== 布局 ===== */
#app { display:flex; flex-direction:column; height:100%; }
#header { 
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px; background:var(--surface); 
  border-bottom:1px solid var(--border);
  padding-top: max(12px, env(safe-area-inset-top));
}
#header h1 { font-size:17px; font-weight:600; }
#header button { 
  background:none; border:none; color:var(--text2); 
  font-size:20px; padding:4px 8px; cursor:pointer; 
}
#messages { 
  flex:1; overflow-y:auto; padding:12px 16px; 
  scroll-behavior:smooth;
  -webkit-overflow-scrolling: touch;
}
/* ===== 消息 ===== */
.msg { 
  display:flex; flex-direction:column; margin-bottom:12px; 
  max-width:85%; animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
.msg.user { align-self:flex-end; align-items:flex-end; }
.msg.ai { align-self:flex-start; align-items:flex-start; }
.msg-bubble { 
  padding:10px 14px; border-radius:var(--radius); 
  font-size:15px; line-height:1.6; word-break:break-word;
  position:relative;
}
.msg.user .msg-bubble { 
  background:var(--user-bg); 
  border-bottom-right-radius:4px; 
}
.msg.ai .msg-bubble { 
  background:var(--ai-bg); 
  border-bottom-left-radius:4px; 
}
.msg-time { font-size:11px; color:var(--text2); margin-top:3px; padding:0 4px; }
.msg-bubble p { margin:0.4em 0; }
.msg-bubble p:first-child { margin-top:0; }
.msg-bubble p:last-child { margin-bottom:0; }
.msg-bubble code { 
  background:rgba(255,255,255,0.08); padding:1px 5px; 
  border-radius:4px; font-size:13px; 
}
.msg-bubble pre { 
  background:rgba(0,0,0,0.3); padding:10px; 
  border-radius:8px; overflow-x:auto; margin:0.5em 0;
}
.msg-bubble pre code { background:none; padding:0; }
.msg-bubble blockquote {
  border-left:3px solid var(--accent); padding-left:10px;
  color:var(--text2); margin:0.5em 0; font-style:italic;
}
.msg-bubble em { color:#c8a8d8; }
.msg-bubble strong { color:#d8d0f0; }
/* 编辑 */
.msg-bubble[contenteditable=true] { 
  outline:1px solid var(--accent); 
  border-radius:var(--radius);
}
.edit-btn { 
  display:none; background:var(--surface2); border:1px solid var(--border);
  color:var(--text2); font-size:11px; padding:2px 8px; 
  border-radius:6px; cursor:pointer; margin-top:3px;
}
.msg:hover .edit-btn, .msg:active .edit-btn { display:inline-block; }
.edit-actions { display:flex; gap:6px; margin-top:4px; }
.edit-actions button {
  font-size:12px; padding:3px 10px; border-radius:6px; 
  border:none; cursor:pointer;
}
.edit-save { background:var(--accent); color:white; }
.edit-cancel { background:var(--surface2); color:var(--text2); border:1px solid var(--border) !important; }
/* ===== 输入区 ===== */
#input-area { 
  display:flex; align-items:flex-end; gap:8px;
  padding:10px 12px; background:var(--surface); 
  border-top:1px solid var(--border);
  padding-bottom: max(10px, var(--safe-bottom));
}
#input { 
  flex:1; background:var(--surface2); border:1px solid var(--border);
  color:var(--text); border-radius:20px; padding:10px 16px;
  font-size:15px; line-height:1.4; resize:none;
  max-height:120px; outline:none; font-family:inherit;
}
#input:focus { border-color:var(--accent); }
#input::placeholder { color:var(--text2); }
#send-btn { 
  background:var(--accent); border:none; color:white;
  width:38px; height:38px; border-radius:50%; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:18px; flex-shrink:0; transition:opacity 0.2s;
}
#send-btn:disabled { opacity:0.4; }
#send-btn:active { transform:scale(0.95); }
/* ===== 设置页 ===== */
#settings-overlay {
  display:none; position:fixed; inset:0; background:var(--bg);
  z-index:100; overflow-y:auto;
  padding: max(12px, env(safe-area-inset-top)) 16px 32px;
}
#settings-overlay.show { display:block; }
#settings-overlay h2 { font-size:18px; margin-bottom:16px; }
.setting-group { margin-bottom:20px; }
.setting-group label { 
  display:block; font-size:13px; color:var(--text2); 
  margin-bottom:5px; 
}
.setting-group input, .setting-group textarea, .setting-group select { 
  width:100%; background:var(--surface2); border:1px solid var(--border);
  color:var(--text); padding:10px 12px; border-radius:10px;
  font-size:14px; font-family:inherit; outline:none;
}
.setting-group input:focus, .setting-group textarea:focus { border-color:var(--accent); }
.setting-group textarea { min-height:120px; resize:vertical; line-height:1.5; }
.settings-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.settings-header button { 
  background:var(--accent); border:none; color:white;
  padding:6px 16px; border-radius:8px; font-size:14px; cursor:pointer;
}
.supabase-status { 
  font-size:12px; padding:6px 10px; border-radius:8px; 
  background:var(--surface2); margin-top:6px; 
}
.status-ok { color:#6ecf6e; }
.status-err { color:#cf6e6e; }
/* ===== 加载动画 ===== */
.typing { display:flex; gap:4px; padding:4px 0; }
.typing span { 
  width:6px; height:6px; background:var(--text2); border-radius:50%;
  animation:bounce 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay:0.2s; }
.typing span:nth-child(3) { animation-delay:0.4s; }
@keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
/* ===== 新对话按钮 ===== */
.new-chat-btn {
  background:var(--surface2); border:1px solid var(--border);
  color:var(--text2); font-size:13px; padding:4px 10px;
  border-radius:8px; cursor:pointer;
}
/* scrollbar */
#messages::-webkit-scrollbar { width:4px; }
#messages::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <button onclick="newChat()" title="新对话">＋</button>
    <h1>星月栖</h1>
    <button onclick="toggleSettings()" title="设置">⚙</button>
  </div>
  <div id="messages"></div>
  <div id="input-area">
    <textarea id="input" rows="1" placeholder="说点什么..." 
      oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
    <button id="send-btn" onclick="sendMessage()">↑</button>
  </div>
</div>

<!-- 设置页 -->
<div id="settings-overlay">
  <div class="settings-header">
    <h2>⚙ 设置</h2>
    <button onclick="saveSettings()">保存</button>
  </div>

  <div class="setting-group">
    <label>API 地址（Base URL）</label>
    <input id="s-url" placeholder="https://az.zlapi.vip/v1">
  </div>
  <div class="setting-group">
    <label>API Key</label>
    <input id="s-key" type="password" placeholder="sk-...">
  </div>
  <div class="setting-group">
    <label>模型名称</label>
    <input id="s-model" placeholder="claude-opus-4-6-thinking">
  </div>
  <div class="setting-group">
    <label>上下文轮数（发送最近 n 轮对话）</label>
    <input id="s-context" type="number" value="20" min="1" max="100">
  </div>

  <hr style="border-color:var(--border); margin:20px 0;">

  <div class="setting-group">
    <label>Supabase URL</label>
    <input id="s-supa-url" placeholder="https://xxx.supabase.co">
  </div>
  <div class="setting-group">
    <label>Supabase Key</label>
    <input id="s-supa-key" type="password" placeholder="eyJ...">
  </div>
  <div class="setting-group">
    <button onclick="testSupabase()" style="background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;">
      测试连接 & 拉取核心记忆
    </button>
    <div id="supa-status" class="supabase-status" style="display:none;"></div>
  </div>

  <hr style="border-color:var(--border); margin:20px 0;">

  <div class="setting-group">
    <label>System Prompt</label>
    <textarea id="s-prompt" placeholder="在这里粘贴你的 system prompt..."></textarea>
  </div>

  <div style="margin-top:20px;">
    <button onclick="toggleSettings()" style="background:none;border:1px solid var(--border);color:var(--text2);padding:8px 20px;border-radius:8px;cursor:pointer;width:100%;">
      返回聊天
    </button>
  </div>
</div>

<!-- Markdown: 用 marked.js -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
// ====== 全局状态 ======
let messages = [];  // {role, content, timestamp}
let isGenerating = false;
let currentEditIndex = null;
let coreMemories = '';

// ====== 初始化 ======
window.onload = () => {
  loadSettings();
  loadMessages();
  renderAll();

  // 自动拉取核心记忆（如果已配置Supabase）
  const supaUrl = localStorage.getItem('supaUrl');
  const supaKey = localStorage.getItem('supaKey');
  if (supaUrl && supaKey) {
    fetchCoreMemories(supaUrl, supaKey);
  }
};

// ====== 设置 ======
function toggleSettings() {
  const el = document.getElementById('settings-overlay');
  el.classList.toggle('show');
}

function loadSettings() {
  document.getElementById('s-url').value = localStorage.getItem('apiUrl') || '';
  document.getElementById('s-key').value = localStorage.getItem('apiKey') || '';
  document.getElementById('s-model').value = localStorage.getItem('model') || '';
  document.getElementById('s-context').value = localStorage.getItem('contextN') || '20';
  document.getElementById('s-prompt').value = localStorage.getItem('sysPrompt') || '';
  document.getElementById('s-supa-url').value = localStorage.getItem('supaUrl') || '';
  document.getElementById('s-supa-key').value = localStorage.getItem('supaKey') || '';
}

function saveSettings() {
  localStorage.setItem('apiUrl', document.getElementById('s-url').value.trim());
  localStorage.setItem('apiKey', document.getElementById('s-key').value.trim());
  localStorage.setItem('model', document.getElementById('s-model').value.trim());
  localStorage.setItem('contextN', document.getElementById('s-context').value);
  localStorage.setItem('sysPrompt', document.getElementById('s-prompt').value);
  localStorage.setItem('supaUrl', document.getElementById('s-supa-url').value.trim());
  localStorage.setItem('supaKey', document.getElementById('s-supa-key').value.trim());
  toggleSettings();
}

// ====== Supabase ======
async function fetchCoreMemories(url, key) {
  try {
    const r = await fetch(`${url}/rest/v1/core_memories?select=category,title,content&order=id`, {
      headers: { 'apikey': key, 'Authorization': `Bearer ${key}` }
    });
    const data = await r.json();
    if (Array.isArray(data) && data.length > 0) {
      coreMemories = '\n\n## 核心记忆库\n\n' + 
        data.map(m => `### [${m.category}] ${m.title}\n${m.content}`).join('\n\n---\n\n');
      console.log(`✅ 已加载 ${data.length} 条核心记忆`);
      return data.length;
    }
  } catch(e) {
    console.error('拉取核心记忆失败:', e);
  }
  return 0;
}

async function testSupabase() {
  const url = document.getElementById('s-supa-url').value.trim();
  const key = document.getElementById('s-supa-key').value.trim();
  const status = document.getElementById('supa-status');
  status.style.display = 'block';
  status.textContent = '连接中...';
  status.className = 'supabase-status';

  if (!url || !key) {
    status.textContent = '❌ 请填写 URL 和 Key';
    status.classList.add('status-err');
    return;
  }

  const count = await fetchCoreMemories(url, key);
  if (count > 0) {
    status.textContent = `✅ 连接成功，已加载 ${count} 条核心记忆`;
    status.classList.add('status-ok');
  } else {
    status.textContent = '❌ 连接失败或无数据';
    status.classList.add('status-err');
  }
}

// ====== 消息管理 ======
function saveMessages() {
  localStorage.setItem('chatMessages', JSON.stringify(messages));
}

function loadMessages() {
  try {
    messages = JSON.parse(localStorage.getItem('chatMessages') || '[]');
  } catch { messages = []; }
}

function newChat() {
  if (messages.length > 0 && !confirm('开启新对话？当前对话会被清空（数据仍在浏览器中）')) return;
  // 存档旧对话
  if (messages.length > 0) {
    const key = `chat_archive_${Date.now()}`;
    localStorage.setItem(key, JSON.stringify(messages));
  }
  messages = [];
  saveMessages();
  renderAll();
}

// ====== 渲染 ======
function renderAll() {
  const container = document.getElementById('messages');
  container.innerHTML = '';
  if (messages.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:var(--text2);margin-top:40vh;font-size:14px;">说点什么吧 ✨</div>';
    return;
  }
  messages.forEach((msg, i) => {
    container.appendChild(createMsgEl(msg, i));
  });
  scrollToBottom();
}

function createMsgEl(msg, index) {
  const div = document.createElement('div');
  div.className = `msg ${msg.role === 'user' ? 'user' : 'ai'}`;
  div.dataset.index = index;

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = renderMarkdown(msg.content);

  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = formatTime(msg.timestamp);

  const editBtn = document.createElement('button');
  editBtn.className = 'edit-btn';
  editBtn.textContent = '编辑';
  editBtn.onclick = () => startEdit(index);

  div.appendChild(bubble);
  div.appendChild(time);
  div.appendChild(editBtn);
  return div;
}

function renderMarkdown(text) {
  if (!text) return '';
  try {
    return marked.parse(text, { breaks: true });
  } catch {
    return text.replace(/\n/g, '<br>');
  }
}

function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
}

function scrollToBottom() {
  const el = document.getElementById('messages');
  requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
}

// ====== 编辑 ======
function startEdit(index) {
  const msgEl = document.querySelector(`.msg[data-index="${index}"]`);
  const bubble = msgEl.querySelector('.msg-bubble');
  const editBtn = msgEl.querySelector('.edit-btn');

  // 切换到编辑模式：显示原始文本
  const rawText = messages[index].content;
  bubble.textContent = rawText;
  bubble.contentEditable = true;
  bubble.focus();
  editBtn.style.display = 'none';

  // 添加保存/取消按钮
  const actions = document.createElement('div');
  actions.className = 'edit-actions';
  actions.innerHTML = `
    <button class="edit-save" onclick="saveEdit(${index})">保存</button>
    <button class="edit-cancel" onclick="cancelEdit(${index})">取消</button>
  `;
  msgEl.appendChild(actions);
  currentEditIndex = index;
}

function saveEdit(index) {
  const msgEl = document.querySelector(`.msg[data-index="${index}"]`);
  const bubble = msgEl.querySelector('.msg-bubble');
  const newText = bubble.textContent;
  
  messages[index].content = newText;
  saveMessages();
  
  bubble.contentEditable = false;
  bubble.innerHTML = renderMarkdown(newText);
  msgEl.querySelector('.edit-actions')?.remove();
  msgEl.querySelector('.edit-btn').style.display = '';
  currentEditIndex = null;
}

function cancelEdit(index) {
  const msgEl = document.querySelector(`.msg[data-index="${index}"]`);
  const bubble = msgEl.querySelector('.msg-bubble');
  
  bubble.contentEditable = false;
  bubble.innerHTML = renderMarkdown(messages[index].content);
  msgEl.querySelector('.edit-actions')?.remove();
  msgEl.querySelector('.edit-btn').style.display = '';
  currentEditIndex = null;
}

// ====== 输入 ======
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  // PC: Enter发送, Shift+Enter换行
  // 手机: 正常换行，用按钮发送
  if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 768) {
    e.preventDefault();
    sendMessage();
  }
}

// ====== 发送 & 流式接收 ======
async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || isGenerating) return;

  const apiUrl = localStorage.getItem('apiUrl');
  const apiKey = localStorage.getItem('apiKey');
  const model = localStorage.getItem('model');

  if (!apiUrl || !apiKey || !model) {
    alert('请先在设置中填写 API 地址、Key 和模型名称');
    return;
  }

  // 添加用户消息
  messages.push({ 
    role: 'user', 
    content: text, 
    timestamp: new Date().toISOString() 
  });
  input.value = '';
  input.style.height = 'auto';
  saveMessages();
  renderAll();

  // 构建请求
  isGenerating = true;
  document.getElementById('send-btn').disabled = true;

  const sysPrompt = localStorage.getItem('sysPrompt') || '';
  const contextN = parseInt(localStorage.getItem('contextN') || '20');
  const recentMessages = messages.slice(-contextN).map(m => ({
    role: m.role === 'user' ? 'user' : 'assistant',
    content: m.content
  }));

  const systemContent = sysPrompt + coreMemories;

  const body = {
    model: model,
    messages: [
      { role: 'system', content: systemContent },
      ...recentMessages
    ],
    stream: true
  };

  // 添加空的AI消息占位
  messages.push({ 
    role: 'assistant', 
    content: '', 
    timestamp: new Date().toISOString() 
  });
  const aiIndex = messages.length - 1;
  renderAll();

  // 显示打字动画
  const container = document.getElementById('messages');
  const aiMsgEl = container.querySelector(`.msg[data-index="${aiIndex}"]`);
  const aiBubble = aiMsgEl.querySelector('.msg-bubble');
  aiBubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

  try {
    const response = await fetch(`${apiUrl}/chat/completions`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify(body)
    });

    if (!response.ok) {
      throw new Error(`API 错误: ${response.status} ${response.statusText}`);
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let fullContent = '';
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') continue;

        try {
          const json = JSON.parse(data);
          const delta = json.choices?.[0]?.delta?.content;
          if (delta) {
            fullContent += delta;
            aiBubble.innerHTML = renderMarkdown(fullContent);
            scrollToBottom();
          }
        } catch {}
      }
    }

    messages[aiIndex].content = fullContent;
    messages[aiIndex].timestamp = new Date().toISOString();
    saveMessages();
    renderAll();

  } catch (err) {
    aiBubble.innerHTML = `<span style="color:#cf6e6e;">⚠ ${err.message}</span>`;
    messages[aiIndex].content = `[错误] ${err.message}`;
    saveMessages();
  }

  isGenerating = false;
  document.getElementById('send-btn').disabled = false;
  scrollToBottom();
}

// ====== PWA Service Worker ======
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
